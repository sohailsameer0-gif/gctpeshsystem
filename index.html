var fmtDate = function(d){ if(!d) return '-'; var t = new Date(d); if(isNaN(t)) return '-'; return t.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' }); };
var fmtDT = function(d){ if(!d) return '-'; var t = new Date(d); if(isNaN(t)) return '-'; return t.toLocaleString('en-GB', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' }); };
var t2m = function(t){ if(!t) return 0; var p = String(t).split(':'); return Number(p[0]) * 60 + Number(p[1]); };
var num = function(v){ return Number(v || 0); };

      { email: 'parent.mech@gct.edu.pk', password: 'parent123', role: 'parent', displayName: 'Demo Parent', linkedRef: '__P1__' }

log('Constants loaded');

function getDepartments(){ return Object.keys(DEPARTMENTS).map(function(k){ return DEPARTMENTS[k]; }); }
function getDepartment(id){ return DEPARTMENTS[id] || DEPARTMENTS['btech-mechanical']; }
function getActiveDepartmentId(){ var id = null; try { id = localStorage.getItem(ACTIVE_DEPT_KEY); } catch(e){} return id || 'btech-mechanical'; }
function setActiveDepartment(id){ try { localStorage.setItem(ACTIVE_DEPT_KEY, id); } catch(e){} }

function makeInitialState(deptId){
  return {
    departmentId: deptId, session: null, settings: null,
    students: [], parents: [], parentLinks: [],
    teachers: [], semesters: [], sections: [],
    courses: [], courseAssignments: [], topics: [], timetable: [],
    attendanceSessions: [], attendanceRecords: [],
    leaveApplications: [], teacherLeaveApplications: [],
    lateScanRequests: [], substituteRequests: [],
    committees: [], committeeMembers: [], committeeMeetings: [],
    parentTeacherMeetings: [], notifications: [],
    promotions: [], exitRecords: [], warnings: [], auditLogs: [],
    accounts: [], assignments: [], assignmentSubmissions: [], sharedFiles: []
  };
}

function loadStateFor(deptId){
  try {
    var key = STORAGE_KEY + '_' + deptId;
    var raw = localStorage.getItem(key);
    if(!raw) return makeInitialState(deptId);
    var p = JSON.parse(raw);
    return Object.assign(makeInitialState(deptId), p);
  } catch(e){ return makeInitialState(deptId); }
}

function saveStateFor(deptId, stateObj){
  try { localStorage.setItem(STORAGE_KEY + '_' + deptId, JSON.stringify(stateObj)); } catch(e){ log('Save error', e); }
}

var state = loadStateFor(getActiveDepartmentId());
function saveState(){ saveStateFor(state.departmentId, state); }
function setState(partial, ev){
  Object.assign(state, partial);
  saveState();
  if(ev) emit(ev, state);
  emit('state:change', state);
}
function updateColl(name, fn){
  var patch = {};
  patch[name] = fn(state[name] || []);
  setState(patch, name + ':change');
}

var listeners = new Map();
function on(ev, h){ if(!listeners.has(ev)) listeners.set(ev, new Set()); listeners.get(ev).add(h); return function(){ listeners.get(ev).delete(h); }; }
function emit(ev, p){ var set = listeners.get(ev); if(set) set.forEach(function(h){ try { h(p); } catch(e){ log('Event error', e); } }); }

log('State loaded for department: ' + state.departmentId);

function audit(o){
  var row = { id: uid('log'), departmentId: state.departmentId, userId: o.userId || 'system', role: o.role || 'system', action: o.action, module: o.module, recordId: o.recordId || null, timestamp: nowIso() };
  updateColl('auditLogs', function(a){ return a.concat([row]); });
}

function makeDefaultSettings(dept){

    id: 'settings_' + dept.id,

    address: 'Kohat Road, Peshawar, Khyber Pakhtunkhwa',
    phone: '+92-91-9212739',
    email: 'GCT_Peshawar@kptevta.gov.pk',
    footerText: 'This is a computer-generated document. Verify with the department office.',
    shortageThreshold: dept.settings.shortageThreshold,

function getAvailableTeachersForSlot(slot){

    if(t.active === false) return false;
    if(t.id === slot.teacherId) return false;
    var conflict = state.timetable.some(function(x){
      if(x.id === slot.id) return false;
      if(x.day !== slot.day) return false;
      if(x.teacherId !== t.id) return false;
      var s1 = t2m(slot.startTime), e1 = t2m(slot.endTime);
      var s2 = t2m(x.startTime), e2 = t2m(x.endTime);
      return s1 < e2 && e1 > s2;
    });
    return !conflict;
  });
}

function secureToken(){
  var bytes = new Uint8Array(12);
  try {
    if(window.crypto && window.crypto.getRandomValues) window.crypto.getRandomValues(bytes);
    else for(var i = 0; i < bytes.length; i++) bytes[i] = Math.floor(Math.random() * 256);
  } catch(e){

  }
  var arr = [];
  for(var k = 0; k < bytes.length; k++) arr.push(bytes[k].toString(16).padStart(2, '0'));
  return 'qr_' + arr.join('');

function toast(msg, type, title){
  type = type || 'info';
  var el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = '<strong>' + esc(title || (type === 'success' ? 'Success' : type === 'error' ? 'Error' : type === 'warn' ? 'Warning' : 'Info')) + '</strong><p>' + esc(msg) + '</p>';
  document.getElementById('toast-root').appendChild(el);
  setTimeout(function(){ el.style.opacity = '0'; el.style.transform = 'translateX(40px)'; }, 3200);
  setTimeout(function(){ el.remove(); }, 3600);
}

function openModal(o){
  var root = document.getElementById('modal-root');
  var bd = document.createElement('div');
  bd.className = 'modal-backdrop';
  bd.innerHTML = '<div class="modal ' + (o.size === 'lg' ? 'modal-lg' : '') + '"><div class="modal-header"><h3>' + esc(o.title) + '</h3><button class="icon-btn" data-close>X</button></div><div class="modal-body">' + o.bodyHtml + '</div>' + (o.footerHtml ? '<div class="modal-footer">' + o.footerHtml + '</div>' : '') + '</div>';
  root.appendChild(bd);
  var close = function(){ bd.remove(); };
  bd.querySelector('[data-close]').onclick = close;
  bd.addEventListener('click', function(e){ if(e.target === bd) close(); });
  if(o.onMount) o.onMount(bd, close);
  return { el: bd, close: close };
}

function confirmDialog(o){

function textInputDialog(o){

    var required = o.required === true;
    var m = openModal({
      title: o.title || 'Add remarks',
      bodyHtml: '<div class="field"><label>' + esc(o.label || 'Reason') + (required ? ' <span class="req">*</span>' : '') + '</label><textarea id="wfr" rows="4" maxlength="500"></textarea><div id="wfe" style="color:#dc2626;font-size:11px;min-height:14px"></div></div>',
      footerHtml: '<button class="btn btn-ghost" data-cancel>Cancel</button><button class="btn ' + (o.danger ? 'btn-danger' : 'btn-primary') + '" data-submit>' + esc(o.submitLabel || 'Continue') + '</button>'
    });
    var input = m.el.querySelector('#wfr');
    var settled = false;
    var finish = function(value){ if(settled) return; settled = true; m.close(); resolve(value); };
    m.el.querySelector('[data-close]').onclick = function(){ finish(null); };
    m.el.querySelector('[data-cancel]').onclick = function(){ finish(null); };
    m.el.querySelector('[data-submit]').onclick = function(){
      var value = input.value.trim();
      if(required && !value){ m.el.querySelector('#wfe').textContent = 'Required'; input.focus(); return; }
      finish(value);
    };
    input.focus();
  });
}

function exportCsv(filename, headers, rows){
  var csv = [headers].concat(rows).map(function(r){ return r.map(function(c){ return '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"'; }).join(','); }).join('\n');
  var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 500);
  toast('CSV downloaded', 'success');
}

function attendanceSummary(studentId, courseId){
  var settings = getSettings();
  var recs = state.attendanceRecords.filter(function(r){ return r.studentId === studentId && (!courseId || r.courseId === courseId); });
  var present = recs.filter(function(r){ return r.status === ATT.PRESENT; }).length;
  var late = recs.filter(function(r){ return r.status === ATT.LATE; }).length;
  var absent = recs.filter(function(r){ return r.status === ATT.ABSENT; }).length;
  var leave = recs.filter(function(r){ return r.status === ATT.LEAVE; }).length;
  var total = present + late + absent + leave;
  var conv = Math.floor(late / (settings.lateToAbsenceThreshold || 3));
  var adj = (total + conv) === 0 ? 0 : ((present + leave) / (total + conv)) * 100;
  return { total: total, present: present, late: late, absent: absent, leave: leave, converted: conv, adjustedPercentage: adj, isShortage: adj < (settings.shortageThreshold || 70) };
}

  updateColl('attendanceSessions', function(a){ return a.map(function(x){ return x.id === sessionId ? Object.assign({}, x, { qrToken: secureToken(), qrExpiresAt: new Date(Date.now() + ttl).toISOString() }) : x; }); });

function scanQr(session, o){
  if(!o.token) throw new Error('Invalid token');
  var att = null;
  for(var i = 0; i < state.attendanceSessions.length; i++) if(state.attendanceSessions[i].qrToken === o.token){ att = state.attendanceSessions[i]; break; }
  if(!att) throw new Error('QR not recognized');
  if(att.status !== 'open') throw new Error('Session closed');
  if(new Date(att.qrExpiresAt) < new Date()) throw new Error('QR expired');
  if(state.attendanceRecords.find(function(r){ return r.sessionId === att.id && r.studentId === o.studentId; })) throw new Error('Already marked');
  var now = new Date();
  var arrival = now.toTimeString().slice(0, 5);
  var diff = Math.max(0, t2m(arrival) - t2m(att.scheduledStart));
  var status = diff > 0 ? ATT.LATE : ATT.PRESENT;
  if(status === ATT.LATE && !hasLateApprovalToday(o.studentId)) throw new Error('Late - need approval');
  var rec = { id: uid('rec'), sessionId: att.id, studentId: o.studentId, courseId: att.courseId, teacherId: att.teacherId, semesterId: att.semesterId, sectionId: att.sectionId, date: att.date, scheduledTime: att.scheduledStart, arrivalTime: arrival, status: status, lateMinutes: diff, markedBy: session.userId, markedAt: nowIso(), manual: false };
  updateColl('attendanceRecords', function(a){ return a.concat([rec]); });
  return rec;
}

function checkClassReminders(){
  var today = todayIso(), todayDay = dayOfWeek(new Date()), nowMin = t2m(new Date().toTimeString().slice(0, 5));
  var store = {};
  try { store = JSON.parse(localStorage.getItem('gct_reminders') || '{}'); } catch(e){}
  state.timetable.filter(function(t){ return t.day === todayDay && t.status === 'Active'; }).forEach(function(slot){
    var diff = t2m(slot.startTime) - nowMin;
    if(diff >= 0 && diff <= 5){
      var key = today + '_' + slot.id;
      if(store[key]) return;
      store[key] = true;
      var c = state.courses.find(function(x){ return x.id === slot.courseId; });
      var msg = (c ? c.code + ' ' + c.name : 'Class') + ' starts at ' + slot.startTime;
      if(slot.teacherId) notifyUser(slot.teacherId, 'teacher', 'Class Starting Soon', msg, { relatedRoute: '#/app/my-timetable' });
    }
  });
  try { localStorage.setItem('gct_reminders', JSON.stringify(store)); } catch(e){}
}

function LiveClassesPage(ctx){

  }
  var live = getLiveClasses();
  var today = dayOfWeek(new Date());
  var todaySlots = state.timetable.filter(function(t){ return t.day === today && t.status === 'Active'; }).sort(function(a, b){ return t2m(a.startTime) - t2m(b.startTime); });
  var body = '<div class="card" style="border-left:4px solid #10a469"><div class="card-header"><h3>Live Now (' + live.length + ')</h3></div><div class="card-body">';
  if(live.length === 0){
    body += '<div class="empty-state" style="padding:30px"><h4 style="font-size:14px">No live classes</h4></div>';
  } else {
    body += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px">';
    live.forEach(function(lc){
      var sub = lc.substitute;
      body += '<div class="card" style="border-left:4px solid #10a469"><div class="card-body"><span class="live-badge">LIVE</span><h3 style="margin-top:10px;font-size:15px">' + esc(lc.course ? lc.course.code + ' - ' + lc.course.name : '') + '</h3><div style="margin-top:8px;font-size:12px"><div>Teacher: ' + esc(sub ? sub.substituteTeacherName : (lc.teacher ? lc.teacher.name : '-')) + '</div><div>Class: ' + esc(lc.slot.className || '-') + '</div><div>Time: ' + esc(lc.slot.startTime) + '-' + esc(lc.slot.endTime) + '</div></div></div></div>';
    });
    body += '</div>';
  }
  body += '</div></div>';
  body += '<div class="card"><div class="card-header"><h3>Today Schedule (' + todaySlots.length + ')</h3></div><div class="card-body"><div class="table-wrap"><table class="data"><thead><tr><th>Time</th><th>Course</th><th>Teacher</th><th>Status</th></tr></thead><tbody>';
  var nowMin = t2m(new Date().toTimeString().slice(0, 5));
  todaySlots.forEach(function(t){
    var c = state.courses.find(function(x){ return x.id === t.courseId; });
    var te = state.teachers.find(function(x){ return x.id === t.teacherId; });
    var st = t2m(t.startTime), en = t2m(t.endTime);
    var status = '';
    if(nowMin >= st && nowMin < en) status = '<span class="live-badge">LIVE</span>';
    else if(nowMin < st && nowMin >= st - 30) status = '<span class="badge badge-warn">UPCOMING</span>';
    else if(nowMin >= en) status = '<span class="badge badge-gray">PAST</span>';
    else status = '<span class="badge badge-info">SCHEDULED</span>';
    body += '<tr><td><strong>' + esc(t.startTime) + '-' + esc(t.endTime) + '</strong></td><td>' + esc(c ? c.code : '') + ' ' + esc(c ? c.name : '') + '</td><td>' + esc(te ? te.name : '') + '</td><td>' + status + '</td></tr>';
  });
  if(!todaySlots.length) body += '<tr><td colspan="4" class="empty">No classes.</td></tr>';
  body += '</tbody></table></div></div></div>';
  return AppShell({ session: s, activePath: '#/app/live-classes', title: 'Live Monitor', childrenHtml: body });
}

function SubstituteRequestsPage(ctx){

  return AppShell({

      $$('[data-accept]', root).forEach(function(btn){
        btn.onclick = function(){
          try { acceptSubstituteRequest(s, btn.dataset.accept); toast('Accepted', 'success'); renderRoute(); } catch(e){ toast(e.message, 'error'); }
        };
      });
      $$('[data-decline]', root).forEach(function(btn){
        btn.onclick = function(){
          textInputDialog({ title: 'Decline', label: 'Reason', required: true, danger: true, submitLabel: 'Decline' }).then(function(r){

          });
        };
      });
    }
  });

function openSubstituteForm(o){
  var session = o.session, onSaved = o.onSaved;
  var today = dayOfWeek(new Date());
  var mySlots = state.timetable.filter(function(t){ return t.teacherId === session.linkedId && t.day === today; });
  if(mySlots.length === 0){
    toast('No classes today', 'warn');
    return;
  }
  var bodyHtml = '<form id="subf"><div class="form-grid"><div class="field full"><label>My Class <span class="req">*</span></label><select name="slotId" id="slotSel"><option value="">- Select -</option>' + mySlots.map(function(t){ var c = state.courses.find(function(x){ return x.id === t.courseId; }); return '<option value="' + t.id + '">' + esc(t.startTime) + '-' + esc(t.endTime) + ' ' + esc(c ? c.code + ' ' + c.name : '') + '</option>'; }).join('') + '</select></div><div class="field"><label>Reason <span class="req">*</span></label><select name="reason"><option>Late Arrival</option><option>On Leave</option><option>Emergency</option><option>Other</option></select></div><div class="field full"><label>Substitute Teacher <span class="req">*</span></label><select name="substituteTeacherId" id="subSel"><option value="">- Select slot first -</option></select></div><div class="field full"><label>Note</label><textarea name="note" rows="2"></textarea></div></div></form>';
  openModal({
    title: 'Request Substitute', size: 'lg', bodyHtml: bodyHtml,
    footerHtml: '<button class="btn btn-ghost" data-cancel>Cancel</button><button class="btn btn-accent" data-save>Send</button>',
    onMount: function(root, close){
      var slotSel = $('#slotSel', root), subSel = $('#subSel', root);
      slotSel.onchange = function(){
        var slotId = slotSel.value;
        subSel.innerHTML = '<option value="">- Select -</option>';
        if(!slotId) return;
        var slot = state.timetable.find(function(t){ return t.id === slotId; });
        if(!slot) return;
        var avail = getAvailableTeachersForSlot(slot);
        avail.forEach(function(t){
          var opt = document.createElement('option');
          opt.value = t.id; opt.textContent = t.name;
          subSel.appendChild(opt);
        });
      };
      root.querySelector('[data-cancel]').onclick = close;
      root.querySelector('[data-save]').onclick = function(){
        var d = {};
        new FormData($('#subf', root)).forEach(function(v, k){ d[k] = v; });
        if(!d.slotId || !d.substituteTeacherId){ toast('Fill required fields', 'error'); return; }
        try { createSubstituteRequest(session, d); toast('Sent', 'success'); close(); if(onSaved) onSaved(); } catch(e){ toast(e.message, 'error'); }
      };
    }
  });
}

function openManualAttendance(o){
  var session = o.session, timetableId = o.timetableId, onSaved = o.onSaved;
  var slot = state.timetable.find(function(t){ return t.id === timetableId; });
  if(!slot){ toast('Not found', 'error'); return; }
  var c = state.courses.find(function(x){ return x.id === slot.courseId; });
  var students = state.students.filter(function(s){ return s.currentSemesterId === slot.semesterId && s.currentSectionId === slot.sectionId && s.status === 'Active'; });
  var today = todayIso();
  var rowsHtml = students.map(function(stu){
    var existing = state.attendanceRecords.find(function(r){ return r.studentId === stu.id && r.date === today && r.courseId === slot.courseId; });
    var status = existing ? existing.status : '';
    return '<tr data-sid="' + stu.id + '"><td><strong>' + esc(stu.name) + '</strong></td><td>' + (existing ? '<span class="badge badge-info">' + esc(status) + '</span>' : 'Not marked') + '</td><td><select class="mark-select" ' + (existing ? 'disabled' : '') + '><option value="">-</option><option value="present" ' + (status === 'present' ? 'selected' : '') + '>Present</option><option value="late" ' + (status === 'late' ? 'selected' : '') + '>Late</option><option value="absent" ' + (status === 'absent' ? 'selected' : '') + '>Absent</option><option value="approved_leave" ' + (status === 'approved_leave' ? 'selected' : '') + '>On Leave</option></select></td></tr>';
  }).join('');
  var bodyHtml = '<div style="background:#eff6ff;border-left:4px solid #2563eb;padding:12px;border-radius:8px;margin-bottom:14px"><strong>' + esc(c ? c.code + ' - ' + c.name : '') + '</strong> - ' + esc(slot.className || '') + '<br/>' + esc(slot.startTime) + '-' + esc(slot.endTime) + '</div><div class="row mb-2"><button class="btn btn-success btn-sm" id="bulkPresent">Mark All Present</button></div><div class="table-wrap" style="max-height:400px;overflow-y:auto"><table class="data"><thead><tr><th>Student</th><th>Current</th><th>Set</th></tr></thead><tbody>' + rowsHtml + '</tbody></table></div>';
  openModal({
    title: 'Manual Attendance', size: 'lg', bodyHtml: bodyHtml,
    footerHtml: '<button class="btn btn-ghost" data-cancel>Cancel</button><button class="btn btn-primary" data-save>Save</button>',
    onMount: function(root, close){
      var selects = $$('.mark-select', root);
      $('#bulkPresent', root).onclick = function(){
        selects.forEach(function(sel){ if(!sel.disabled) sel.value = 'present'; });
      };
      root.querySelector('[data-cancel]').onclick = close;
      root.querySelector('[data-save]').onclick = function(){
        var count = 0;
        $$('tr[data-sid]', root).forEach(function(tr){
          var sid = tr.getAttribute('data-sid');
          var sel = $('.mark-select', tr);
          if(sel.disabled) return;
          var status = sel.value;
          if(!status) return;
          try {
            manualAttendance(session, { studentId: sid, courseId: slot.courseId, date: today, scheduledTime: slot.startTime, status: status, lateMinutes: status === 'late' ? 10 : 0, timetableId: slot.id, teacherId: slot.teacherId, manualReason: 'Manual' });
            count++;
          } catch(e){}
        });
        if(count > 0) toast(count + ' marked', 'success');
        close(); if(onSaved) onSaved();
      };
    }
  });
}

          var count = 0;
          for(var i = 1; i < lines.length; i++){
            var cells = lines[i].split(',').map(function(c){ return c.trim().replace(/^"|"$/g, ''); });
            var row = {};
            headers.forEach(function(h, idx){ row[h] = cells[idx] || ''; });
            try {
              if(Object.keys(validateStudent(row)).length === 0){
                createStudent(s, row);
                count++;
              }
            } catch(e){}
          }
          toast('Imported ' + count, 'success');
          renderRoute();
        };
        rd.readAsText(f);
      };
    }
  });
}

  { path: '#/app/profile', page: function(ctx){ return ParentChildPage({ session: ctx.session, mode: 'profile' }); } },
  { path: '#/app/my-attendance', page: function(ctx){ return ParentChildPage({ session: ctx.session, mode: 'attendance' }); } },
  { path: '#/app/my-academics', page: function(ctx){ return ParentChildPage({ session: ctx.session, mode: 'academics' }); } },
  { path: '#/app/child', page: function(ctx){ return ParentChildPage({ session: ctx.session, mode: 'profile' }); } },
  { path: '#/app/child/attendance', page: function(ctx){ return ParentChildPage({ session: ctx.session, mode: 'attendance' }); } },
  { path: '#/app/child/leave', page: function(ctx){ return ParentChildPage({ session: ctx.session, mode: 'leave' }); } },
  { path: '#/app/child/timetable', page: function(ctx){ return ParentChildPage({ session: ctx.session, mode: 'timetable' }); } },
  { path: '#/app/child/academics', page: function(ctx){ return ParentChildPage({ session: ctx.session, mode: 'academics' }); } }
];

function findRoute(path){
  for(var i = 0; i < routes.length; i++){
    var r = routes[i];
    var keys = [];
    var pattern = r.path.replace(/:([^/]+)/g, function(_, k){ keys.push(k); return '([^/]+)'; });
    var m = path.match(new RegExp('^' + pattern + '$'));
    if(m){
      var params = {};
      keys.forEach(function(k, idx){ params[k] = decodeURIComponent(m[idx + 1]); });
      return { route: r, params: params };
    }
  }
  return null;
}
function routeMatches(pattern, path){
  var expected = pattern.split('/'), actual = path.split('/');
  if(expected.length !== actual.length) return false;
  for(var i = 0; i < expected.length; i++) if(expected[i].charAt(0) !== ':' && expected[i] !== actual[i]) return false;
  return true;
}
function isRouteAllowed(session, path){
  if(session.role === 'chairman') return true;
  var patterns = [];
  (NAV[session.role] || []).forEach(function(group){ group.items.forEach(function(item){ patterns.push(item.path); }); });
  return patterns.some(function(pattern){ return routeMatches(pattern, path); });
}

function renderRoute(){
  try {
    var path = location.hash || '#/login';
    var session = state.session;
    log('Route: ' + path + ' session: ' + (session ? session.role : 'none'));
    if(path !== '#/login' && !session){ location.hash = '#/login'; return; }
    if(path === '#/login' && session){ location.hash = '#/app/dashboard'; return; }
    var match = findRoute(path);
    if(!match){
      if(!session){ location.hash = '#/login'; return; }
      mountPage(AppShell({ session: session, activePath: path, title: 'Not Found', childrenHtml: '<div class="empty-state"><h4>Page not found</h4><p>' + esc(path) + '</p></div>' }));
      return;
    }
    if(session && !isRouteAllowed(session, path)){
      mountPage(AppShell({ session: session, activePath: path, title: 'Access restricted', childrenHtml: '<div class="empty-state"><h4>Not available</h4></div>' }));
      return;
    }
    var page = match.route.page({ session: session, params: match.params });
    mountPage(page);
  } catch(e){
    log('Route error: ' + e.message, e);
    document.getElementById('app-root').innerHTML = '<div style="padding:40px;font-family:Arial"><h2 style="color:#dc2626">Error loading page</h2><pre style="background:#f6f8fc;padding:20px;border-radius:8px;overflow:auto">' + esc(e.message) + '\n\n' + esc(e.stack || '') + '</pre></div>';
  }
}

function mountPage(page){
  var root = document.getElementById('app-root');
  root.innerHTML = page.html;
  if(page.mount) page.mount(root);
}

window.addEventListener('hashchange', renderRoute);
on('session:change', renderRoute);
on('department:change', function(){ renderRoute(); });

log('Initializing app');

bootstrapDepartment(state.departmentId);
restoreSession();

if(!location.hash) location.hash = '#/login';
renderRoute();

setInterval(function(){ try { checkClassReminders(); } catch(e){} }, 60000);

log('App initialized successfully');

})();
</script>
