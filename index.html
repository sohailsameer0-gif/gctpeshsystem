<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>GCT Peshawar — B.Tech Department ERP</title>
<style>
/* ============ CORE ============ */
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
:root{
--b9:#102d35;--b8:#173d47;--b7:#225866;--b6:#2c7480;--b5:#378d96;--b4:#58aeb0;
--a6:#956323;--a5:#b47d2b;--a4:#d4a64b;--a3:#ecd18c;
--ok:#10a469;--okl:#d1fae5;--wn:#d97706;--wnl:#fef3c7;--dg:#dc2626;--dgl:#fee2e2;
--in:#2563eb;--inl:#dbeafe;--gd:#c9a227;--gdl:#fef9e7;
--g50:#f5f7f5;--g100:#edf1ee;--g200:#dce5df;--g300:#c8d4cd;--g400:#9aa8bf;
--g500:#687a73;--g600:#4e625b;--g700:#374b45;--g800:#263a35;--g900:#172a26;
--wa:#25D366;--wad:#128C7E;
--r:8px;--rl:12px;
--sh:0 1px 3px rgba(24,55,48,.06);--shm:0 8px 24px rgba(24,55,48,.1);--shl:0 20px 48px rgba(20,48,42,.16);
--f:'DM Sans',system-ui,sans-serif;--fd:'Space Grotesk','DM Sans',sans-serif;
}
body{font-family:var(--f);font-size:14px;line-height:1.55;color:var(--g800);background:var(--g50);
background-image:linear-gradient(rgba(34,88,102,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(34,88,102,.025) 1px,transparent 1px);background-size:28px 28px}
a{color:var(--b6);text-decoration:none}a:hover{color:var(--b5)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--g800);line-height:1.4;border:1px solid var(--g300);border-radius:6px;padding:10px 12px;min-height:42px;width:100%;background:#fff}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--b5);box-shadow:0 0 0 4px rgba(55,141,150,.14)}
textarea{min-height:auto}
label{display:block;font-size:12px;font-weight:600;color:var(--g700);margin:0 0 6px}
img{max-width:100%;display:block}
svg{display:block;flex-shrink:0}
.hidden{display:none!important}
.muted{color:var(--g500);font-size:12px}
.req{color:var(--dg)}
.text-right{text-align:right}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}.row.between{justify-content:space-between}
.mt-1{margin-top:8px}.mt-2{margin-top:16px}.mt-3{margin-top:24px}
.mb-1{margin-bottom:8px}.mb-2{margin-bottom:16px}.mb-3{margin-bottom:24px}

/* ============ BUTTONS ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;min-height:38px;border:1px solid transparent;border-radius:6px;font-size:13px;font-weight:600;line-height:1.35;white-space:nowrap;text-decoration:none;transition:transform .15s,background .2s,box-shadow .2s}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn:active:not(:disabled){transform:scale(.97)}
.btn-primary{background:var(--b6);color:#fff}.btn-primary:hover:not(:disabled){background:var(--b7);box-shadow:0 3px 10px rgba(34,88,102,.2)}
.btn-accent{background:var(--a5);color:#fff}.btn-accent:hover:not(:disabled){background:var(--a6)}
.btn-ghost{background:#fff;color:var(--g700);border-color:var(--g200)}.btn-ghost:hover{background:var(--g50)}
.btn-success{background:var(--ok);color:#fff}
.btn-danger{background:var(--dg);color:#fff}
.btn-warn{background:var(--wn);color:#fff}
.btn-whatsapp{background:var(--wa);color:#fff}
.btn-sm{padding:6px 11px;min-height:34px;font-size:12px}
.btn-xs{padding:4px 8px;min-height:28px;font-size:11px}
.btn-block{width:100%}
.icon-btn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:7px;background:var(--g100);color:var(--g600);position:relative;transition:all .2s}
.icon-btn:hover{background:#fff;color:var(--b6);box-shadow:var(--sh)}
.icon-action{width:34px;height:34px;padding:8px;border-radius:6px;display:inline-grid;place-items:center}
.icon-action[data-edit]{color:var(--b7);background:#f3f8f5;border:1px solid #dce8e0}
.icon-action[data-del]{color:#a34343;background:#fff8f7;border:1px solid #f0ddda}

/* ============ LAYOUT ============ */
.app-shell{display:grid;grid-template-columns:264px 1fr;min-height:100vh}
.app-sidebar{background:var(--b9);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:20px 18px;display:flex;gap:12px;align-items:center;border-bottom:1px solid rgba(255,255,255,.1);flex-shrink:0}
.brand-logo{width:42px;height:42px;border-radius:8px;background:var(--a5);display:grid;place-items:center;font-family:var(--fd);font-weight:800;color:#fff;font-size:13px}
.brand-text strong{font-family:var(--fd);font-size:13px;display:block}
.brand-text span{font-size:11px;opacity:.7}
.nav{padding:14px 10px;flex:1}
.nav-group{margin-bottom:10px}
.nav-group-title{font-size:10px;text-transform:uppercase;letter-spacing:1px;opacity:.6;padding:8px 12px 4px;font-weight:600;color:#e7c98b}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:6px;color:rgba(255,255,255,.85);font-size:13px;font-weight:500;margin-bottom:2px;position:relative;transition:background .2s}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{background:rgba(212,166,75,.16);color:#fff;box-shadow:inset 3px 0 0 var(--a4)}
.nav-item.active .nav-icon{color:var(--a3)}
.nav-icon{width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.nav-badge{margin-left:auto;background:#ef4444;color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;min-width:18px;text-align:center}
.nav-footer{padding:14px 18px;font-size:11px;opacity:.6;border-top:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:8px}
.app-main{display:flex;flex-direction:column;min-width:0}
.app-topbar{background:rgba(255,255,255,.96);border-bottom:1px solid var(--g200);display:flex;align-items:center;gap:14px;padding:11px 24px;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(24,55,48,.04)}
.topbar-title{font-family:var(--fd);font-weight:700;font-size:16px;flex:1;color:var(--b8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-actions{display:flex;align-items:center;gap:10px}
.icon-badge{position:absolute;top:-2px;right:-2px;background:#ef4444;color:#fff;font-size:10px;font-weight:700;padding:1px 5px;border-radius:10px;min-width:17px;text-align:center;border:2px solid #fff}
.user-chip{display:flex;align-items:center;gap:10px;padding:4px 12px 4px 4px;border-radius:24px;background:var(--g100);transition:all .2s;color:var(--g800)}
.user-chip:hover{background:#fff;box-shadow:var(--sh);color:var(--g800)}
.user-avatar{width:32px;height:32px;border-radius:50%;background:var(--b6);color:#fff;display:grid;place-items:center;font-weight:600;font-size:13px;overflow:hidden}
.user-avatar img{width:100%;height:100%;object-fit:cover}
.user-meta{display:flex;flex-direction:column;line-height:1.15}
.user-meta strong{font-size:12px}.user-meta span{font-size:10px;color:var(--g500)}
.app-content{padding:24px 28px;flex:1;max-width:1680px;width:100%;margin:0 auto;animation:fadeIn .24s}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.mobile-only{display:none}
.sidebar-backdrop{position:fixed;inset:0;background:rgba(8,26,51,.5);z-index:50;display:none}
.sidebar-backdrop.open{display:block}
@media(max-width:900px){
.app-shell{grid-template-columns:1fr}
.app-sidebar{position:fixed;left:-296px;top:0;bottom:0;width:280px;z-index:60;transition:left .3s}
.app-sidebar.open{left:0}
.mobile-only{display:inline-flex}
.app-content{padding:16px}
}
@media(max-width:640px){.app-content{padding:12px}.app-topbar{padding:9px 10px;gap:8px}}

/* ============ CARDS & TABLES ============ */
.card{background:#fff;border:1px solid var(--g200);border-radius:8px;box-shadow:var(--sh);overflow:hidden;margin-bottom:0}
.card-header{padding:15px 18px;border-bottom:1px solid var(--g200);display:flex;align-items:center;gap:12px;background:#fbfcfa;flex-wrap:wrap}
.card-header h3{font-family:var(--fd);font-size:15px;font-weight:700;color:var(--b7);margin:0}
.card-body{padding:18px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.stat-card{background:#fff;border:1px solid var(--g200);border-radius:8px;padding:16px 18px 14px 20px;position:relative;box-shadow:var(--sh);min-height:104px;transition:transform .2s,box-shadow .2s}
.stat-card::after{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;background:var(--b5);border-radius:0 3px 3px 0}
.stat-card.warn::after{background:var(--a4)}
.stat-card.danger::after{background:var(--dg)}
.stat-card.success::after{background:var(--ok)}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shm)}
.stat-card .label{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--g500);margin-bottom:6px;font-weight:600}
.stat-card .value{font-family:var(--fd);font-size:24px;font-weight:700;color:var(--b8);line-height:1.15}
.stat-card .hint{font-size:11px;color:var(--g500);margin-top:4px}
.stat-card.warn .value{color:var(--wn)}.stat-card.danger .value{color:var(--dg)}.stat-card.success .value{color:var(--ok)}
@media(max-width:640px){.stat-grid{grid-template-columns:repeat(2,1fr);gap:8px}.stat-card{min-height:90px;padding:12px 12px 10px 16px}.stat-card .value{font-size:20px}}

.table-wrap{width:100%;overflow-x:auto;border:1px solid var(--g200);border-radius:8px;background:#fff}
table.data{width:100%;border-collapse:collapse;font-size:13px;min-width:720px}
table.data th{text-align:left;padding:12px 14px;background:#edf2ef;font-weight:700;color:var(--g600);font-size:11px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;border-bottom:1px solid var(--g200)}
table.data td{padding:12px 14px;border-bottom:1px solid var(--g100);vertical-align:middle;color:var(--g700);line-height:1.45}
table.data tbody tr:hover td{background:#f6f9f7}
table.data tbody tr:last-child td{border-bottom:0}
table.data .empty{text-align:center;padding:36px;color:var(--g500);font-style:italic}

/* ============ BADGES ============ */
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:6px;font-size:11px;font-weight:600;letter-spacing:.2px;white-space:nowrap}
.badge-success{background:var(--okl);color:#065f46}
.badge-warn{background:var(--wnl);color:#92400e}
.badge-danger{background:var(--dgl);color:#991b1b}
.badge-info{background:var(--inl);color:#1e40af}
.badge-gray{background:var(--g200);color:var(--g700)}
.badge-gold{background:var(--gdl);color:#92400e;border:1px solid var(--gd)}
.badge-purple{background:#e9d5ff;color:#6b21a8}

/* ============ FORMS ============ */
.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.field{display:flex;flex-direction:column;min-width:0}
.field.full{grid-column:1/-1}
.field.error input,.field.error select{border-color:var(--dg);box-shadow:0 0 0 4px rgba(220,38,38,.1)}
.err-msg{font-size:11px;color:var(--dg);min-height:14px;margin-top:2px}
@media(max-width:900px){.form-grid{grid-template-columns:1fr}}

/* ============ MODAL ============ */
#modal-root .modal-backdrop{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:16px;background:rgba(8,26,51,.55);backdrop-filter:blur(6px)}
#modal-root .modal{width:min(960px,calc(100vw - 32px));max-width:960px;max-height:92vh;display:flex;flex-direction:column;overflow:hidden;border-radius:8px;background:#fff;box-shadow:var(--shl);animation:scaleIn .25s}
@keyframes scaleIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
#modal-root .modal-header{padding:16px 20px;border-bottom:1px solid var(--g200);display:flex;align-items:center;gap:12px;background:#fbfcfa}
#modal-root .modal-header h3{flex:1;margin:0;font-family:var(--fd);font-size:16px;color:var(--b8);font-weight:700}
#modal-root .modal-body{padding:20px;overflow-y:auto}
#modal-root .modal-footer{padding:14px 20px;border-top:1px solid var(--g200);display:flex;justify-content:flex-end;gap:10px;background:var(--g50)}
@media(max-width:700px){#modal-root .modal-backdrop{padding:8px;align-items:end}#modal-root .modal{max-height:94vh}#modal-root .modal-header,#modal-root .modal-body,#modal-root .modal-footer{padding:14px}}

/* ============ TOAST ============ */
#toast-root{position:fixed;top:18px;right:18px;z-index:10000;display:flex;flex-direction:column;gap:10px;pointer-events:none;max-width:360px}
.toast{background:#fff;border-left:4px solid var(--in);border-radius:8px;padding:14px 18px;box-shadow:var(--shl);min-width:260px;pointer-events:auto;animation:slideIn .25s}
.toast.success{border-left-color:var(--ok)}.toast.error{border-left-color:var(--dg)}.toast.warn{border-left-color:var(--wn)}.toast.whatsapp{border-left-color:var(--wa)}
.toast strong{display:block;font-size:13px;margin-bottom:3px}
.toast p{font-size:12px;color:var(--g600);margin:0;line-height:1.4}
@keyframes slideIn{from{transform:translateX(30px);opacity:0}to{transform:translateX(0);opacity:1}}

/* ============ LOGIN ============ */
.login-page{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(400px,.95fr)}
.login-left{background:linear-gradient(145deg,#153a40 0%,#225866 68%,#87622f 145%);color:#fff;padding:0;display:flex;flex-direction:column;position:relative;overflow:hidden}
.login-left .inner{padding:52px;position:relative;z-index:1;flex:1;display:flex;flex-direction:column;justify-content:space-between}
.login-lh img{width:100%;height:auto;background:#fff;border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.25);margin-bottom:24px}
.login-left h1{font-family:var(--fd);font-size:30px;line-height:1.2;margin:0 0 14px;font-weight:800}
.login-left .sub{opacity:.85;font-size:14px;max-width:480px;line-height:1.65;margin:0 0 24px}
.login-feature-list{list-style:none;padding:0;margin:0 0 28px;display:flex;flex-direction:column;gap:12px;font-size:13px}
.login-feature-list li{display:flex;gap:12px;align-items:flex-start}
.login-feature-list li::before{content:"✓";width:22px;height:22px;border-radius:50%;background:linear-gradient(145deg,#d4a64b,#edd28d);display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:#153a40;font-weight:800;flex-shrink:0}
.login-left .copyright{font-size:11px;opacity:.6}
.login-right{display:grid;place-items:center;padding:40px;background:#f5f7f5;overflow-y:auto}
.login-card{width:100%;max-width:440px;background:#fff;border-radius:12px;box-shadow:var(--shm);padding:36px 34px;border:1px solid var(--g200)}
.login-card h2{font-family:var(--fd);font-size:26px;margin:0 0 6px;color:var(--b8)}
.login-card .sub{font-size:13px;color:var(--g500);margin:0 0 22px}
.login-tabs{display:flex;gap:4px;margin-bottom:22px;background:var(--g100);padding:5px;border-radius:9px}
.login-tabs button{flex:1;padding:10px;border-radius:7px;font-size:13px;font-weight:600;color:var(--g600)}
.login-tabs button.active{background:#fff;color:var(--b7);box-shadow:var(--sh)}
.quick-login{margin-top:18px;padding:14px;background:#f6f1e5;border:1px solid #e5d5ae;border-radius:9px}
.quick-login label{color:#76531f;font-weight:700;margin-bottom:8px}
.quick-login .hint{margin-top:8px;font-size:11px;color:#76531f;line-height:1.5}
@media(max-width:900px){.login-page{grid-template-columns:1fr}.login-left{display:none}.login-right{padding:20px}.login-card{padding:26px 20px}}

/* ============ MISC ============ */
.empty-state{padding:48px 24px;text-align:center;color:var(--g500)}
.empty-state h4{font-family:var(--fd);font-size:16px;color:var(--g700);margin:0 0 8px}
.empty-state p{font-size:13px;margin:0}
.loader{display:inline-block;width:18px;height:18px;border:2.5px solid var(--g300);border-top-color:var(--b6);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.live-badge{display:inline-flex;align-items:center;gap:5px;background:var(--ok);color:#fff;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;text-transform:uppercase}
.live-badge::before{content:"";width:6px;height:6px;border-radius:50%;background:#fff;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.slot-live{background:rgba(16,164,105,.06)!important;box-shadow:inset 4px 0 0 var(--ok)!important}
.slot-next{background:rgba(217,119,6,.05)!important;box-shadow:inset 4px 0 0 var(--wn)!important}
.slot-past{opacity:.55}
.net-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600}
.net-badge.online{background:var(--okl);color:#065f46}.net-badge.offline{background:var(--wnl);color:#92400e}
.net-badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.wa-btn{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--wa);color:#fff;margin-left:4px}
.wa-btn:hover{background:var(--wad);color:#fff}
.profile-photo{width:80px;height:80px;border-radius:50%;background:var(--b6);color:#fff;display:grid;place-items:center;font-size:28px;font-weight:700;overflow:hidden;flex-shrink:0;border:3px solid #fff;box-shadow:0 6px 20px rgba(27,77,146,.25)}
.profile-photo img{width:100%;height:100%;object-fit:cover}
.committee-node{padding:10px 14px;margin:6px 0;border-left:3px solid var(--b5);background:var(--g50);border-radius:8px;cursor:pointer}
.hardcopy-note{background:var(--dgl);border:1px solid #fca5a5;border-left:4px solid var(--dg);padding:12px 14px;border-radius:8px;font-size:12px;color:#991b1b;font-weight:600;display:flex;gap:8px;align-items:flex-start;margin-top:12px}
.hardcopy-note::before{content:"⚠";font-size:16px;flex-shrink:0}
.notif-item{cursor:pointer;padding:12px;border-bottom:1px solid var(--g100)}
.notif-item.unread{border-left:3px solid var(--b5);background:rgba(55,141,150,.03)}
.banner-shared{background:linear-gradient(90deg,rgba(37,99,235,.1),rgba(37,99,235,.03));border-left:4px solid var(--in);padding:10px 14px;font-size:12px;color:#1e40af;border-radius:6px;margin-bottom:14px}
.banner-warn{background:var(--wnl);border-left:4px solid var(--wn);padding:10px 14px;font-size:12px;color:#92400e;border-radius:6px;margin-bottom:14px}
@media print{.no-print{display:none!important}}
</style>
</head>
<body>
<div id="app-root"></div>
<div id="toast-root"></div>
<div id="modal-root"></div>

<script>
(function(){
"use strict";

var $=function(s,r){return (r||document).querySelector(s);};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};
var uid=function(p){return (p||"id")+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,7);};
var nowIso=function(){return new Date().toISOString();};
var todayIso=function(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];});};
var fmtDate=function(d){if(!d)return "—";var t=new Date(d.length===10?d+"T00:00:00":d);if(isNaN(t))return "—";return t.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});};
var fmtDT=function(d){if(!d)return "—";var t=new Date(d);if(isNaN(t))return "—";return t.toLocaleString("en-GB",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});};
var fmtTime=function(d){if(!d)return "—";var t=new Date(d);if(isNaN(t))return "—";return t.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});};
var t2m=function(t){if(!t)return 0;var p=String(t).split(":");return Number(p[0])*60+Number(p[1]||0);};
var m2t=function(m){var h=Math.floor(m/60),mm=m%60;return String(h).padStart(2,"0")+":"+String(mm).padStart(2,"0");};
var num=function(v){return Number(v||0);};

function simpleHash(s){var h=0;for(var i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0;}return Math.abs(h).toString(36);}
function getDeviceFingerprint(){
  var fp=null;try{fp=localStorage.getItem(FP_KEY);}catch(e){}
  if(!fp){
    var parts=[navigator.userAgent||"",navigator.language||"",screen.width+"x"+screen.height,String(new Date().getTimezoneOffset()),String(navigator.hardwareConcurrency||0)];
    fp="fp_"+simpleHash(parts.join("|"))+"_"+Math.random().toString(36).slice(2,8);
    try{localStorage.setItem(FP_KEY,fp);}catch(e){}
  }
  return fp;
}

}

function approveAccount(session,accountId,linkedIdOverride){
  if(session.role!=="chairman")throw new Error("Only Chairman can approve");
  var acc=state.accounts.find(function(a){return a.id===accountId;});
  if(!acc)throw new Error("Not found");
  var linkedId=linkedIdOverride||acc.requestedLinkedId||null;
  if((acc.role==="student"||acc.role==="parent")&&!linkedId)throw new Error("Select a student record before approving");
  if(acc.role==="student"&&!state.students.some(function(s){return s.id===linkedId;}))throw new Error("Student not found");
  if(acc.role==="teacher"&&!linkedId){
    var t={id:uid("tch"),name:acc.displayName,email:acc.email,active:true,createdAt:nowIso(),photoDataUrl:acc.photoDataUrl||""};
    updateColl("teachers",function(a){return a.concat([t]);});
    linkedId=t.id;
  }
  if(acc.role==="parent"){
    var parent=state.parents.find(function(p){return String(p.email||"").toLowerCase()===acc.email.toLowerCase();});
    if(!parent){parent={id:uid("par"),name:acc.displayName,email:acc.email,active:true,createdAt:nowIso()};updateColl("parents",function(a){return a.concat([parent]);});}
    if(!state.parentLinks.some(function(l){return l.parentId===parent.id&&l.studentId===linkedId;})){
      var isPrimary=!state.parentLinks.some(function(l){return l.studentId===linkedId&&l.isPrimary;});
      updateColl("parentLinks",function(a){return a.concat([{id:uid("pl"),parentId:parent.id,studentId:linkedId,relation:"Guardian",isPrimary:isPrimary,verified:true,linkedAt:nowIso(),linkedBy:session.userId}]);});
    }
    linkedId=parent.id;
  }
  updateColl("accounts",function(a){return a.map(function(x){return x.id===accountId?Object.assign({},x,{status:"Approved",linkedId:linkedId,approvedAt:nowIso(),approvedBy:session.userId}):x;});});
  audit({userId:session.userId,role:session.role,action:"account.approve",module:"accounts",recordId:accountId});
  notifyRole(acc.role,"Account Approved","Your account has been approved.",{type:"success"});
}
function rejectAccount(session,accountId,reason){
  if(session.role!=="chairman")throw new Error("Only Chairman");
  updateColl("accounts",function(a){return a.map(function(x){return x.id===accountId?Object.assign({},x,{status:"Rejected",rejectionReason:reason||"",decidedAt:nowIso()}):x;});});
}
function authLogin(email,password){
  var accs=makeDemoAccounts();
  var acc=accs.find(function(a){return a.email.toLowerCase()===String(email).toLowerCase()&&a.password===password;});
  if(!acc)throw new Error("Invalid email or password");
  if(acc.status==="Pending")throw new Error("Your account is pending Chairman approval");
  if(acc.status==="Rejected")throw new Error("Your account was rejected by the Chairman");
  if(acc.status==="Suspended")throw new Error("Your account has been suspended");
  var userId="user_"+acc.role+"_"+acc.email.split("@")[0].replace(/[^a-z0-9]/g,"");
  var fp=getDeviceFingerprint();
  if(acc.role==="student"&&acc.linkedId){
    var key=DEVICE_BIND_KEY+"_"+acc.linkedId;
    var bound=null;try{bound=localStorage.getItem(key);}catch(e){}
    if(!bound){try{localStorage.setItem(key,fp);}catch(e){}}
  }
  var session={userId:userId,email:acc.email,role:acc.role,displayName:acc.displayName,linkedId:acc.linkedId||null,photoDataUrl:acc.photoDataUrl||"",loggedInAt:nowIso(),deviceFingerprint:fp};
  setState({session:session},"session:change");
  audit({userId:session.userId,role:session.role,action:"login",module:"auth"});
  return session;
}
function authLogout(){
  var s=state.session;if(s)audit({userId:s.userId,role:s.role,action:"logout",module:"auth"});
  setState({session:null},"session:change");
  try{sessionStorage.removeItem(SIDEBAR_SCROLL_KEY);}catch(e){}
}
function changeOwnPassword(session,oldPwd,newPwd){
  if(!newPwd||newPwd.length<4)throw new Error("Password must be at least 4 characters");
  var acc=makeDemoAccounts().find(function(a){return a.email.toLowerCase()===session.email.toLowerCase();});
  if(!acc)throw new Error("Account not found");
  if(acc.password!==oldPwd)throw new Error("Current password is incorrect");
  var custom=state.accounts.find(function(a){return a.email.toLowerCase()===session.email.toLowerCase();});
  if(custom)updateColl("accounts",function(a){return a.map(function(x){return x.email.toLowerCase()===session.email.toLowerCase()?Object.assign({},x,{password:newPwd}):x;});});
  else{
    var row={id:uid("pwd"),email:session.email,role:session.role,displayName:session.displayName,password:newPwd,status:"Approved",linkedId:session.linkedId,passwordOverride:true,createdAt:nowIso()};
    updateColl("accounts",function(a){return a.concat([row]);});
  }
  audit({userId:session.userId,role:session.role,action:"password.change",module:"auth"});
}

}

var QR=(function(){
  var ECC_L={1:[7,1,19,0,0],2:[10,1,34,0,0],3:[15,1,55,0,0],4:[20,1,80,0,0],5:[26,1,108,0,0],6:[18,2,68,0,0],7:[20,2,78,0,0],8:[24,2,97,0,0],9:[30,2,116,0,0],10:[18,2,68,2,69]};
  var ALIGN={1:[],2:[6,18],3:[6,22],4:[6,26],5:[6,30],6:[6,34],7:[6,22,38],8:[6,24,42],9:[6,26,46],10:[6,28,50]};
  var VINFO={7:0x07C94,8:0x085BC,9:0x09A99,10:0x0A4D3};
  var EXP=new Uint8Array(512),LOG=new Uint8Array(256);
  (function(){var x=1;for(var i=0;i<255;i++){EXP[i]=x;LOG[x]=i;x<<=1;if(x&0x100)x^=0x11D;}for(var j=255;j<512;j++)EXP[j]=EXP[j-255];})();
  var mul=function(a,b){return (a===0||b===0)?0:EXP[LOG[a]+LOG[b]];};
  function gen(deg){var p=[1];for(var i=0;i<deg;i++){var n=new Array(p.length+1);for(var k=0;k<n.length;k++)n[k]=0;for(var j=0;j<p.length;j++){n[j]^=p[j];n[j+1]^=mul(p[j],EXP[i]);}p=n;}return p;}
  function rs(data,ecc){var g=gen(ecc);var r=[];for(var i=0;i<ecc;i++)r.push(0);for(var d=0;d<data.length;d++){var f=data[d]^r.shift();r.push(0);for(var i=0;i<ecc;i++)r[i]^=mul(g[i+1],f);}return r;}
  function chooseVer(len){for(var v=1;v<=10;v++){var cap=ECC_L[v][1]*ECC_L[v][2]+ECC_L[v][3]*ECC_L[v][4];var hb=4+(v>=10?16:8);if(cap*8-hb>=len*8)return v;}return 10;}
  function encode(text){
    var bytes=[];var s=new TextEncoder().encode(text);for(var i=0;i<s.length;i++)bytes.push(s[i]);
    var version=chooseVer(bytes.length);var size=17+version*4;
    var bits=[];var push=function(v,len){for(var i=len-1;i>=0;i--)bits.push((v>>i)&1);};
    push(4,4);push(bytes.length,version>=10?16:8);
    for(var b=0;b<bytes.length;b++)push(bytes[b],8);
    var ecc=ECC_L[version][0],n1=ECC_L[version][1],d1=ECC_L[version][2],n2=ECC_L[version][3],d2=ECC_L[version][4];
    var total=n1*d1+n2*d2;var tb=total*8;
    push(0,Math.min(4,tb-bits.length));
    while(bits.length%8!==0)bits.push(0);
    var pad=[0xEC,0x11],pi=0;
    while(bits.length<tb)push(pad[pi++%2],8);
    var dataCw=[];for(var i=0;i<bits.length;i+=8){var v=0;for(var j=0;j<8;j++)v=(v<<1)|bits[i+j];dataCw.push(v);}
    var blocks=[],idx=0;
    for(var k=0;k<n1;k++){blocks.push({data:dataCw.slice(idx,idx+d1),ecc:[]});idx+=d1;}
    for(var k2=0;k2<n2;k2++){blocks.push({data:dataCw.slice(idx,idx+d2),ecc:[]});idx+=d2;}
    blocks.forEach(function(bl){bl.ecc=rs(bl.data,ecc);});
    var maxD=0;blocks.forEach(function(bl){if(bl.data.length>maxD)maxD=bl.data.length;});
    var finalCw=[];
    for(var ci=0;ci<maxD;ci++)blocks.forEach(function(bl){if(ci<bl.data.length)finalCw.push(bl.data[ci]);});
    for(var ce=0;ce<ecc;ce++)blocks.forEach(function(bl){finalCw.push(bl.ecc[ce]);});
    var m=[],res=[];for(var r=0;r<size;r++){var mr=[],rr=[];for(var c=0;c<size;c++){mr.push(false);rr.push(false);}m.push(mr);res.push(rr);}
    var setF=function(x,y,v){if(x<0||y<0||x>=size||y>=size)return;m[y][x]=v;res[y][x]=true;};
    var finder=function(cx,cy){for(var dy=-4;dy<=4;dy++)for(var dx=-4;dx<=4;dx++){var x=cx+dx,y=cy+dy;if(x<0||y<0||x>=size||y>=size)continue;var d=Math.max(Math.abs(dx),Math.abs(dy));setF(x,y,d!==2&&d!==4);}};
    finder(3,3);finder(size-4,3);finder(3,size-4);

function getOfflineQueue(){try{var r=localStorage.getItem(OFFLINE_QUEUE_KEY);return r?JSON.parse(r):[];}catch(e){return [];}}
function saveOfflineQueue(q){try{localStorage.setItem(OFFLINE_QUEUE_KEY,JSON.stringify(q));}catch(e){}}
function enqueueOffline(item){var q=getOfflineQueue();item.id=uid("off");item.queuedAt=nowIso();q.push(item);saveOfflineQueue(q);return item;}
function isOnline(){return navigator.onLine!==false;}
function flushOfflineQueue(){
  var q=getOfflineQueue();if(!q.length)return 0;
  var remaining=[],done=0;
  q.forEach(function(item){
    try{
      if(item.type==="qr_scan"){
        var sess=state.attendanceSessions.find(function(x){return x.id===item.sessionId;});
        if(sess&&sess.status==="open"&&!state.attendanceRecords.some(function(r){return r.sessionId===sess.id&&r.studentId===item.studentId;})){
          var startM=t2m(fmtTime(sess.actualStart));
          var grace=getSettings().gracePeriodMinutes||15;
          var arrivalM=t2m(item.arrivalTime);
          var late=arrivalM>startM+grace;
          var rec={id:uid("rec"),sessionId:sess.id,studentId:item.studentId,courseId:sess.courseId,teacherId:sess.teacherId,semesterId:sess.semesterId,sectionId:sess.sectionId,date:sess.date,scheduledStart:sess.scheduledStart,actualStart:sess.actualStart,arrivalTime:item.arrivalTime,status:late?ATT.LATE:ATT.PRESENT,lateMinutes:late?(arrivalM-startM):0,markedBy:item.studentId,markedAt:item.scannedAt,manual:false,offline:true,gracePeriodUsed:grace};
          updateColl("attendanceRecords",function(a){return a.concat([rec]);});
          done++;
        }
      }
    }catch(e){remaining.push(item);}
  });
  saveOfflineQueue(remaining);
  return done;
}

function attendanceSummary(studentId,courseId){
  var st=getSettings();
  var recs=state.attendanceRecords.filter(function(r){return r.studentId===studentId&&(!courseId||r.courseId===courseId);});
  var present=recs.filter(function(r){return r.status===ATT.PRESENT;}).length;
  var late=recs.filter(function(r){return r.status===ATT.LATE;}).length;
  var absent=recs.filter(function(r){return r.status===ATT.ABSENT;}).length;
  var leave=recs.filter(function(r){return r.status===ATT.LEAVE;}).length;
  var totalLateMin=recs.filter(function(r){return r.status===ATT.LATE;}).reduce(function(s,r){return s+num(r.lateMinutes);},0);
  var total=present+late+absent+leave;
  var conv=Math.floor(late/(st.lateToAbsenceThreshold||3));
  var raw=total===0?0:((present+leave)/total)*100;
  var adj=(total+conv)===0?0:((present+leave)/(total+conv))*100;
  return {total:total,present:present,late:late,absent:absent,leave:leave,totalLateMin:totalLateMin,converted:conv,rawPercentage:raw,adjustedPercentage:adj,isShortage:adj<(st.shortageThreshold||70)};
}

function applyApprovedLeave(leave){
  if(state.attendanceRecords.some(function(r){return r.leaveId===leave.id;}))return;
  var stu=state.students.find(function(s){return s.id===leave.studentId;});
  if(!stu)return;
  var slots=state.timetable.filter(function(t){return t.semesterId===stu.currentSemesterId&&t.sectionId===stu.currentSectionId;});
  var cur=new Date(leave.startDate+"T00:00:00");
  var end=new Date(leave.endDate+"T00:00:00");
  while(cur<=end){
    var day=dayOfWeek(cur);
    var dateStr=cur.getFullYear()+"-"+String(cur.getMonth()+1).padStart(2,"0")+"-"+String(cur.getDate()).padStart(2,"0");
    slots.filter(function(s){return s.day===day;}).forEach(function(slot){
      var existing=state.attendanceRecords.find(function(r){return r.studentId===stu.id&&r.date===dateStr&&r.courseId===slot.courseId;});
      if(existing){
        if(existing.status===ATT.ABSENT){
          updateColl("attendanceRecords",function(a){return a.map(function(r){return r.id===existing.id?Object.assign({},r,{status:ATT.LEAVE,leaveId:leave.id}):r;});});
        }
      }else{
        var row={id:uid("rec"),sessionId:"leave_"+leave.id,studentId:stu.id,courseId:slot.courseId,teacherId:slot.teacherId,semesterId:stu.currentSemesterId,sectionId:stu.currentSectionId,date:dateStr,scheduledStart:slot.startTime,arrivalTime:null,status:ATT.LEAVE,lateMinutes:0,markedBy:"system",markedAt:nowIso(),leaveId:leave.id};
        updateColl("attendanceRecords",function(a){return a.concat([row]);});
      }
    });
    cur.setDate(cur.getDate()+1);
  }
}

function secureToken(){var b=new Uint8Array(12);try{(window.crypto||window.msCrypto).getRandomValues(b);}catch(e){for(var i=0;i<b.length;i++)b[i]=Math.floor(Math.random()*256);}var a=[];for(var i=0;i<b.length;i++)a.push(b[i].toString(16).padStart(2,"0"));return "qr_"+a.join("");}

function startClassSession(session,data){
  requirePermission(session,"qr.start");
  if(!session.linkedId)throw new Error("Not linked to a teacher record");
  var slot=state.timetable.find(function(t){return t.id===data.timetableId;});
  if(!slot)throw new Error("Timetable slot not found");
  if(slot.teacherId!==session.linkedId)throw new Error("You are not the assigned teacher for this class");

  var exists=state.attendanceSessions.find(function(s){return s.timetableId===slot.id&&s.date===data.date&&s.status==="open";});
  if(exists)throw new Error("A session is already open for this class today");

  var actualStartIso = data.actualStartIso || nowIso();
  var actualStartM = t2m(fmtTime(actualStartIso));
  var scheduledM = t2m(slot.startTime);
  var delay = Math.max(0, actualStartM - scheduledM);
  var ttl = (getSettings().qrValiditySeconds||45)*1000;

  var row={
    id:uid("att"),
    timetableId:slot.id,
    teacherId:session.linkedId,
    originalTeacherId:slot.teacherId,
    courseId:slot.courseId,
    semesterId:slot.semesterId,
    sectionId:slot.sectionId,
    className:slot.className||"",
    date:data.date||todayIso(),
    scheduledStart:slot.startTime,
    scheduledEnd:slot.endTime,
    actualStart:actualStartIso,
    actualEnd:null,
    delayMinutes:delay,
    qrToken:secureToken(),
    qrExpiresAt:new Date(Date.now()+ttl).toISOString(),
    status:"open",
    gracePeriodMinutes:getSettings().gracePeriodMinutes||15,
    startedBy:session.userId
  };
  updateColl("attendanceSessions",function(a){return a.concat([row]);});
  audit({userId:session.userId,role:session.role,action:"session.start",module:"attendanceSessions",recordId:row.id});

  notifyRole("chairman","Class Started",
    (session.displayName)+" started "+slot.startTime+" class"+(delay>0?" ("+delay+"m late)":""),
    {type:"success",relatedRecordId:row.id,relatedModule:"attendanceSessions",relatedRoute:"#/app/live-monitor"});
  var enrolled=state.students.filter(function(s){return s.currentSemesterId===slot.semesterId&&s.currentSectionId===slot.sectionId&&s.status==="Active";});
  enrolled.forEach(function(s){notifyUser(s.id,"student","Class Started","QR attendance is now open. Scan to mark present.",{relatedRecordId:row.id,relatedModule:"attendanceSessions",relatedRoute:"#/app/scan-qr"});});

  return row;
}

function findSessionByToken(token){return state.attendanceSessions.find(function(s){return s.qrToken===token;})||null;}

function scanQr(session,o){
  if(session.role==="student"&&session.linkedId!==o.studentId)throw new Error("You can only mark your own attendance");
  if(session.role==="student"){
    var fp=getDeviceFingerprint();
    var bindKey=DEVICE_BIND_KEY+"_"+o.studentId;
    var bound=null;try{bound=localStorage.getItem(bindKey);}catch(e){}
    if(bound&&bound!==fp)throw new Error("This device is not registered for this student.");
  }
  var att=findSessionByToken(o.token);
  if(!att)throw new Error("QR not recognized");
  if(att.status!=="open")throw new Error("Session closed");
  if(new Date(att.qrExpiresAt)<new Date())throw new Error("QR expired. Ask your teacher to rotate.");

  var stu=state.students.find(function(s){return s.id===o.studentId;});
  if(!stu)throw new Error("Student not found");
  if(stu.status!=="Active")throw new Error("Student not active");
  if(stu.currentSemesterId!==att.semesterId)throw new Error("Wrong semester for this class");
  if(stu.currentSectionId!==att.sectionId)throw new Error("Wrong section for this class");
  if(state.attendanceRecords.some(function(r){return r.sessionId===att.id&&r.studentId===o.studentId;}))throw new Error("Already marked for this class");

  var onLeave=state.attendanceRecords.some(function(r){return r.studentId===o.studentId&&r.courseId===att.courseId&&r.date===att.date&&r.leaveId&&r.status===ATT.LEAVE;});
  if(onLeave)throw new Error("You are on approved leave for this class.");

  var now=new Date();
  var arrival=now.toTimeString().slice(0,5);
  var actualStartM=t2m(fmtTime(att.actualStart));
  var grace=att.gracePeriodMinutes!=null?att.gracePeriodMinutes:(getSettings().gracePeriodMinutes||15);
  var arrivalM=t2m(arrival);
  var late = arrivalM > (actualStartM + grace);

  if(late&&!hasLateApprovalToday(o.studentId)){
    throw new Error("You are late by more than "+grace+" minutes. Submit a written application to the Chairman to enable late scanning for today.");
  }

  var rec={
    id:uid("rec"),sessionId:att.id,studentId:o.studentId,courseId:att.courseId,teacherId:att.teacherId,
    semesterId:att.semesterId,sectionId:att.sectionId,date:att.date,
    scheduledStart:att.scheduledStart,actualStart:att.actualStart,
    arrivalTime:arrival,status:late?ATT.LATE:ATT.PRESENT,
    lateMinutes:late?(arrivalM-actualStartM):0,
    markedBy:session.userId,markedAt:nowIso(),manual:false,
    gracePeriodUsed:grace
  };
  updateColl("attendanceRecords",function(a){return a.concat([rec]);});
  audit({userId:session.userId,role:session.role,action:"qr.scan",module:"attendanceRecords",recordId:rec.id});
  return rec;
}

  updateColl("attendanceRecords",function(a){return a.concat([row]);});
  audit({userId:session.userId,role:session.role,action:"attendance.manual",module:"attendanceRecords",recordId:row.id});

  return row;
}

function validateStudent(d,opts){
  opts=opts||{};var cur=opts.currentId||null;var e={};
  var req=function(k,m){if(!String(d[k]||"").trim())e[k]=m||"Required";};
  req("name","Student name required");
  req("fatherName","Father name required");
  req("admissionNumber","Admission # required");
  req("registrationNumber","Reg # required");
  req("classNumber","Class # required");
  req("studentMobile","Mobile required");
  if(d.studentMobile&&!/^03\d{9}$/.test(d.studentMobile))e.studentMobile="11 digits starting 03";
  if(d.fatherMobile&&!/^03\d{9}$/.test(String(d.fatherMobile).trim()))e.fatherMobile="11 digits starting 03";
  if(!d.currentSemesterId)e.currentSemesterId="Semester required";
  if(!d.currentSectionId)e.currentSectionId="Section required";
  if(state.students.find(function(s){return s.admissionNumber===d.admissionNumber&&s.id!==cur;}))e.admissionNumber="Admission # exists";
  if(state.students.find(function(s){return s.registrationNumber===d.registrationNumber&&s.id!==cur;}))e.registrationNumber="Reg # exists";
  if(state.students.find(function(s){return s.classNumber===d.classNumber&&s.id!==cur;}))e.classNumber="Class # exists";
  return e;
}

function validateSlot(d,opts){
  opts=opts||{};var cur=opts.currentId||null;var e={};
  if(!d.day)e.day="Day required";
  if(!d.startTime)e.startTime="Start required";
  if(!d.endTime)e.endTime="End required";
  if(!d.semesterId)e.semesterId="Semester required";
  if(!d.sectionId)e.sectionId="Section required";
  if(!d.slotType)e.slotType="Type required";
  if(!d.courseId)e.courseId="Course required";
  if(!d.teacherId)e.teacherId="Teacher required";
  if(d.startTime&&d.endTime&&t2m(d.startTime)>=t2m(d.endTime))e.endTime="End after start";
  if(d.teacherId&&d.courseId&&!teacherTeachesCourse(d.teacherId,d.courseId))e.courseId="Teacher does not teach this subject";
  var list=state.timetable.filter(function(t){return t.id!==cur&&t.day===d.day;});
  for(var i=0;i<list.length;i++){
    var t=list[i];
    var s1=t2m(d.startTime),e1=t2m(d.endTime),s2=t2m(t.startTime),e2=t2m(t.endTime);
    if(s1<e2&&e1>s2){
      if(d.teacherId&&t.teacherId===d.teacherId)e.startTime="Teacher busy";
      else if(t.semesterId===d.semesterId&&t.sectionId===d.sectionId)e.startTime="Section busy";
    }
  }
  return e;
}

function findEligibleSubstitutes(timetableId,dateIso){
  var slot=state.timetable.find(function(t){return t.id===timetableId;});
  if(!slot)return [];
  var day=slot.day;
  return state.teachers.filter(function(t){
    if(t.id===slot.teacherId)return false;
    if(t.active===false)return false;
    var busy=state.timetable.some(function(other){
      if(other.id===slot.id||other.day!==day||other.teacherId!==t.id)return false;
      return t2m(slot.startTime)<t2m(other.endTime)&&t2m(slot.endTime)>t2m(other.startTime);
    });
    if(busy)return false;
    var onLeave=state.teacherLeaveApplications.some(function(l){
      return l.teacherId===t.id&&l.status===LEAVE_STATUS.APPROVED&&dateIso>=l.startDate&&dateIso<=l.endDate;
    });
    if(onLeave)return false;
    return true;
  });
}

function decideTeacherLeave(session,id,decision,remarks){
  if(session.role!=="chairman")throw new Error("Only Chairman");
  remarks=String(remarks||"").trim();
  if(!remarks)throw new Error("Decision reason is required");
  var before=state.teacherLeaveApplications.find(function(l){return l.id===id;});
  if(!before)throw new Error("Teacher leave not found");
  updateColl("teacherLeaveApplications",function(a){return a.map(function(l){return l.id===id?Object.assign({},l,{status:decision==="approve"?LEAVE_STATUS.APPROVED:LEAVE_STATUS.REJECTED,chairmanRemarks:remarks,decidedAt:nowIso()}):l;});});
  notifyUser(before.teacherId,"teacher","Your Leave "+(decision==="approve"?"Approved":"Rejected"),remarks,{type:decision==="approve"?"success":"error",relatedRecordId:id,relatedModule:"teacherLeaveApplications",relatedRoute:"#/app/teacher-leaves"});

  if(decision==="approve"){
    var affectedSlots=state.timetable.filter(function(t){return t.teacherId===before.teacherId;});
    var cur=new Date(before.startDate+"T00:00:00");
    var end=new Date(before.endDate+"T00:00:00");
    var dates=[];
    while(cur<=end){dates.push(cur.getFullYear()+"-"+String(cur.getMonth()+1).padStart(2,"0")+"-"+String(cur.getDate()).padStart(2,"0"));cur.setDate(cur.getDate()+1);}
    var created=[];
    dates.forEach(function(d){
      var dow=dayOfWeek(d);
      affectedSlots.filter(function(s){return s.day===dow;}).forEach(function(slot){
        var exists=state.substitutionRequests.some(function(r){return r.timetableId===slot.id&&r.date===d;});
        if(exists)return;
        var eligible=findEligibleSubstitutes(slot.id,d).map(function(t){return t.id;});
        var req={id:uid("sub"),timetableId:slot.id,courseId:slot.courseId,date:d,originalTeacherId:before.teacherId,requestedBy:session.userId,requestedByName:session.displayName,substituteTeacherId:null,candidates:eligible,status:eligible.length?"pending":"no_candidates",createdAt:nowIso(),decidedAt:null,reason:"Teacher leave "+before.id};
        created.push(req);
      });
    });
    if(created.length){
      updateColl("substitutionRequests",function(a){return a.concat(created);});
      created.forEach(function(req){
        if(req.candidates.length){
          req.candidates.forEach(function(tid){
            notifyUser(tid,"teacher","Substitute Request",session.displayName+" requests you cover a class on "+fmtDate(req.date)+".",{type:"warn",relatedRecordId:req.id,relatedModule:"substitutionRequests",relatedRoute:"#/app/substitutions"});
          });
        }else{
          notifyRole("chairman","Substitution Needed — No Candidates","No eligible substitute for "+fmtDate(req.date)+" class. Manual assignment required.",{type:"warn",relatedRecordId:req.id,relatedModule:"substitutionRequests",relatedRoute:"#/app/substitutions"});
        }
      });
      notifyRole("chairman","Substitution Requests Created",created.length+" substitution request(s) created for "+before.teacherName+"'s leave.",{relatedRecordId:before.id,relatedModule:"substitutionRequests",relatedRoute:"#/app/substitutions"});
    }
  }
}

function addCommitteeMember(session,data){
  requirePermission(session,"committees.manage");
  var cmt=state.committees.find(function(c){return c.id===data.committeeId;});
  if(!cmt)throw new Error("Committee not found");

  if(!data.memberName||!data.memberName.trim())e.memberName="Member name required";
  if(!data.position)e.position="Committee position required";
  if(findCommitteeMemberDupe(data.committeeId,data.memberName,data.designation,null))e.memberName="This member already exists in this committee (same name + designation).";
  if(Object.keys(e).length)throw {validation:e};
  var serial=state.committeeMembers.filter(function(m){return m.committeeId===data.committeeId&&m.status==="Active";}).length+1;
  var row=Object.assign({id:uid("cmm")},data,{serialNo:serial,status:"Active",joinedAt:nowIso(),addedBy:session.userId,addedByName:session.displayName});
  updateColl("committeeMembers",function(a){return a.concat([row]);});

  requirePermission(session,"committees.manage");

  if(!cur)throw new Error("Member not found");
  if(findCommitteeMemberDupe(cur.committeeId,patch.memberName||cur.memberName,patch.designation||cur.designation,id))throw {validation:{memberName:"Duplicate member in this committee."}};
  updateColl("committeeMembers",function(a){return a.map(function(m){return m.id===id?Object.assign({},m,patch,{updatedAt:nowIso()}):m;});});

function removeCommitteeMember(session,id){
  requirePermission(session,"committees.manage");
  updateColl("committeeMembers",function(a){return a.map(function(m){return m.id===id?Object.assign({},m,{status:"Removed",removedAt:nowIso()}):m;});});
  var removed=state.committeeMembers.find(function(m){return m.id===id;});
  if(removed){
    var remaining=state.committeeMembers.filter(function(m){return m.committeeId===removed.committeeId&&m.status==="Active";}).sort(function(a,b){return (a.serialNo||0)-(b.serialNo||0);});
    remaining.forEach(function(m,idx){updateColl("committeeMembers",function(a){return a.map(function(x){return x.id===m.id?Object.assign({},x,{serialNo:idx+1}):x;});});});

function createAssignment(session,data){
  if(session.role!=="teacher"&&session.role!=="chairman")throw new Error("Only teachers or Chairman");
  var e={};
  if(!data.title||!data.title.trim())e.title="Title required";

  state.students.filter(function(s){
    if(data.semesterId&&s.currentSemesterId!==data.semesterId)return false;
    if(data.sectionId&&s.currentSectionId!==data.sectionId)return false;

function getReminderStore(){try{var raw=localStorage.getItem(CLASS_REMINDER_KEY);return raw?JSON.parse(raw):{};}catch(e){return {};}}
function saveReminderStore(o){try{localStorage.setItem(CLASS_REMINDER_KEY,JSON.stringify(o));}catch(e){}}
function checkClassReminders(){
  var today=todayIso();
  var todayDay=dayOfWeek(new Date());
  var nowMin=t2m(new Date().toTimeString().slice(0,5));
  var store=getReminderStore();
  state.timetable.filter(function(t){return t.day===todayDay&&t.status==="Active";}).forEach(function(slot){
    var startMin=t2m(slot.startTime);
    var diff=startMin-nowMin;
    if(diff>=0&&diff<=5){
      var key=today+"_"+slot.id;
      if(store[key])return;
      store[key]=true;
      var c=state.courses.find(function(x){return x.id===slot.courseId;});
      var msg=(c?c.code+" "+c.name:"Class")+" starts at "+slot.startTime;
      if(slot.teacherId)notifyUser(slot.teacherId,"teacher","Class Starting Soon",msg,{relatedModule:"timetable",relatedRoute:"#/app/my-timetable"});
      state.students.filter(function(s){return s.currentSemesterId===slot.semesterId&&s.currentSectionId===slot.sectionId&&s.status==="Active";}).forEach(function(s){notifyUser(s.id,"student","Class Starting Soon",msg,{relatedModule:"timetable",relatedRoute:"#/app/my-timetable"});});
    }
  });
  saveReminderStore(store);
}
function testClassReminder(){
  var today=dayOfWeek(new Date());
  var slot=state.timetable.find(function(t){return t.day===today&&t.status==="Active";})||state.timetable[0];
  if(!slot){toast("No timetable slot to test","warn");return;}
  var c=state.courses.find(function(x){return x.id===slot.courseId;});
  var msg="[TEST] "+(c?c.code+" "+c.name:"Class")+" starts at "+slot.startTime;
  if(slot.teacherId)notifyUser(slot.teacherId,"teacher","Class Starting Soon",msg,{relatedModule:"timetable",relatedRoute:"#/app/my-timetable"});
  state.students.filter(function(s){return s.currentSemesterId===slot.semesterId&&s.currentSectionId===slot.sectionId;}).forEach(function(s){notifyUser(s.id,"student","Class Starting Soon",msg,{relatedModule:"timetable",relatedRoute:"#/app/my-timetable"});});
  toast("Test reminder sent","success");
}

function toast(msg,type,title){
  type=type||"info";
  var el=document.createElement("div");
  el.className="toast "+type;
  el.innerHTML="<strong>"+esc(title||(type==="success"?"Success":type==="error"?"Error":type==="warn"?"Warning":"Info"))+"</strong><p>"+esc(msg)+"</p>";
  document.getElementById("toast-root").appendChild(el);
  setTimeout(function(){el.style.opacity="0";el.style.transition="opacity .3s";},3400);
  setTimeout(function(){el.remove();},3800);
}
function labelIconButtons(root){
  $$("button",root).forEach(function(b){
    if(!b.querySelector("svg")||b.textContent.trim())return;
    var label=b.getAttribute("aria-label")||b.getAttribute("title")||"";
    if(!label&&b.id==="menuBtn")label="Open navigation";
    if(!label&&b.hasAttribute("data-close"))label="Close dialog";
    if(!label&&b.hasAttribute("data-edit"))label="Edit";
    if(!label&&b.hasAttribute("data-del"))label="Delete";
    if(label){b.setAttribute("aria-label",label);b.title=label;if(b.hasAttribute("data-edit")||b.hasAttribute("data-del"))b.classList.add("icon-action");}
  });
}
function openModal(o){
  var root=document.getElementById("modal-root");
  var bd=document.createElement("div");
  bd.className="modal-backdrop";
  bd.innerHTML='<div class="modal"><div class="modal-header"><h3>'+esc(o.title)+'</h3><button class="icon-btn" data-close>'+I.x+'</button></div><div class="modal-body">'+o.bodyHtml+'</div><div class="modal-footer">'+(o.footerHtml||"")+'</div></div>';
  root.appendChild(bd);
  labelIconButtons(bd);
  var close=function(){bd.remove();};
  bd.querySelector("[data-close]").onclick=close;
  bd.addEventListener("click",function(e){if(e.target===bd)close();});
  if(o.onMount)o.onMount(bd,close);
  return {el:bd,close:close};
}
function confirmDialog(o){
  return new Promise(function(res){
    var m=openModal({title:o.title||"Confirm",bodyHtml:"<p>"+esc(o.message)+"</p>",footerHtml:'<button class="btn btn-ghost" data-cancel>Cancel</button><button class="btn '+(o.danger?"btn-danger":"btn-primary")+'" data-confirm>'+esc(o.confirmLabel||"Confirm")+'</button>'});
    m.el.querySelector("[data-cancel]").onclick=function(){m.close();res(false);};
    m.el.querySelector("[data-confirm]").onclick=function(){m.close();res(true);};
  });
}
function textInputDialog(o){
  return new Promise(function(resolve){
    var required=o.required===true;
    var m=openModal({
      title:o.title||"Add remarks",
      bodyHtml:'<div class="field"><label for="workflowReason">'+esc(o.label||"Reason")+(required?' <span class="req">*</span>':'')+'</label><textarea id="workflowReason" rows="4" maxlength="500" placeholder="'+esc(o.placeholder||"")+'"></textarea><div id="workflowReasonError" class="err-msg"></div></div>',
      footerHtml:'<button class="btn btn-ghost" data-cancel>Cancel</button><button class="btn '+(o.danger?"btn-danger":"btn-primary")+'" data-submit>'+esc(o.submitLabel||"Continue")+'</button>'
    });
    var settled=false;
    var finish=function(v){if(settled)return;settled=true;m.close();resolve(v);};
    var input=m.el.querySelector("#workflowReason");
    m.el.querySelector("[data-close]").onclick=function(){finish(null);};
    m.el.querySelector("[data-cancel]").onclick=function(){finish(null);};
    m.el.querySelector("[data-submit]").onclick=function(){
      var v=input.value.trim();
      if(required&&!v){m.el.querySelector("#workflowReasonError").textContent="Reason is required.";input.focus();return;}
      finish(v);
    };
    input.focus();
  });
}
function downloadFile(filename,content,mime){
  var blob=new Blob([content],{type:mime||"text/plain"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");a.href=url;a.download=filename;a.click();
  setTimeout(function(){URL.revokeObjectURL(url);},500);
}
function exportCsv(filename,headers,rows){
  var csv=[headers].concat(rows).map(function(r){return r.map(function(c){return '"'+String(c==null?"":c).replace(/"/g,'""')+'"';}).join(",");}).join("\n");
  downloadFile(filename,csv,"text/csv;charset=utf-8;");toast("CSV downloaded","success");
}
function uploadFile(file){
  return new Promise(function(res,rej){
    if(file.size>5*1024*1024)return rej(new Error("Max 5 MB"));
    var r=new FileReader();
    r.onload=function(){res({fileName:file.name,fileType:file.type,fileSize:file.size,dataUrl:r.result});};
    r.onerror=rej;r.readAsDataURL(file);
  });
}

        fRole.classList.toggle("hidden",m!=="register");
        fName.classList.toggle("hidden",m!=="register");
        fPwd2.classList.toggle("hidden",m!=="register");
        quickLogin.classList.toggle("hidden",m!=="login");
        cardTitle.textContent=m==="login"?"Sign in":"Create Account";
        cardSub.textContent=m==="login"?"Enter your credentials to continue.":"Register — Chairman approval required.";
        lb.textContent=m==="login"?"Sign in":"Request Registration";

      tabLogin.onclick=function(){setMode("login");};
      tabRegister.onclick=function(){setMode("register");};
      $("#demoRole",root).onchange=function(e){

function LiveMonitorPage(ctx){
  var s=ctx.session;
  if(s.role!=="chairman")return AppShell({session:s,activePath:"#/app/live-monitor",title:"Live Monitor",childrenHtml:'<div class="empty-state"><h4>Chairman only</h4></div>'});
  var today=todayIso();var dow=dayOfWeek(new Date());
  var todaySlots=state.timetable.filter(function(t){return t.day===dow&&t.status==="Active";}).sort(function(a,b){return t2m(a.startTime)-t2m(b.startTime);});
  var nowM=t2m(new Date().toTimeString().slice(0,5));

  var rows=todaySlots.map(function(slot){
    var session=state.attendanceSessions.find(function(x){return x.timetableId===slot.id&&x.date===today;});
    var c=state.courses.find(function(x){return x.id===slot.courseId;});
    var orig=state.teachers.find(function(x){return x.id===slot.teacherId;});
    var eff=M.effectiveTeacherId(slot.id,today);
    var effTeacher=state.teachers.find(function(x){return x.id===eff;});
    var sub=state.substitutionRequests.find(function(r){return r.timetableId===slot.id&&r.date===today;});
    var enrolled=state.students.filter(function(x){return x.currentSemesterId===slot.semesterId&&x.currentSectionId===slot.sectionId&&x.status==="Active";}).length;
    var recs=session?state.attendanceRecords.filter(function(r){return r.sessionId===session.id;}):[];
    var present=recs.filter(function(r){return r.status===ATT.PRESENT;}).length;
    var late=recs.filter(function(r){return r.status===ATT.LATE;}).length;
    var leave=recs.filter(function(r){return r.status===ATT.LEAVE;}).length;
    var absent=enrolled-present-late-leave;
    var status="Scheduled";var badge="badge-gray";
    var endM=t2m(slot.endTime),startM=t2m(slot.startTime);
    if(session&&session.status==="open"){
      if(session.delayMinutes>0){status="Live · Delayed "+session.delayMinutes+"m";badge="badge-warn";}
      else{status="Live";badge="badge-success";}
    } else if(session&&session.status==="closed"){
      status="Completed";badge="badge-info";
    } else if(sub&&sub.status==="pending"){
      status="Substitute Requested";badge="badge-warn";
    } else if(sub&&sub.status==="accepted"){
      status="Substitute Accepted · Awaiting Start";badge="badge-info";
    } else if(sub&&sub.status==="no_candidates"){
      status="Substitution Needed";badge="badge-danger";
    } else if(nowM>startM+15){
      status="Awaiting Teacher Start";badge="badge-warn";
    } else if(nowM>endM){
      status="Missed";badge="badge-danger";
    }

    return {
      slot:slot,session:session,c:c,orig:orig,eff:effTeacher,
      enrolled:enrolled,present:present,late:late,absent:absent,leave:leave,
      status:status,badge:badge
    };
  });

  var tbody=rows.map(function(r){
    return '<tr>'+
      '<td><strong>'+esc(r.slot.startTime)+'–'+esc(r.slot.endTime)+'</strong></td>'+
      '<td>'+esc(r.c?r.c.code+" "+r.c.name:"")+'</td>'+
      '<td>'+esc(r.orig?r.orig.name:"")+'</td>'+
      '<td>'+(r.eff&&r.eff.id!==r.orig.id?'<strong style="color:var(--wn)">'+esc(r.eff.name)+' (sub)</strong>':esc(r.eff?r.eff.name:"—"))+'</td>'+
      '<td>'+esc(r.slot.className||"")+'</td>'+
      '<td>'+(r.session?esc(r.session.scheduledStart)+' → '+esc(fmtTime(r.session.actualStart)):'—')+'</td>'+
      '<td>'+(r.session?(r.session.delayMinutes>0?'<span class="badge badge-warn">+'+r.session.delayMinutes+'m</span>':'<span class="badge badge-success">On time</span>'):'—')+'</td>'+
      '<td>'+r.enrolled+'</td>'+
      '<td>'+r.present+'</td><td>'+r.late+'</td><td>'+r.leave+'</td><td>'+Math.max(0,r.absent)+'</td>'+
      '<td><span class="badge '+r.badge+'">'+esc(r.status)+'</span></td>'+
      '</tr>';
  }).join("")||'<tr><td colspan="12" class="empty">No classes scheduled today.</td></tr>';

  return AppShell({
    session:s,activePath:"#/app/live-monitor",title:"Live Class Monitor",
    childrenHtml:'<div class="stat-grid mb-3">'+
      statCard("Today's Classes",rows.length)+
      statCard("Live Now",rows.filter(function(r){return r.session&&r.session.status==="open";}).length,"","success")+
      statCard("Awaiting Start",rows.filter(function(r){return !r.session&&r.status.indexOf("Awaiting")>=0;}).length,"","warn")+
      statCard("Substitutions",rows.filter(function(r){return r.eff&&r.orig&&r.eff.id!==r.orig.id;}).length)+
      '</div>'+
      '<div class="card"><div class="card-header"><h3>Today\'s Classes ('+fmtDate(today)+')</h3><button class="btn btn-ghost btn-sm" id="refreshBtn" style="margin-left:auto">'+I.refresh+' Refresh</button></div><div class="card-body"><div class="table-wrap"><table class="data"><thead><tr><th>Time</th><th>Course</th><th>Original</th><th>Effective</th><th>Class</th><th>Start (sched → actual)</th><th>Delay</th><th>Enr</th><th>P</th><th>L</th><th>Lv</th><th>A</th><th>Status</th></tr></thead><tbody>'+tbody+'</tbody></table></div><div class="muted mt-2">Live = teacher has started the session. Delay = actual − scheduled start.</div></div></div>',
    onMount:function(root){
      var b=$("#refreshBtn",root);if(b)b.onclick=renderRoute;
      setTimeout(function(){if(location.hash==="#/app/live-monitor")renderRoute();},30000);
    }
  });
}

function openStartConfirm(o){

  var bodyHtml='<div class="mb-2"><strong>'+esc(c?c.code+" — "+c.name:"")+'</strong><div class="muted">Scheduled: '+esc(slot.startTime)+'–'+esc(slot.endTime)+'</div></div><div class="field mb-2"><label>Actual Start Time</label><input type="time" id="actualStart" value="'+esc(defaultActual)+'" /></div><div class="muted mb-2" id="delayInfo">Delay: '+delay+' minutes</div><div class="hardcopy-note">The QR will remain active for '+getSettings().qrValiditySeconds+' seconds. Rotate as needed. Students arriving within '+getSettings().gracePeriodMinutes+' minutes of the ACTUAL start are not late.</div>';

  if(!a)return;
  var subs=state.assignmentSubmissions.filter(function(x){return x.assignmentId===aid;});
  var bodyHtml='<div class="mb-2"><strong>'+esc(a.title)+'</strong><div class="muted">Due: '+fmtDate(a.dueDate)+'</div></div>';
  if(s.role==="student"||s.role==="parent"){

    if(mine)bodyHtml+='<div class="card"><div class="card-body"><strong>Your submission:</strong> '+esc(mine.status)+'<div class="muted">'+fmtDT(mine.submittedAt)+'</div>'+(mine.grade?'<div>Grade: '+esc(mine.grade)+'</div>':'')+'</div></div>';

  }else{

      (subs.map(function(x){return '<tr><td>'+esc(x.studentName)+'</td><td>'+fmtDT(x.submittedAt)+'</td><td>'+esc(x.status)+'</td><td>'+esc(x.grade||"—")+'</td><td>'+(x.fileDataUrl?'<a href="'+x.fileDataUrl+'" download="'+esc(x.fileName||"file")+'">Download</a>':'—')+'</td><td><button class="btn btn-ghost btn-sm" data-grade="'+x.id+'">Grade</button></td></tr>';}).join("")||'<tr><td colspan="6" class="empty">No submissions.</td></tr>')+
    '</tbody></table></div>';
  }
  openModal({
    title:"Assignment",bodyHtml:bodyHtml,
    footerHtml:'<button class="btn btn-ghost" data-cancel>Close</button>',
    onMount:function(root,close){
      root.querySelector("[data-cancel]").onclick=close;

        var file=$("input[type=file]",root).files[0];

        if(file)uploadFile(file).then(function(r){d.fileDataUrl=r.dataUrl;d.fileName=r.fileName;d.fileType=r.fileType;fin();}).catch(function(err){toast(err.message,"error");});

      };

    }
  });

function ImportPage(ctx){
  var s=ctx.session;
  return AppShell({
    session:s,activePath:"#/app/import",title:"Import Students",
    childrenHtml:'<div class="card mb-2"><div class="card-header"><h3>Upload CSV</h3></div><div class="card-body"><p class="muted">Columns: admissionNumber, registrationNumber, classNumber, name, fatherName, studentMobile, currentSemesterId, currentSectionId</p><input type="file" id="csvIn" accept=".csv" class="mt-2" /></div></div><div class="card"><div class="card-header"><h3>Preview</h3></div><div class="card-body" id="prev"><div class="empty-state"><h4>No file</h4></div></div></div>',

          var rows;try{rows=parseCsvRows(String(rd.result));}catch(err){toast(err.message,"error");return;}

          $("#prev",root).innerHTML=html;
          $("#impBtn",root).onclick=function(){
            var valid=prev.filter(function(p){return p.valid;}).map(function(p){return Object.assign({id:uid("stu"),createdAt:nowIso()},p.data,{status:p.data.status||"Active"});});
            updateColl("students",function(a){return a.concat(valid);});
            toast("Imported "+valid.length,"success");renderRoute();
          };

      };

function parseCsvRows(text){
  var rows=[],row=[],cell="",q=false;
  for(var i=0;i<text.length;i++){
    var ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=ch;}
    else if(ch==='"'&&cell.length===0)q=true;
    else if(ch===","){row.push(cell);cell="";}
    else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&text[i+1]==="\n")i++;row.push(cell);cell="";if(row.some(function(v){return v!=="";}))rows.push(row);row=[];}
    else cell+=ch;
  }
  if(q)throw new Error("Unclosed quote");
  if(cell!==""||row.length){row.push(cell);if(row.some(function(v){return v!=="";}))rows.push(row);}
  return rows;
}

    (files.slice().reverse().map(function(f){return '<tr><td><strong>'+esc(f.title)+'</strong>'+(f.fileName?'<div class="muted">'+esc(f.fileName)+'</div>':'')+'</td><td>'+esc(f.sharedByName||"")+'</td><td>'+esc((f.sharedWithRoles||[]).join(", "))+'</td><td>'+fmtDT(f.sharedAt)+'</td><td><a class="btn btn-ghost btn-sm" href="'+f.dataUrl+'" download="'+esc(f.fileName||"file")+'">'+I.download+' Download</a>'+(isChair?' <button class="btn btn-ghost btn-sm" data-del="'+f.id+'">'+I.trash+'</button>':'')+'</td></tr>';}).join("")||'<tr><td colspan="5" class="empty">None.</td></tr>')+
    '</tbody></table></div></div></div>',
    onMount:function(root){
      var form=$("#sf",root);
      if(form)form.onsubmit=function(e){
        e.preventDefault();var d={};new FormData(e.target).forEach(function(v,k){if(k!=="file"&&k.indexOf("role_")!==0)d[k]=v;});
        d.sharedWithRoles=[];
        if(root.querySelector("input[name=role_coordinator]").checked)d.sharedWithRoles.push("coordinator");
        if(root.querySelector("input[name=role_clerk]").checked)d.sharedWithRoles.push("clerk");
        if(!d.sharedWithRoles.length){toast("Select at least one role","error");return;}
        var file=$("input[type=file]",root).files[0];
        if(!file){toast("Choose a file","error");return;}
        uploadFile(file).then(function(r){d.dataUrl=r.dataUrl;d.fileName=r.fileName;d.fileType=r.fileType;d.fileSize=r.fileSize;try{M.shareFile(s,d);toast("Shared","success");renderRoute();}catch(err){toast(err.message,"error");}}).catch(function(err){toast(err.message,"error");});
      };
      $$("[data-del]",root).forEach(function(b){b.onclick=function(){confirmDialog({title:"Delete File",message:"Confirm?",confirmLabel:"Delete",danger:true}).then(function(ok){if(!ok)return;M.deleteSharedFile(s,b.dataset.del);toast("Deleted","success");renderRoute();});};});
    }
  });
}
function findRoute(path){
  for(var i=0;i<routes.length;i++){
    var r=routes[i];var keys=[];var pattern=r.path.replace(/:([^/]+)/g,function(_,k){keys.push(k);return "([^/]+)";});
    var m=path.match(new RegExp("^"+pattern+"$"));
    if(m){var params={};keys.forEach(function(k,idx){params[k]=decodeURIComponent(m[idx+1]);});return {route:r,params:params};}
  }
  return null;
}
function renderRoute(){
  var path=location.hash||"#/login";
  var session=state.session;
  if(path!=="#/login"&&!session){location.hash="#/login";return;}
  if(path==="#/login"&&session){location.hash="#/app/dashboard";return;}
  var match=findRoute(path);
  if(!match){
    if(!session){location.hash="#/login";return;}
    mountPage(AppShell({session:session,activePath:path,title:"Not Found",childrenHtml:'<div class="empty-state"><h4>Page not found</h4><p>'+esc(path)+'</p></div>'}));return;
  }
  mountPage(match.route.page({session:session,params:match.params}));
}
function mountPage(page){
  var root=document.getElementById("app-root");
  root.innerHTML=page.html;
  if(page.mount)page.mount(root);
  labelIconButtons(root);
}
window.addEventListener("hashchange",renderRoute);
G.on("session:change",renderRoute);
