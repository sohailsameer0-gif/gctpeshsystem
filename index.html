<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
:root{
  --bg-main:#fceef5; --bg-sidebar:#261c4a; --bg-card:#ffffff;
  --primary:#d62a9b; --primary-light:#f7a8d8; --primary-gradient:linear-gradient(135deg,#d62a9b,#8c27b0);
  --text-dark:#2d1b36; --text-muted:#8c7b96; --border:#f0d9e8;
  --radius:16px; --shadow:0 10px 30px rgba(214,42,155,0.08);
  --success:#10b981; --warning:#f59e0b; --danger:#ef4444;
  --font:'Poppins',sans-serif;
}
#app-root,#app-root *,#toast-root,#toast-root *,#modal-root,#modal-root *{box-sizing:border-box;margin:0;padding:0;font-family:var(--font)!important}
#app-root{background:var(--bg-main);color:var(--text-dark);min-height:100vh}

/* Sidebar */
.app-shell{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.app-sidebar{background:var(--bg-sidebar);color:#fff;display:flex;flex-direction:column;height:100vh;position:sticky;top:0;border-radius:0 24px 24px 0;padding:24px 0}
.brand{padding:0 24px 24px;display:flex;gap:12px;align-items:center;border-bottom:1px solid rgba(255,255,255,0.1);margin-bottom:20px}
.brand-logo{width:44px;height:44px;border-radius:50%;background:linear-gradient(145deg,#f7a8d8,#d62a9b);display:grid;place-items:center;font-weight:800;color:#fff;font-size:16px}
.brand-text strong{display:block;font-size:15px}
.brand-text span{font-size:11px;opacity:0.7}
.nav{flex:1;overflow-y:auto}
.nav-group-title{font-size:10px;text-transform:uppercase;color:#a385ff;letter-spacing:1px;padding:12px 24px 4px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:12px;padding:12px 24px;color:rgba(255,255,255,0.7);font-size:13px;text-decoration:none;transition:0.2s;cursor:pointer}
.nav-item:hover,.nav-item.active{color:#fff;background:linear-gradient(90deg,rgba(214,42,155,0.2),transparent);border-left:4px solid var(--primary)}
.nav-icon svg{width:18px;height:18px}

/* Topbar */
.app-main{display:flex;flex-direction:column}
.app-topbar{background:transparent;display:flex;align-items:center;justify-content:space-between;padding:24px 32px}
.topbar-title{font-size:22px;font-weight:600;color:var(--text-dark)}
.search-bar{background:#fff;border-radius:20px;padding:10px 20px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow);width:300px}
.search-bar input{border:none;outline:none;font-size:13px;width:100%}
.topbar-actions{display:flex;gap:16px;align-items:center}
.icon-btn{width:40px;height:40px;border-radius:50%;background:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow);border:none;color:var(--text-muted)}
.user-chip{display:flex;align-items:center;gap:10px;background:#fff;padding:6px 16px 6px 6px;border-radius:30px;box-shadow:var(--shadow);text-decoration:none}
.user-avatar{width:36px;height:36px;border-radius:50%;background:var(--primary-gradient);color:#fff;display:grid;place-items:center;font-weight:600}

/* Content */
.app-content{padding:0 32px 32px}

/* Cards & Widgets */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px;margin-bottom:24px}
.stat-card{background:#fff;border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);border:1px solid var(--border);position:relative;overflow:hidden}
.stat-card::after{content:'';position:absolute;right:-20px;top:-20px;width:100px;height:100px;background:var(--bg-main);border-radius:50%;z-index:0}
.stat-card .label{font-size:12px;color:var(--text-muted);font-weight:600;text-transform:uppercase;z-index:1;position:relative}
.stat-card .value{font-size:28px;font-weight:700;color:var(--text-dark);margin-top:8px;z-index:1;position:relative}

.card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:24px;overflow:hidden}
.card-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.card-header h3{font-size:16px;font-weight:600}
.card-body{padding:24px}

/* Tables */
.table-wrap{overflow-x:auto}
table.data{width:100%;border-collapse:collapse;font-size:13px}
table.data th{text-align:left;padding:16px;color:var(--text-muted);font-weight:500;border-bottom:1px solid var(--border);background:#faf5f8}
table.data td{padding:16px;border-bottom:1px solid var(--border);color:var(--text-dark)}
table.data tr:last-child td{border-bottom:none}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 20px;border-radius:30px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:0.2s}
.btn-primary{background:var(--primary-gradient);color:#fff;box-shadow:0 4px 15px rgba(214,42,155,0.3)}
.btn-primary:hover{transform:translateY(-2px)}
.btn-ghost{background:#fff;color:var(--text-dark);border:1px solid var(--border)}
.btn-sm{padding:6px 14px;font-size:11px}
.badge{padding:4px 12px;border-radius:20px;font-size:11px;font-weight:600}
.badge-success{background:#d1fae5;color:#065f46}
.badge-warn{background:#fef3c7;color:#92400e}
.badge-danger{background:#fee2e2;color:#991b1b}

/* Login */
.login-page{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;background:var(--bg-main)}
.login-left{background:var(--primary-gradient);color:#fff;display:flex;flex-direction:column;justify-content:center;padding:60px;border-radius:0 40px 40px 0}
.login-left h1{font-size:36px;line-height:1.2;margin-bottom:20px}
.login-right{display:grid;place-items:center;padding:40px}
.login-card{background:#fff;padding:40px;border-radius:var(--radius);box-shadow:var(--shadow);width:100%;max-width:420px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label{font-size:12px;font-weight:600}
.field input,.field select,.field textarea{padding:12px;border:1px solid var(--border);border-radius:10px;font-size:13px;background:#faf5f8}
.field input:focus{outline:none;border-color:var(--primary)}

/* Modals & Toasts */
#modal-root .modal-backdrop{position:fixed;inset:0;background:rgba(38,28,74,0.6);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:9999}
#modal-root .modal{background:#fff;border-radius:var(--radius);width:100%;max-width:600px;max-height:90vh;display:flex;flex-direction:column}
#modal-root .modal-header{padding:20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between}
#modal-root .modal-body{padding:20px;overflow-y:auto}
#modal-root .modal-footer{padding:20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
#toast-root{position:fixed;top:20px;right:20px;z-index:10000;display:flex;flex-direction:column;gap:10px}
.toast{background:#fff;padding:16px 20px;border-radius:12px;box-shadow:var(--shadow);border-left:4px solid var(--primary);min-width:300px}
.toast.success{border-left-color:var(--success)}
.toast.error{border-left-color:var(--danger)}

/* Utilities */
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.row.between{justify-content:space-between}
.muted{color:var(--text-muted);font-size:12px}
.mt-2{margin-top:16px} .mt-3{margin-top:24px} .mb-2{margin-bottom:16px} .mb-3{margin-bottom:24px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.app-shell{grid-template-columns:1fr}.app-sidebar{position:fixed;left:-280px;z-index:100;transition:0.3s}.app-sidebar.open{left:0}.login-page{grid-template-columns:1fr}.login-left{display:none}.form-grid{grid-template-columns:1fr}}
</style>
<div id="app-root"></div>
<div id="toast-root"></div>
<div id="modal-root"></div>
<script>
(function(){
"use strict";
var $=function(s,r){return (r||document).querySelector(s);};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};
var uid=function(p){return (p||"id")+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,7);};
var nowIso=function(){return new Date().toISOString();};
var todayIso=function(){return new Date().toISOString().slice(0,10);};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];});};
var fmtDate=function(d){if(!d)return "—";var t=new Date(d);if(isNaN(t))return "—";return t.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});};
var t2m=function(t){if(!t)return 0;var p=String(t).split(":");return Number(p[0])*60+Number(p[1]);};
var num=function(v){return Number(v||0);};
var dayOfWeek=function(d){return ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][new Date(d).getDay()];};

var STORAGE_KEY="gct_erp_v12";
var state=loadState();
function loadState(){
  try{
    var raw=localStorage.getItem(STORAGE_KEY);
    if(!raw)return {};
    return JSON.parse(raw);
  }catch(e){return {};}
}
function saveState(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){}}

var ROLE_LABELS={chairman:"Chairman",teacher:"Teacher",coordinator:"Coordinator",clerk:"Assistant Clerk",student:"Student",parent:"Parent"};
var ATT={PRESENT:"present",LATE:"late",ABSENT:"absent",LEAVE:"approved_leave"};
var LEAVE_STATUS={WITH_TEACHER:"with_teacher",WITH_CHAIRMAN:"with_chairman",APPROVED:"approved",REJECTED:"rejected"};
var DAYS=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
var LEAVE_TYPES=["Medical","Emergency","Family","Personal","Other"];
var SECTIONS=["A","B","C","D","E"];

function can(role,perm){
  if(!role)return false;
  if(role==="chairman")return true;
  var perms={
    teacher:["dashboard.view","qr.start","attendance.manual","leaves.forward","leaves.review","leaves.decide","substitute.request","substitute.accept","students.view"],
    student:["dashboard.view","qr.scan","leaves.submit","profile.view"],
    parent:["dashboard.view","child.view"]
  };
  return (perms[role]||[]).indexOf(perm)>=0;
}

window.__GCT__={
  $:$,$$:$$,uid:uid,nowIso:nowIso,todayIso:todayIso,esc:esc,fmtDate:fmtDate,t2m:t2m,num:num,dayOfWeek:dayOfWeek,
  ROLE_LABELS:ROLE_LABELS,ATT:ATT,LEAVE_STATUS:LEAVE_STATUS,DAYS:DAYS,LEAVE_TYPES:LEAVE_TYPES,SECTIONS:SECTIONS,
  get state(){return state;}, saveState:saveState, can:can
};
})();
</script>
<script>
(function(){
"use strict";
var G=window.__GCT__;
var $=G.$,$$=G.$$,uid=G.uid,nowIso=G.nowIso,todayIso=G.todayIso,esc=G.esc,t2m=G.t2m,dayOfWeek=G.dayOfWeek;
var state=G.state;

// ==========================================
// 1. LIVE CLASSES (Chairman Dashboard)
// ==========================================
function getLiveClasses(){
  // Sirf wohi classes dikhayen jo Teacher ne START ki hain (attendanceSessions table se)
  return (state.attendanceSessions||[]).filter(function(s){
    return s.status==="open" && s.date===todayIso();
  }).map(function(s){
    var slot = state.timetable.find(function(t){return t.id===s.timetableId;});
    var course = state.courses.find(function(c){return c.id===slot.courseId;});
    var teacher = state.teachers.find(function(t){return t.id===s.originalTeacherId;});
    var substitute = state.teachers.find(function(t){return t.id===s.substituteTeacherId;});
    return {session:s, slot:slot, course:course, teacher:teacher, substitute:substitute};
  });
}

// ==========================================
// 2. TEACHER STARTS QR (Manual Time Entry)
// ==========================================
function startQrSession(session, data){
  if(session.role!=="teacher") throw new Error("Only teachers can start QR.");
  
  var slot = state.timetable.find(function(t){return t.id===data.timetableId;});
  if(!slot) throw new Error("Slot not found");

  // Agar teacher substitute hai, to check karein ke usne accept kiya hai ya nahi
  var isSub = state.substituteRequests.some(function(r){
    return r.slotId===slot.id && r.substituteTeacherId===session.linkedId && r.status==="accepted" && r.date===todayIso();
  });

  if(slot.teacherId!==session.linkedId && !isSub){
    throw new Error("You are not assigned to this class.");
  }

  var actualStartTime = data.actualStartTime; // Teacher manually enter karega (e.g. 09:15)
  if(!actualStartTime) throw new Error("Please enter actual start time.");

  var ttl = 45 * 1000; // 45 seconds QR validity
  var newSession = {
    id: uid("att"),
    timetableId: slot.id,
    originalTeacherId: slot.teacherId,
    substituteTeacherId: isSub ? session.linkedId : null,
    courseId: slot.courseId,
    semesterId: slot.semesterId,
    sectionId: slot.sectionId,
    className: slot.className,
    date: todayIso(),
    scheduledStart: slot.startTime,
    actualStart: actualStartTime, // Yeh time late calculation ke liye use hoga
    qrToken: "qr_"+Math.random().toString(36).slice(2,10),
    qrExpiresAt: new Date(Date.now()+ttl).toISOString(),
    status: "open"
  };

  state.attendanceSessions = (state.attendanceSessions||[]).concat([newSession]);
  G.saveState();
  return newSession;
}

function closeSession(sessionId){
  state.attendanceSessions = state.attendanceSessions.map(function(s){
    return s.id===sessionId ? Object.assign({}, s, {status:"closed"}) : s;
  });
  G.saveState();
}

// ==========================================
// 3. SUBSTITUTE LOGIC
// ==========================================
function createSubstituteRequest(session, data){
  if(session.role!=="teacher") throw new Error("Only teachers");
  
  var slot = state.timetable.find(function(t){return t.id===data.slotId;});
  if(!slot) throw new Error("Slot not found");

  var subTeacher = state.teachers.find(function(t){return t.id===data.substituteTeacherId;});
  if(!subTeacher) throw new Error("Substitute teacher not found");

  var req = {
    id: uid("sub"),
    slotId: slot.id,
    date: todayIso(),
    originalTeacherId: session.linkedId,
    originalTeacherName: session.displayName,
    substituteTeacherId: data.substituteTeacherId,
    substituteTeacherName: subTeacher.name,
    reason: data.reason || "Late Arrival",
    status: "pending",
    requestedAt: nowIso()
  };

  state.substituteRequests = (state.substituteRequests||[]).concat([req]);
  G.saveState();
  return req;
}

function acceptSubstituteRequest(session, reqId){
  var req = state.substituteRequests.find(function(r){return r.id===reqId;});
  if(!req) throw new Error("Request not found");
  
  state.substituteRequests = state.substituteRequests.map(function(r){
    return r.id===reqId ? Object.assign({}, r, {status:"accepted", acceptedAt:nowIso()}) : r;
  });
  G.saveState();
}

// ==========================================
// 4. STUDENT QR SCAN & LATE CALCULATION
// ==========================================
function scanQr(session, data){
  if(session.role!=="student") throw new Error("Only students can scan.");
  
  var attSession = state.attendanceSessions.find(function(s){return s.qrToken===data.token;});
  if(!attSession) throw new Error("Invalid or expired QR.");
  if(attSession.status!=="open") throw new Error("Session is closed.");
  if(new Date(attSession.qrExpiresAt) < new Date()) throw new Error("QR code expired.");

  // Check if already marked
  var alreadyMarked = (state.attendanceRecords||[]).some(function(r){
    return r.sessionId===attSession.id && r.studentId===session.linkedId;
  });
  if(alreadyMarked) throw new Error("Attendance already marked for this session.");

  // Calculate Late
  var now = new Date();
  var currentTimeStr = now.toTimeString().slice(0,5); // HH:MM
  var actualStartMin = t2m(attSession.actualStart);
  var currentMin = t2m(currentTimeStr);

  var diff = Math.max(0, currentMin - actualStartMin);
  // Rule: Agar 15 minute (ya jo bhi teacher ne set kiya ho) se zyada late hai to Late
  var status = diff > 15 ? G.ATT.LATE : G.ATT.PRESENT;

  // Agar late hai, to check karein ke chairman/teacher ne approve kiya hai ya nahi
  if(status === G.ATT.LATE){
    var isApproved = (state.lateScanRequests||[]).some(function(r){
      return r.studentId===session.linkedId && r.date===todayIso() && r.status==="approved";
    });
    if(!isApproved) throw new Error("You are late. Please request late approval from your teacher.");
  }

  var record = {
    id: uid("rec"),
    sessionId: attSession.id,
    studentId: session.linkedId,
    courseId: attSession.courseId,
    teacherId: attSession.substituteTeacherId || attSession.originalTeacherId,
    date: todayIso(),
    arrivalTime: currentTimeStr,
    status: status,
    lateMinutes: diff
  };

  state.attendanceRecords = (state.attendanceRecords||[]).concat([record]);
  G.saveState();
  return record;
}

// ==========================================
// 5. LEAVE LOGIC (Approve -> Mark Attendance)
// ==========================================
function approveLeave(session, leaveId){
  var leave = state.leaveApplications.find(function(l){return l.id===leaveId;});
  if(!leave) throw new Error("Leave not found");

  // Update leave status
  state.leaveApplications = state.leaveApplications.map(function(l){
    return l.id===leaveId ? Object.assign({}, l, {status:G.LEAVE_STATUS.APPROVED, decidedAt:nowIso()}) : l;
  });

  // Automatically mark attendance as LEAVE for those dates
  var current = new Date(leave.startDate);
  var end = new Date(leave.endDate);
  
  while(current <= end){
    var dateStr = current.toISOString().slice(0,10);
    var dayName = dayOfWeek(current);
    
    // Find classes on this day
    var slots = state.timetable.filter(function(t){
      return t.semesterId===leave.semesterId && t.sectionId===leave.sectionId && t.day===dayName;
    });

    slots.forEach(function(slot){
      // Check if already marked
      var exists = state.attendanceRecords.some(function(r){
        return r.studentId===leave.studentId && r.date===dateStr && r.courseId===slot.courseId;
      });
      if(!exists){
        state.attendanceRecords.push({
          id: uid("rec_leave"),
          sessionId: "leave_"+leaveId,
          studentId: leave.studentId,
          courseId: slot.courseId,
          teacherId: slot.teacherId,
          date: dateStr,
          status: G.ATT.LEAVE,
          manual: true,
          remarks: "Approved Leave"
        });
      }
    });
    current.setDate(current.getDate() + 1);
  }
  
  G.saveState();
}

window.__GCT__.mod = {
  getLiveClasses: getLiveClasses,
  startQrSession: startQrSession,
  closeSession: closeSession,
  createSubstituteRequest: createSubstituteRequest,
  acceptSubstituteRequest: acceptSubstituteRequest,
  scanQr: scanQr,
  approveLeave: approveLeave
};
})();
</script>

// --- Navigation (Assignments removed) ---
var NAV = {

    ]},
    { group: "Management", items: [
      { label: "Teachers", path: "#/app/teachers", icon: ICONS.students },

    ]}
  ],
  teacher: [

      { label: "Manual Attendance", path: "#/app/attendance", icon: ICONS.students },
      { label: "Leave Approvals", path: "#/app/leaves", icon: ICONS.leave },
      { label: "Substitutes", path: "#/app/substitutes", icon: ICONS.students }
    ]}
  ]
};

// --- UI Shell ---
function AppShell(o){
  var session = o.session;
  var menu = NAV[session.role] || [];
  var initials = (session.displayName || "U").charAt(0).toUpperCase();
  var navHtml = "";
  
  menu.forEach(function(g){
    navHtml += '<div class="nav-group"><div class="nav-group-title">'+g.group+'</div>';
    g.items.forEach(function(it){
      navHtml += '<a class="nav-item '+(o.activePath===it.path?"active":"")+'" href="'+it.path+'" data-nav="'+it.path+'"><span class="nav-icon">'+it.icon+'</span><span>'+it.label+'</span></a>';
    });
    navHtml += '</div>';
  });

  return {
    html: '<div class="app-shell">' +
      '<aside class="app-sidebar" id="appSidebar">' +
        '<div class="brand"><div class="brand-logo">GCT</div><div class="brand-text"><strong>GCT ERP</strong><span>Dept System</span></div></div>' +
        '<nav class="nav">'+navHtml+'</nav>' +
      '</aside>' +
      '<main class="app-main">' +
        '<header class="app-topbar">' +
          '<div class="row" style="gap:16px"><button class="icon-btn" id="menuBtn" style="display:none">=</button><div class="topbar-title">'+esc(o.title)+'</div></div>' +
          '<div class="row" style="gap:16px;align-items:center">' +
            '<div class="search-bar"><span class="muted">🔍</span><input placeholder="Search here..." /></div>' +
            '<a class="icon-btn" href="#/app/notifications">'+ICONS.bell+'</a>' +
            '<a class="user-chip" href="#/app/profile"><div class="user-avatar">'+initials+'</div><span style="font-size:13px;font-weight:600;color:#2d1b36">'+esc(session.displayName)+'</span></a>' +
            '<button class="icon-btn" id="logoutBtn" title="Logout">↪</button>' +
          '</div>' +
        '</header>' +
        '<section class="app-content">'+o.childrenHtml+'</section>' +
      '</main>' +
    '</div>',
    mount: function(root){
      var lb = $("#logoutBtn", root);
      if(lb) lb.onclick = function(){ state.session = null; G.saveState(); location.hash = "#/login"; };
      $$("[data-nav]", root).forEach(function(el){
        el.onclick = function(e){
          e.preventDefault();
          location.hash = el.getAttribute("data-nav");
        };
      });
      if(o.onMount) o.onMount(root);
    }
  };
}

// --- Login Page ---
function LoginPage(){
  return {
    html: '<div class="login-page">' +
      '<div class="login-left"><h1>Department<br>Management System</h1><p>Welcome back. Please login to your account.</p></div>' +
      '<div class="login-right"><div class="login-card">' +
        '<h2 style="margin-bottom:20px">Login</h2>' +
        '<form id="lf">' +
          '<div class="field"><label>Email</label><input type="email" name="email" placeholder="teacher@gct.edu.pk" required /></div>' +
          '<div class="field"><label>Password</label><input type="password" name="password" placeholder="••••••••" required /></div>' +
          '<button type="submit" class="btn btn-primary" style="width:100%;margin-top:16px">Sign In</button>' +
        '</form>' +
      '</div></div>' +
    '</div>',
    mount: function(root){
      $("#lf", root).onsubmit = function(e){
        e.preventDefault();
        var email = e.target.email.value;

        if(email==="chairman@gct.edu.pk"){
          state.session = {role:"chairman", displayName:"Chairman", linkedId:null};
        } else if(email==="teacher@gct.edu.pk"){
          state.session = {role:"teacher", displayName:"Engr. Ahmed", linkedId:"tch_1"};
        } else {
          alert("Use chairman@gct.edu.pk or teacher@gct.edu.pk for demo");
          return;
        }
        G.saveState();
        location.hash = "#/app/dashboard";
        renderRoute();
      };
    }

}

// --- Chairman Dashboard (Live Monitor) ---
function ChairmanDashboard(ctx){
  var live = M.getLiveClasses();
  var html = '<div class="stat-grid">' +
    '<div class="stat-card"><div class="label">Live Classes</div><div class="value">'+live.length+'</div></div>' +
    '<div class="stat-card"><div class="label">Total Teachers</div><div class="value">'+state.teachers.length+'</div></div>' +
    '<div class="stat-card"><div class="label">Total Students</div><div class="value">'+state.students.length+'</div></div>' +
  '</div>' +
  '<div class="card"><div class="card-header"><h3>Live Monitor</h3></div><div class="card-body">';
  
  if(live.length === 0){
    html += '<p class="muted">No classes are currently live.</p>';
  } else {
    live.forEach(function(lc){
      html += '<div class="row between" style="padding:16px;border:1px solid var(--border);border-radius:12px;margin-bottom:12px">' +
        '<div><strong>'+esc(lc.course.name)+'</strong><div class="muted">By: '+esc(lc.substitute ? lc.substitute.name + " (Substitute)" : lc.teacher.name)+'</div></div>' +
        '<span class="badge badge-success">● LIVE</span>' +
      '</div>';
    });
  }
  html += '</div></div>';

  return AppShell({session:ctx.session, activePath:"#/app/dashboard", title:"Dashboard", childrenHtml:html});
}

// --- Teacher Dashboard (Start QR) ---
function TeacherDashboard(ctx){
  var today = dayOfWeek(new Date());
  var slots = state.timetable.filter(function(t){ return t.teacherId===ctx.session.linkedId && t.day===today; });
  
  var html = '<div class="card"><div class="card-header"><h3>Today\'s Classes</h3></div><div class="card-body">';
  if(slots.length === 0) html += '<p class="muted">No classes today.</p>';
  
  slots.forEach(function(t){
    var course = state.courses.find(function(c){return c.id===t.courseId;});
    html += '<div class="row between" style="padding:16px;border:1px solid var(--border);border-radius:12px;margin-bottom:12px">' +
      '<div><strong>'+esc(course.name)+'</strong><div class="muted">'+esc(t.startTime)+' - '+esc(t.endTime)+'</div></div>' +
      '<button class="btn btn-primary btn-sm" data-start="'+t.id+'">Start QR</button>' +
    '</div>';
  });
  html += '</div></div>';

  return AppShell({
    session: ctx.session, activePath: "#/app/dashboard", title: "My Classes", childrenHtml: html,
    onMount: function(root){
      $$("[data-start]", root).forEach(function(b){
        b.onclick = function(){
          var actualTime = prompt("Enter actual start time (HH:MM), e.g. 09:15:");
          if(!actualTime) return;
          try {
            var sess = M.startQrSession(ctx.session, { timetableId: b.dataset.start, actualStartTime: actualTime });
            alert("QR Started! Token: " + sess.qrToken);
            renderRoute(); // Refresh
          } catch(e){ alert(e.message); }
        };
      });
    }
  });
}

// --- Router ---
var routes = [
  { path: "#/login", page: LoginPage },
  { path: "#/app/dashboard", page: function(ctx){
      if(ctx.session.role === "chairman") return ChairmanDashboard(ctx);
      if(ctx.session.role === "teacher") return TeacherDashboard(ctx);
      return ChairmanDashboard(ctx);
  }}
];

function findRoute(path){
  for(var i=0;i<routes.length;i++){
    if(routes[i].path === path) return routes[i];
  }
  return null;
}

function renderRoute(){
  var path = location.hash || "#/login";
  var session = state.session;
  
  if(path !== "#/login" && !session){ location.hash = "#/login"; return; }
  if(path === "#/login" && session){ location.hash = "#/app/dashboard"; return; }
  
  var route = findRoute(path);
  if(!route){ document.getElementById("app-root").innerHTML = "Page Not Found"; return; }

  var page = route.page({ session: session, params: {} });
  var root = document.getElementById("app-root");
  root.innerHTML = page.html;
  if(page.mount) page.mount(root);
}

// --- Init ---
if(!state.teachers || state.teachers.length===0){
  // Dummy Data for Testing
  state.teachers = [{id:"tch_1", name:"Engr. Ahmed"}, {id:"tch_2", name:"Engr. Bilal"}];
  state.students = [{id:"stu_1", name:"Student 1"}];
  state.courses = [{id:"crs_1", name:"Math"}];
  state.timetable = [{id:"tt_1", teacherId:"tch_1", courseId:"crs_1", day:dayOfWeek(new Date()), startTime:"09:00", endTime:"10:00", className:"Room 1", semesterId:"s1", sectionId:"sec1"}];
  G.saveState();
}

window.addEventListener("hashchange", renderRoute);
if(!location.hash) location.hash = "#/login";
renderRoute();
})();
</script>
