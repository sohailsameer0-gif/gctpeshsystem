<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');
:root{--brand-900:#081a33;--brand-800:#0f2b52;--brand-700:#153a6e;--brand-600:#1b4d92;--brand-500:#2764b8;--brand-400:#4a89e0;--accent-600:#0a7a78;--accent-500:#0e9594;--accent-400:#22c1c3;--accent-300:#5fdedf;--success:#10a469;--success-lt:#d1fae5;--warning:#d97706;--warning-lt:#fef3c7;--danger:#dc2626;--danger-lt:#fee2e2;--info:#2563eb;--info-lt:#dbeafe;--gold:#c9a227;--gold-lt:#fef9e7;--gray-50:#f6f8fc;--gray-100:#eef2f8;--gray-200:#dde5ef;--gray-300:#c5d0e0;--gray-400:#9aa8bf;--gray-500:#6b7a94;--gray-600:#4a5a75;--gray-700:#344158;--gray-800:#1f2a3d;--gray-900:#0d1524;--whatsapp:#25D366;--whatsapp-dark:#128C7E;--radius-sm:8px;--radius:12px;--radius-lg:18px;--radius-xl:24px;--shadow-xs:0 1px 2px rgba(15,23,42,.05);--shadow-sm:0 2px 6px rgba(15,23,42,.06);--shadow:0 6px 18px rgba(15,23,42,.08);--shadow-md:0 12px 28px rgba(15,23,42,.10);--shadow-lg:0 20px 48px rgba(15,23,42,.14);--shadow-glow:0 0 0 4px rgba(39,100,184,.12);--font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--font-display:'Sora','Inter',system-ui,sans-serif;--ease:cubic-bezier(.4,0,.2,1);}
#app-root,#app-root *,#toast-root,#toast-root *,#modal-root,#modal-root *{box-sizing:border-box;margin:0;padding:0}
#app-root{font-family:var(--font);background:var(--gray-50);color:var(--gray-800);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;background-image:radial-gradient(circle at 10% 10%,rgba(39,100,184,.06),transparent 40%),radial-gradient(circle at 90% 90%,rgba(14,149,148,.05),transparent 45%);background-attachment:fixed}
#app-root a{color:var(--brand-600);text-decoration:none;transition:color .2s var(--ease)}
#app-root a:hover{color:var(--brand-500)}
#app-root button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
#app-root input,#app-root select,#app-root textarea{font-family:inherit;font-size:14px}
#app-root img{max-width:100%;display:block}
#app-root svg{display:block;flex-shrink:0}
.app-shell{display:grid;grid-template-columns:264px 1fr;min-height:100vh;background:var(--gray-50)}
.app-sidebar{background:linear-gradient(180deg,#081a33 0%,#0f2b52 60%,#0a3564 100%);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;box-shadow:4px 0 24px rgba(0,0,0,.08);z-index:30}
.app-sidebar::-webkit-scrollbar{width:5px}
.app-sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:10px}
.app-sidebar::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.3)}
.app-main{display:flex;flex-direction:column;min-width:0}
.app-topbar{background:rgba(255,255,255,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--gray-200);display:flex;align-items:center;gap:14px;padding:12px 22px;position:sticky;top:0;z-index:20;box-shadow:0 1px 12px rgba(15,23,42,.04)}
.app-content{padding:22px;flex:1;animation:fadeIn .35s var(--ease)}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.brand{padding:20px 18px;display:flex;gap:12px;align-items:center;border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0}
.brand-logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--accent-500),var(--accent-400));display:grid;place-items:center;font-family:var(--font-display);font-weight:800;color:#fff;font-size:14px;letter-spacing:.5px;box-shadow:0 4px 14px rgba(14,149,148,.35)}
.brand-text{display:flex;flex-direction:column;line-height:1.15}
.brand-text strong{font-family:var(--font-display);font-size:14px;letter-spacing:.2px;font-weight:700}
.brand-text span{font-size:11px;opacity:.72;letter-spacing:.3px}
.nav{padding:14px 10px;flex:1}
.nav-group{margin-bottom:14px}
.nav-group-title{font-size:10px;text-transform:uppercase;letter-spacing:1.4px;opacity:.48;padding:8px 14px 6px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:10px;color:rgba(255,255,255,.78);font-size:13px;cursor:pointer;margin-bottom:3px;transition:background .2s var(--ease),color .2s var(--ease);position:relative;font-weight:500}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{background:linear-gradient(90deg,rgba(34,193,195,.22),rgba(34,193,195,.06));color:#fff;font-weight:600;box-shadow:inset 3px 0 0 var(--accent-400)}
.nav-icon{width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;opacity:.85;flex-shrink:0}
.nav-item.active .nav-icon{opacity:1;color:var(--accent-300)}
.nav-badge{margin-left:auto;background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;min-width:20px;text-align:center;box-shadow:0 2px 6px rgba(220,38,38,.4);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}
.nav-footer{padding:14px 18px;font-size:11px;opacity:.55;border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:8px;letter-spacing:.3px;flex-shrink:0}
.topbar-title{font-family:var(--font-display);font-weight:700;font-size:16px;flex:1;color:var(--gray-800);letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-actions{display:flex;align-items:center;gap:10px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--gray-100);color:var(--gray-600);position:relative;cursor:pointer;transition:all .2s var(--ease);border:1px solid transparent}
.icon-btn:hover{background:#fff;color:var(--brand-600);border-color:var(--gray-200);box-shadow:var(--shadow-sm);transform:translateY(-1px)}
.icon-badge{position:absolute;top:-2px;right:-2px;background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:10px;min-width:18px;text-align:center;box-shadow:0 2px 6px rgba(220,38,38,.45);border:2px solid #fff}
.user-chip{display:flex;align-items:center;gap:10px;padding:5px 12px 5px 5px;border-radius:24px;background:var(--gray-100);cursor:pointer;transition:all .2s var(--ease);border:1px solid transparent}
.user-chip:hover{background:#fff;border-color:var(--gray-200);box-shadow:var(--shadow-sm)}
.user-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--brand-600),var(--brand-500));color:#fff;display:grid;place-items:center;font-weight:600;font-size:13px;overflow:hidden;box-shadow:0 2px 8px rgba(39,100,184,.3)}
.user-avatar img{width:100%;height:100%;object-fit:cover}
.user-meta{display:flex;flex-direction:column;line-height:1.15}
.user-meta strong{font-size:12px;font-weight:600}
.user-meta span{font-size:10px;color:var(--gray-500);letter-spacing:.2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:10px;font-size:13px;font-weight:600;transition:all .2s var(--ease);border:1px solid transparent;white-space:nowrap;letter-spacing:.1px;text-decoration:none}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn:active:not(:disabled){transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--brand-600),var(--brand-500));color:#fff;box-shadow:0 3px 10px rgba(27,77,146,.28)}
.btn-primary:hover:not(:disabled){box-shadow:0 6px 18px rgba(27,77,146,.35);transform:translateY(-1px)}
.btn-accent{background:linear-gradient(135deg,var(--accent-500),var(--accent-400));color:#fff;box-shadow:0 3px 10px rgba(14,149,148,.28)}
.btn-ghost{background:#fff;color:var(--gray-700);border-color:var(--gray-200)}
.btn-ghost:hover{background:var(--gray-50);border-color:var(--gray-300)}
.btn-danger{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;box-shadow:0 3px 10px rgba(220,38,38,.25)}
.btn-success{background:linear-gradient(135deg,#10a469,#059669);color:#fff;box-shadow:0 3px 10px rgba(16,164,105,.25)}
.btn-warn{background:linear-gradient(135deg,#d97706,#b45309);color:#fff;box-shadow:0 3px 10px rgba(217,119,6,.25)}
.btn-whatsapp{background:linear-gradient(135deg,var(--whatsapp),var(--whatsapp-dark));color:#fff;box-shadow:0 3px 10px rgba(37,211,102,.3);text-decoration:none}
.btn-whatsapp:hover:not(:disabled){box-shadow:0 6px 18px rgba(37,211,102,.45);transform:translateY(-1px);color:#fff}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:8px}
.btn-xs{padding:4px 8px;font-size:11px;border-radius:6px}
.btn-block{width:100%}
.card{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius);box-shadow:var(--shadow-xs);transition:box-shadow .25s var(--ease);overflow:hidden}
.card:hover{box-shadow:var(--shadow-sm)}
.card-header{padding:15px 18px;border-bottom:1px solid var(--gray-200);display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,rgba(246,248,252,.6),transparent);flex-wrap:wrap}
.card-header h3{font-size:14px;font-weight:600;font-family:var(--font-display);letter-spacing:-.1px}
.card-body{padding:18px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.stat-card{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow-xs);transition:all .25s var(--ease);position:relative;overflow:hidden}
.stat-card::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,transparent,rgba(39,100,184,.03));opacity:0;transition:opacity .3s var(--ease)}
.stat-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--gray-300)}
.stat-card:hover::before{opacity:1}
.stat-card .label{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--gray-500);margin-bottom:8px;font-weight:600}
.stat-card .value{font-family:var(--font-display);font-size:26px;font-weight:700;color:var(--brand-800);letter-spacing:-.5px;line-height:1.1}
.stat-card .hint{font-size:11px;color:var(--gray-500);margin-top:5px}
.stat-card.warn .value{color:var(--warning)}
.stat-card.danger .value{color:var(--danger)}
.stat-card.success .value{color:var(--success)}
.stat-card.accent .value{color:var(--accent-500)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:600;color:var(--gray-700);letter-spacing:.1px}
.field .req{color:var(--danger)}
.field input,.field select,.field textarea{padding:10px 12px;border:1px solid var(--gray-300);border-radius:10px;background:#fff;transition:all .15s var(--ease);color:var(--gray-800);width:100%}
.field input:hover,.field select:hover,.field textarea:hover{border-color:var(--gray-400)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--brand-500);box-shadow:var(--shadow-glow)}
.field.error input,.field.error select{border-color:var(--danger);box-shadow:0 0 0 4px rgba(220,38,38,.1)}
.field .err-msg{font-size:11px;color:var(--danger);min-height:14px}
.field.full{grid-column:1/-1}
.table-wrap{overflow-x:auto;border:1px solid var(--gray-200);border-radius:var(--radius);background:#fff}
table.data{width:100%;border-collapse:collapse;font-size:13px}
table.data th{text-align:left;padding:12px 14px;background:linear-gradient(180deg,var(--gray-100),var(--gray-50));font-weight:600;color:var(--gray-600);font-size:11px;text-transform:uppercase;letter-spacing:.6px;white-space:nowrap;border-bottom:1px solid var(--gray-200)}
table.data td{padding:12px 14px;border-top:1px solid var(--gray-100);vertical-align:middle;color:var(--gray-700)}
table.data tbody tr{transition:background .15s var(--ease)}
table.data tbody tr:hover{background:var(--gray-50)}
table.data .empty{text-align:center;padding:40px;color:var(--gray-500);font-style:italic}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.2px}
.badge-success{background:var(--success-lt);color:#065f46}
.badge-warn{background:var(--warning-lt);color:#92400e}
.badge-danger{background:var(--danger-lt);color:#991b1b}
.badge-info{background:var(--info-lt);color:#1e40af}
.badge-gray{background:var(--gray-200);color:var(--gray-700)}
.badge-purple{background:#e9d5ff;color:#6b21a8}
.badge-gold{background:var(--gold-lt);color:#92400e;border:1px solid var(--gold)}
.modal-backdrop{position:fixed;inset:0;background:rgba(8,26,51,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;z-index:100;padding:16px;animation:fadeIn .2s var(--ease)}
.modal{background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);width:100%;max-width:640px;max-height:92vh;display:flex;flex-direction:column;animation:scaleIn .25s var(--ease);overflow:hidden}
.modal.modal-lg{max-width:960px}
.modal-header{padding:18px 22px;border-bottom:1px solid var(--gray-200);display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,rgba(246,248,252,.8),transparent)}
.modal-header h3{font-size:16px;flex:1;font-family:var(--font-display);font-weight:700;letter-spacing:-.2px}
.modal-body{padding:22px;overflow-y:auto}
.modal-footer{padding:16px 22px;border-top:1px solid var(--gray-200);display:flex;justify-content:flex-end;gap:10px;background:var(--gray-50)}
@keyframes scaleIn{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
#toast-root{position:fixed;top:18px;right:18px;z-index:200;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.toast{background:#fff;border-left:4px solid var(--info);border-radius:12px;padding:14px 18px;box-shadow:var(--shadow-md);min-width:280px;max-width:360px;animation:slideIn .25s var(--ease);border-top:1px solid var(--gray-100);border-right:1px solid var(--gray-100);border-bottom:1px solid var(--gray-100);pointer-events:auto}
.toast.success{border-left-color:var(--success)}
.toast.error{border-left-color:var(--danger)}
.toast.warn{border-left-color:var(--warning)}
.toast.whatsapp{border-left-color:var(--whatsapp)}
.toast strong{display:block;font-size:13px;margin-bottom:3px;font-weight:600}
.toast p{font-size:12px;color:var(--gray-600);line-height:1.4}
@keyframes slideIn{from{transform:translateX(30px);opacity:0}to{transform:translateX(0);opacity:1}}
.empty-state{padding:56px 24px;text-align:center;color:var(--gray-500)}
.empty-state h4{font-size:16px;color:var(--gray-700);margin-bottom:8px;font-family:var(--font-display);font-weight:700}
.empty-state p{font-size:13px}
.loader{display:inline-block;width:18px;height:18px;border:2.5px solid var(--gray-300);border-top-color:var(--brand-600);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.login-page{min-height:100vh;display:grid;grid-template-columns:1.15fr 1fr;background:#fff;position:relative}
@media (max-width:900px){.login-page{grid-template-columns:1fr}}
.login-left{background:linear-gradient(135deg,#081a33 0%,#1b4d92 55%,#0a7a78 100%);color:#fff;padding:0;display:flex;flex-direction:column;position:relative;overflow:hidden;min-height:100vh}
.login-left::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 30%,rgba(34,193,195,.25),transparent 45%),radial-gradient(circle at 80% 70%,rgba(74,137,224,.2),transparent 50%);pointer-events:none}
.login-left::after{content:"";position:absolute;top:-40%;right:-30%;width:700px;height:700px;border-radius:50%;background:radial-gradient(circle,rgba(34,193,195,.15),transparent 70%);animation:float 14s ease-in-out infinite;pointer-events:none}
.login-left .inner{padding:48px;position:relative;z-index:1;flex:1;display:flex;flex-direction:column;justify-content:space-between}
.login-lh{margin-bottom:24px;max-width:100%}
.login-lh img{width:100%;height:auto;display:block;background:#fff;border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.25)}
.login-left h1{font-family:var(--font-display);font-size:28px;line-height:1.25;margin-bottom:14px;font-weight:800;letter-spacing:-.5px}
.login-left .sub{opacity:.85;font-size:14px;max-width:480px;line-height:1.65;margin-bottom:28px}
.login-feature-list{list-style:none;display:flex;flex-direction:column;gap:12px;font-size:14px;opacity:.92;margin-bottom:32px}
.login-feature-list li{display:flex;align-items:flex-start;gap:12px}
.login-feature-list li::before{content:"✓";width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--accent-400),var(--accent-300));display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:#fff;font-weight:800;flex-shrink:0;box-shadow:0 2px 8px rgba(34,193,195,.4);margin-top:1px}
.login-left .copyright{font-size:11px;opacity:.6;letter-spacing:.3px}
.login-right{display:grid;place-items:center;padding:40px;background:linear-gradient(180deg,#fff,#f6f8fc);overflow-y:auto}
.login-card{width:100%;max-width:440px;background:#fff;border-radius:var(--radius-xl);box-shadow:var(--shadow-md);padding:36px 34px;border:1px solid var(--gray-100);animation:scaleIn .4s var(--ease)}
.login-card h2{font-family:var(--font-display);font-size:26px;margin-bottom:6px;letter-spacing:-.4px}
.login-card .sub{font-size:13px;color:var(--gray-500);margin-bottom:24px}
.login-tabs{display:flex;gap:6px;margin-bottom:22px;background:var(--gray-100);padding:5px;border-radius:12px}
.login-tabs button{flex:1;padding:10px;border-radius:8px;font-size:13px;font-weight:600;color:var(--gray-600);transition:all .2s var(--ease)}
.login-tabs button.active{background:#fff;color:var(--brand-700);box-shadow:var(--shadow-sm)}
.quick-login{margin-top:20px;padding:16px;background:linear-gradient(135deg,#eff6ff,#dbeafe);border:1px solid #bfdbfe;border-radius:12px}
.quick-login label{font-size:12px;font-weight:700;color:#1e40af;display:block;margin-bottom:8px;letter-spacing:.2px}
.quick-login select{width:100%;padding:10px 12px;border:1px solid #93c5fd;border-radius:10px;background:#fff;color:#1e3a8a;font-weight:600;cursor:pointer;transition:all .15s var(--ease)}
.quick-login select:focus{outline:none;border-color:#2563eb;box-shadow:0 0 0 4px rgba(37,99,235,.15)}
.quick-login .hint{margin-top:8px;font-size:11px;color:#1e40af;opacity:.8;line-height:1.5}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--gray-200);margin-bottom:18px;overflow-x:auto;padding-bottom:0}
.tabs button{padding:12px 16px;font-size:13px;font-weight:600;color:var(--gray-500);border-bottom:2px solid transparent;white-space:nowrap;transition:all .2s var(--ease);position:relative}
.tabs button:hover{color:var(--gray-700)}
.tabs button.active{color:var(--brand-700);border-bottom-color:var(--brand-600)}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.row.between{justify-content:space-between}
.muted{color:var(--gray-500);font-size:12px}
.mt-1{margin-top:8px}.mt-2{margin-top:16px}.mt-3{margin-top:24px}
.mb-1{margin-bottom:8px}.mb-2{margin-bottom:16px}.mb-3{margin-bottom:24px}
.text-right{text-align:right}
.hidden{display:none!important}
.profile-photo{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--brand-600),var(--brand-500));color:#fff;display:grid;place-items:center;font-size:28px;font-weight:700;overflow:hidden;flex-shrink:0;box-shadow:0 6px 20px rgba(27,77,146,.25);border:3px solid #fff}
.profile-photo img{width:100%;height:100%;object-fit:cover}
.notif-item{cursor:pointer;transition:all .2s var(--ease)}
.notif-item:hover{background:var(--gray-50);transform:translateX(3px)}
.notif-item.unread{border-left:4px solid var(--brand-500);background:linear-gradient(90deg,rgba(39,100,184,.04),transparent)}
.slot-live{background:linear-gradient(90deg,rgba(16,164,105,.12),rgba(16,164,105,.04))!important;box-shadow:inset 4px 0 0 var(--success)!important;animation:livePulse 2s ease-in-out infinite}
@keyframes livePulse{0%,100%{box-shadow:inset 4px 0 0 var(--success),0 0 0 0 rgba(16,164,105,.4)}50%{box-shadow:inset 4px 0 0 var(--success),0 0 0 8px rgba(16,164,105,0)}}
.slot-next{background:linear-gradient(90deg,rgba(217,119,6,.10),rgba(217,119,6,.03))!important;box-shadow:inset 4px 0 0 var(--warning)!important}
.slot-past{opacity:.55}
.live-badge{display:inline-flex;align-items:center;gap:5px;background:var(--success);color:#fff;padding:2px 9px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;box-shadow:0 2px 8px rgba(16,164,105,.5)}

/* ============ FINGERPRINT (anti-proxy) ============ */
var FP_KEY="gct_device_fp";
function getDeviceFingerprint(){
  var fp=null;try{fp=localStorage.getItem(FP_KEY);}catch(e){}
  if(!fp){
    var parts=[navigator.userAgent||"",navigator.language||"",screen.width+"x"+screen.height,String(new Date().getTimezoneOffset()),String(navigator.hardwareConcurrency||0),String(navigator.deviceMemory||0)];
    fp="fp_"+simpleHash(parts.join("|"))+"_"+Math.random().toString(36).slice(2,8);
    try{localStorage.setItem(FP_KEY,fp);}catch(e){}
  }
  return fp;
}
function simpleHash(s){var h=0;for(var i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0;}return Math.abs(h).toString(36);}

/* ============ EVENT BUS ============ */
var listeners=new Map();
var on=function(ev,h){if(!listeners.has(ev))listeners.set(ev,new Set());listeners.get(ev).add(h);return function(){listeners.get(ev).delete(h);};};
var emit=function(ev,p){(listeners.get(ev)||[]).forEach(function(h){try{h(p);}catch(e){console.error(e);}});};

/* ============ STATE ============ */
var initialState={
  session:null,settings:null,
  students:[],parents:[],parentLinks:[],
  teachers:[],staff:[],

};
var state=loadState();
function loadState(){
  try{
    var raw=localStorage.getItem(STORAGE_KEY);
    if(!raw)return Object.assign({},initialState);
    var p=JSON.parse(raw);
    return Object.assign({},initialState,p);
  }catch(e){return Object.assign({},initialState);}
}
function saveState(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){}}
function setState(partial,ev){Object.assign(state,partial);saveState();if(ev)emit(ev,state);emit("state:change",state);}
function updateColl(name,fn){var patch={};patch[name]=fn(state[name]||[]);setState(patch,name+":change");}

/* ============ AUDIT ============ */
function audit(o){
  var row={id:uid("log"),userId:o.userId||"system",role:o.role||"system",action:o.action,module:o.module,recordId:o.recordId||null,before:o.before||null,after:o.after||null,timestamp:nowIso()};
  updateColl("auditLogs",function(a){return a.concat([row]);});
}

/* ============ SETTINGS ============ */
function getSettings(){
  if(!state.settings){state.settings=Object.assign({},DEFAULT_SETTINGS,{id:"settings_singleton"});saveState();}
  return Object.assign({},DEFAULT_SETTINGS,state.settings);
}
function updateSettings(patch){state.settings=Object.assign({},getSettings(),patch);saveState();audit({userId:state.session?state.session.userId:null,role:state.session?state.session.role:null,action:"settings.update",module:"settings"});}

/* ============ NOTIFICATIONS ============ */
function pushNotification(o){
  var row={
    id:uid("ntf"),
    recipientId:o.recipientId||null,
    recipientRole:o.recipientRole||null,
    title:o.title,message:o.message,
    type:o.type||"info",
    senderId:o.senderId||null,senderRole:o.senderRole||"system",
    relatedRecordId:o.relatedRecordId||null,
    relatedModule:o.relatedModule||null,
    relatedRoute:o.relatedRoute||null,
    read:false,createdAt:nowIso()
  };
  updateColl("notifications",function(a){return a.concat([row]);});
  return row;
}
function notifsFor(userId,role,linkedId){
  return (state.notifications||[]).filter(function(n){
    return n.recipientId===userId||(linkedId&&n.recipientId===linkedId)||(n.recipientRole===role&&!n.recipientId);
  }).sort(function(a,b){return new Date(b.createdAt)-new Date(a.createdAt);});
}
function unreadCount(userId,role,module,linkedId){
  return notifsFor(userId,role,linkedId).filter(function(n){return !n.read&&(!module||n.relatedModule===module);}).length;
}
function markNotifRead(id){updateColl("notifications",function(a){return a.map(function(n){return n.id===id?Object.assign({},n,{read:true}):n;});});}
function markAllRead(userId,role,linkedId){var ids=new Set(notifsFor(userId,role,linkedId).map(function(n){return n.id;}));updateColl("notifications",function(a){return a.map(function(n){return ids.has(n.id)?Object.assign({},n,{read:true}):n;});});}

/* ============ NOTIFICATION ENGINE — central helper ============ */
function notifyRole(role,title,message,opts){
  opts=opts||{};
  pushNotification({
    recipientRole:role,
    title:title,message:message,
    type:opts.type||"info",
    senderId:opts.senderId||(state.session?state.session.userId:null),
    senderRole:opts.senderRole||(state.session?state.session.role:"system"),
    relatedRecordId:opts.relatedRecordId||null,
    relatedModule:opts.relatedModule||null,
    relatedRoute:opts.relatedRoute||null
  });
}
function notifyUser(userId,role,title,message,opts){

    recipientId:userId,recipientRole:role,

  coordinator:["dashboard.view","committees.manage","committees.view","committees.print","meetings.manage","parent-meetings.manage","notifications.view","profile.change","password.change","ptm.view","assignments.view"],

  student:["dashboard.view","profile.view.own","my-attendance.view","my-timetable.view","my-leave.submit","my-leave.view","my-academics.view","qr.scan","notifications.view","my-warnings.view","profile.change","password.change","assignments.submit","assignments.view"],

};
function can(role,perm){
  if(!role)return false;
  var list=PERMS[role]||[];
  return list.indexOf("*")>=0||list.indexOf(perm)>=0;
}
function requirePermission(session,perm){
  if(!session)throw new Error("Not authenticated");
  if(!can(session.role,perm))throw new Error("Permission denied: "+perm);
}
function canEdit(role){return can(role,"students.update")||can(role,"committees.manage")||can(role,"timetable.manage")||role==="chairman";}
function isFullAccess(session){
  return !!session&&session.role==="chairman";
}
function isReadOnly(session){
  return false;
}
function blockIfReadOnly(session){
  if(isReadOnly(session))throw new Error("You have Read-Only access — cannot modify.");
}

  {email:"parent@gct.edu.pk",password:"parent",role:"parent",displayName:"Demo Parent",status:"Approved",linkedId:"__PARENT_1__"}
];
function makeDemoAccounts(){
  var t1=state.teachers[0],t2=state.teachers[1];
  var s1=state.students[0],s2=state.students[1],s3=state.students[2];
  var p1=state.parents[0];
  var customAccounts=state.accounts||[];
  return DEFAULT_ACCOUNTS.filter(function(a){return !customAccounts.some(function(x){return x.email.toLowerCase()===a.email.toLowerCase();});}).map(function(a){
    var linked=a.linkedId;
    if(linked==="__TEACHER_1__")linked=t1?t1.id:null;
    if(linked==="__TEACHER_2__")linked=t2?t2.id:null;
    if(linked==="__STUDENT_1__")linked=s1?s1.id:null;
    if(linked==="__STUDENT_2__")linked=s2?s2.id:null;
    if(linked==="__STUDENT_3__")linked=s3?s3.id:null;
    if(linked==="__PARENT_1__")linked=p1?p1.id:null;
    return Object.assign({},a,{linkedId:linked});
  }).concat(customAccounts);
}
function registerAccount(data){
  var accs=makeDemoAccounts();
  if(accs.find(function(a){return a.email.toLowerCase()===data.email.toLowerCase();}))throw new Error("Email already registered");
  var row={id:uid("acc"),email:data.email.trim(),password:data.password,role:data.role,displayName:data.displayName||data.email,status:"Pending",photoDataUrl:data.photoDataUrl||"",requestedLinkedId:data.requestedLinkedId||null,linkedId:null,createdAt:nowIso(),deviceFingerprint:getDeviceFingerprint()};
  updateColl("accounts",function(a){return a.concat([row]);});
  notifyRole("chairman","New Registration Request",data.displayName+" ("+data.role+") wants to register.",{relatedRecordId:row.id,relatedModule:"registrations",relatedRoute:"#/app/registrations-admin"});
  audit({userId:"system",role:"system",action:"account.register",module:"accounts",recordId:row.id,after:row});
  return row;
}
function approveAccount(session,accountId,linkedIdOverride){
  if(session.role!=="chairman")throw new Error("Only Chairman can approve");
  var acc=null;for(var i=0;i<state.accounts.length;i++)if(state.accounts[i].id===accountId){acc=state.accounts[i];break;}
  if(!acc)throw new Error("Not found");
  var linkedId=linkedIdOverride||acc.requestedLinkedId||null;
  if(acc.role==="student"||acc.role==="parent"){
    if(!linkedId)throw new Error("Select a student record before approving this account");
    if(!state.students.some(function(student){return student.id===linkedId;}))throw new Error("Selected student not found");
  }
  if(acc.role==="teacher"&&!linkedId){
    var t={id:uid("tch"),name:acc.displayName,email:acc.email,active:true,createdAt:nowIso(),photoDataUrl:acc.photoDataUrl||""};

/* QR CODE GENERATOR (pure JS, version 1-10, ECC L)       */
/* ====================================================== */
var QR=(function(){

  function encode(text){
    var bytes=[];var str=new TextEncoder().encode(text);for(var i=0;i<str.length;i++)bytes.push(str[i]);
    var version=chooseVer(bytes.length);var size=17+version*4;
    var bits=[];
    var push=function(val,len){for(var i=len-1;i>=0;i--)bits.push((val>>i)&1);};

    for(var k2=0;k2<n2;k2++){blocks.push({data:dataCw.slice(idx,idx+d2),ecc:[]});idx+=d2;}

    var maxD=0;for(var bi2=0;bi2<blocks.length;bi2++)if(blocks[bi2].data.length>maxD)maxD=blocks[bi2].data.length;

    }catch(e){console.error("QR draw error",e);return false;}
  }

/* ====================================================== */
/* OFFLINE QUEUE (Blogger-safe)                          */
/* ====================================================== */
function getOfflineQueue(){
  try{var raw=localStorage.getItem(OFFLINE_QUEUE_KEY);return raw?JSON.parse(raw):[];}catch(e){return [];}
}
function saveOfflineQueue(q){try{localStorage.setItem(OFFLINE_QUEUE_KEY,JSON.stringify(q));}catch(e){}}
function enqueueOffline(item){
  var q=getOfflineQueue();item.id=uid("off");item.queuedAt=nowIso();q.push(item);saveOfflineQueue(q);return item;
}
function flushOfflineQueue(){
  var q=getOfflineQueue();
  if(!q.length)return 0;
  var remaining=[];var done=0;
  q.forEach(function(item){
    try{
      if(item.type==="qr_scan"){
        applyOfflineQrScan(item);
        done++;
      }else if(item.type==="punch_out"){
        applyOfflinePunchOut(item);
        done++;
      }else{remaining.push(item);}
    }catch(e){remaining.push(item);}
  });
  saveOfflineQueue(remaining);
  return done;
}
function applyOfflineQrScan(item){
  var session=item.sessionSnapshot;
  var rec={id:uid("rec"),sessionId:session.id,studentId:item.studentId,courseId:session.courseId,teacherId:session.teacherId,semesterId:session.semesterId,sectionId:session.sectionId,date:session.date,scheduledTime:session.scheduledStart,arrivalTime:item.arrivalTime,status:item.status,lateMinutes:item.lateMinutes,markedBy:item.studentId,markedAt:item.scannedAt,manual:false,offline:true};
  updateColl("attendanceRecords",function(a){
    if(a.find(function(r){return r.sessionId===session.id&&r.studentId===item.studentId;}))return a;
    return a.concat([rec]);
  });
}
function applyOfflinePunchOut(item){
  updateColl("attendanceRecords",function(a){
    return a.map(function(r){
      if(r.studentId===item.studentId&&r.date===item.date&&!r.exitTime){
        return Object.assign({},r,{exitTime:item.exitTime,exitRecordedAt:item.recordedAt,offline:true});
      }
      return r;
    });
  });
}
function isOnline(){return navigator.onLine!==false;}

/* ====================================================== */
/* ATTENDANCE SUMMARY                                    */
/* ====================================================== */
function attendanceSummary(studentId,courseId){
  var settings=getSettings();
  var recs=state.attendanceRecords.filter(function(r){return r.studentId===studentId&&(!courseId||r.courseId===courseId);});
  var present=recs.filter(function(r){return r.status===ATT.PRESENT;}).length;
  var late=recs.filter(function(r){return r.status===ATT.LATE;}).length;
  var absent=recs.filter(function(r){return r.status===ATT.ABSENT;}).length;
  var leave=recs.filter(function(r){return r.status===ATT.LEAVE;}).length;
  var totalLateMin=recs.filter(function(r){return r.status===ATT.LATE;}).reduce(function(s,r){return s+num(r.lateMinutes);},0);
  var total=present+late+absent+leave;
  var conv=Math.floor(late/(settings.lateToAbsenceThreshold||3));
  var raw=total===0?0:((present+leave)/total)*100;
  var adj=(total+conv)===0?0:((present+leave)/(total+conv))*100;
  return {total:total,present:present,late:late,absent:absent,leave:leave,totalLateMin:totalLateMin,converted:conv,rawPercentage:raw,adjustedPercentage:adj,isShortage:adj<(settings.shortageThreshold||70)};
}

/* ====================================================== */
/* APPLY APPROVED LEAVE                                  */
/* ====================================================== */
function applyApprovedLeave(leave){
  if(state.attendanceRecords.some(function(r){return r.leaveId===leave.id;}))return;
  var stu=null;for(var i=0;i<state.students.length;i++)if(state.students[i].id===leave.studentId){stu=state.students[i];break;}
  if(!stu)return;
  var slots=state.timetable.filter(function(t){return t.semesterId===stu.currentSemesterId&&t.sectionId===stu.currentSectionId;});
  var start=new Date(leave.startDate),end=new Date(leave.endDate);
  for(var d=new Date(start);d<=end;d.setDate(d.getDate()+1)){
    var day=dayOfWeek(d);var dateStr=d.toISOString().slice(0,10);
    slots.filter(function(s){return s.day===day;}).forEach(function(slot){
      var existing=state.attendanceRecords.find(function(r){return r.studentId===stu.id&&r.date===dateStr&&r.courseId===slot.courseId&&!r.leaveId;});
      if(existing){
        if(existing.status===ATT.ABSENT){
          updateColl("attendanceRecords",function(a){return a.map(function(r){return r.id===existing.id?Object.assign({},r,{status:ATT.LEAVE,leaveId:leave.id}):r;});});
        }
      }else{
        var row={id:uid("rec"),sessionId:"leave_"+leave.id,studentId:stu.id,courseId:slot.courseId,teacherId:slot.teacherId,semesterId:stu.currentSemesterId,sectionId:stu.currentSectionId,date:dateStr,scheduledTime:slot.startTime,arrivalTime:null,status:ATT.LEAVE,lateMinutes:0,markedBy:"system",markedAt:nowIso(),leaveId:leave.id};
        updateColl("attendanceRecords",function(a){return a.concat([row]);});
      }
    });
  }
}

/* ====================================================== */
function todayKey(){return todayIso();}
function hasLateApprovalToday(studentId){
  return state.lateScanRequests.some(function(r){return r.studentId===studentId&&r.date===todayKey()&&r.status==="approved";});
}
function hasPendingLateRequest(studentId){
  return state.lateScanRequests.some(function(r){return r.studentId===studentId&&r.date===todayKey()&&r.status==="pending";});
}
function requestLateScanApproval(session,o){
  if(session.role!=="student")throw new Error("Only students");
  var studentId=session.linkedId;
  if(!studentId)throw new Error("Not linked");
  if(hasLateApprovalToday(studentId))throw new Error("Already approved for today");
  if(hasPendingLateRequest(studentId))throw new Error("Request already pending");
  var stu=null;for(var i=0;i<state.students.length;i++)if(state.students[i].id===studentId){stu=state.students[i];break;}
  var row={
    id:uid("lsr"),studentId:studentId,studentName:stu?stu.name:"",
    date:todayKey(),reason:o.reason||"",
    requestedAt:nowIso(),status:"pending",
    decidedAt:null,decidedBy:null,remarks:""
  };
  updateColl("lateScanRequests",function(a){return a.concat([row]);});
  notifyRole("chairman","Late Scan Request",(stu?stu.name:"Student")+" requests permission to scan late today.",{type:"warn",relatedRecordId:row.id,relatedModule:"lateScanRequests",relatedRoute:"#/app/late-scan-requests"});
  audit({userId:session.userId,role:session.role,action:"latescan.request",module:"lateScanRequests",recordId:row.id});
  return row;
}
function decideLateScan(session,requestId,decision,remarks){
  if(session.role!=="chairman")throw new Error("Only Chairman");
  var row=null;for(var i=0;i<state.lateScanRequests.length;i++)if(state.lateScanRequests[i].id===requestId){row=state.lateScanRequests[i];break;}
  if(!row)throw new Error("Request not found");
  updateColl("lateScanRequests",function(a){return a.map(function(r){return r.id===requestId?Object.assign({},r,{status:decision,decidedAt:nowIso(),decidedBy:session.userId,remarks:remarks||""}):r;});});
  notifyUser(row.studentId,"student","Late Scan "+(decision==="approved"?"Approved":"Rejected"),decision==="approved"?"You can now scan QR for the rest of today.":(remarks||"Your request was rejected."),{type:decision==="approved"?"success":"error",relatedModule:"lateScanRequests",relatedRoute:"#/app/scan-qr"});
  audit({userId:session.userId,role:session.role,action:"latescan."+decision,module:"lateScanRequests",recordId:requestId});
}
function isQrEnabled(){return getSettings().qrAttendanceEnabled!==false;}

/* ====================================================== */
/* ATTENDANCE SESSION + QR SCAN (with offline + kill-switch) */
/* ====================================================== */
function secureToken(){
  var bytes=new Uint8Array(12);
  try{(window.crypto||window.msCrypto).getRandomValues(bytes);}catch(e){for(var i=0;i<bytes.length;i++)bytes[i]=Math.floor(Math.random()*256);}
  var arr=[];for(var i=0;i<bytes.length;i++)arr.push(bytes[i].toString(16).padStart(2,"0"));
  return "qr_"+arr.join("");
}
function createSession(session,data){
  requirePermission(session,"attendance.mark");
  if(!isQrEnabled())throw new Error("QR attendance is disabled by Chairman");
  var slot=null;for(var i=0;i<state.timetable.length;i++)if(state.timetable[i].id===data.timetableId){slot=state.timetable[i];break;}
  if(!slot)throw new Error("Slot not found");
  var row={
    id:uid("att"),timetableId:slot.id,teacherId:data.teacherId,
    courseId:slot.courseId,semesterId:slot.semesterId,sectionId:slot.sectionId,
    date:data.date||todayIso(),scheduledStart:slot.startTime,scheduledEnd:slot.endTime,
    actualStart:nowIso(),actualEnd:null,
    qrToken:data.qrToken||null,qrExpiresAt:data.qrExpiresAt||null,
    status:"open",locked:false
  };
  updateColl("attendanceSessions",function(a){return a.concat([row]);});
  audit({userId:session.userId,role:session.role,action:"session.open",module:"attendanceSessions",recordId:row.id});
  return row;
}
function closeSession(session,id){updateColl("attendanceSessions",function(a){return a.map(function(s){return s.id===id?Object.assign({},s,{status:"closed",actualEnd:nowIso()}):s;});});}
function lockSession(session,id,locked){
  if(session.role!=="chairman")throw new Error("Only Chairman can lock/unlock");
  updateColl("attendanceSessions",function(a){return a.map(function(s){return s.id===id?Object.assign({},s,{locked:!!locked,lockedAt:nowIso(),lockedBy:session.userId}):s;});});
  audit({userId:session.userId,role:session.role,action:locked?"session.lock":"session.unlock",module:"attendanceSessions",recordId:id});
}
function rotateQr(session,sessionId){
  var s=getSettings();var ttl=(s.qrValiditySeconds||45)*1000;
  updateColl("attendanceSessions",function(a){return a.map(function(x){return x.id===sessionId?Object.assign({},x,{qrToken:secureToken(),qrExpiresAt:new Date(Date.now()+ttl).toISOString()}):x;});});
}
function startQrSession(session,o){
  var s=getSettings();var ttl=(s.qrValiditySeconds||45)*1000;
  return createSession(session,{timetableId:o.timetableId,teacherId:o.teacherId,qrToken:secureToken(),qrExpiresAt:new Date(Date.now()+ttl).toISOString()});
}
function findSessionByToken(token){for(var i=0;i<state.attendanceSessions.length;i++)if(state.attendanceSessions[i].qrToken===token)return state.attendanceSessions[i];return null;}
function scanQr(session,o){
  if(!o.token)throw new Error("Invalid QR");
  if(session.role==="student"&&session.linkedId!==o.studentId)throw new Error("You can only mark your own attendance");
  /* Device fingerprint check */
  if(session.role==="student"){
    var fp=getDeviceFingerprint();
    var bindKey=DEVICE_BIND_KEY+"_"+o.studentId;
    var bound=null;try{bound=localStorage.getItem(bindKey);}catch(e){}
    if(bound&&bound!==fp)throw new Error("This device is not registered for this student. Contact office.");
  }
  /* Kill switch */
  if(!isQrEnabled())throw new Error("QR attendance is disabled by Chairman. You are late — submit written application to Chairman.");
  var att=findSessionByToken(o.token);
  /* If offline, queue it */
  if(!att&&!isOnline()){
    enqueueOffline({type:"qr_scan",studentId:o.studentId,scannedAt:nowIso(),sessionSnapshot:o.sessionSnapshot||{id:"offline_"+Date.now(),courseId:o.courseId,teacherId:o.teacherId,semesterId:o.semesterId,sectionId:o.sectionId,date:todayIso(),scheduledStart:o.scheduledStart||"09:00"},arrivalTime:new Date().toTimeString().slice(0,5),status:ATT.PRESENT,lateMinutes:0});
    return {offline:true};
  }
  if(!att)throw new Error("QR not recognized");
  if(att.status!=="open")throw new Error("Session closed");
  if(att.locked)throw new Error("This session is locked by Chairman. Submit written application.");
  if(new Date(att.qrExpiresAt)<new Date())throw new Error("QR expired. Ask teacher to rotate.");
  var stu=null;for(var j=0;j<state.students.length;j++)if(state.students[j].id===o.studentId){stu=state.students[j];break;}
  if(!stu)throw new Error("Student not found");
  if(stu.status!=="Active")throw new Error("Student not active");
  if(stu.currentSemesterId!==att.semesterId)throw new Error("Wrong semester");
  if(stu.currentSectionId!==att.sectionId)throw new Error("Wrong section");
  var enrolled=state.courseAssignments.some(function(a){return a.courseId===att.courseId&&a.semesterId===att.semesterId&&a.sectionId===att.sectionId;});
  if(!enrolled)throw new Error("Not enrolled in this course");
  if(state.attendanceRecords.find(function(r){return r.sessionId===att.id&&r.studentId===o.studentId;}))throw new Error("Already marked");
  var now=new Date();
  var arrival=now.toTimeString().slice(0,5);
  var diff=Math.max(0,t2m(arrival)-t2m(att.scheduledStart));
  var status=diff>0?ATT.LATE:ATT.PRESENT;
  /* Late-scan permission */
  if(status===ATT.LATE&&!hasLateApprovalToday(o.studentId)){
    throw new Error("You are late. Submit written application to Chairman to enable late scanning for today.");
  }
  var rec={
    id:uid("rec"),sessionId:att.id,studentId:o.studentId,courseId:att.courseId,teacherId:att.teacherId,
    semesterId:att.semesterId,sectionId:att.sectionId,date:att.date,scheduledTime:att.scheduledStart,
    arrivalTime:arrival,status:status,lateMinutes:diff,markedBy:session.userId,markedAt:nowIso(),manual:false
  };
  updateColl("attendanceRecords",function(a){return a.concat([rec]);});
  audit({userId:session.userId,role:session.role,action:"qr.scan",module:"attendanceRecords",recordId:rec.id});
  return rec;
}
function qrPunchOut(session,o){
  if(session.role==="student"&&session.linkedId!==o.studentId)throw new Error("You can only mark your own exit");
  var fp=getDeviceFingerprint();
  var bindKey=DEVICE_BIND_KEY+"_"+o.studentId;
  var bound=null;try{bound=localStorage.getItem(bindKey);}catch(e){}
  if(bound&&bound!==fp)throw new Error("This device is not registered for this student.");
  var today=todayIso();
  var recs=state.attendanceRecords.filter(function(r){return r.studentId===o.studentId&&r.date===today;}).sort(function(a,b){return new Date(b.markedAt)-new Date(a.markedAt);});
  if(!recs.length)throw new Error("No punch-in found for today");
  var latest=recs[0];
  if(latest.exitTime)throw new Error("Already punched out");
  updateColl("attendanceRecords",function(a){return a.map(function(r){return r.id===latest.id?Object.assign({},r,{exitTime:new Date().toTimeString().slice(0,5),exitRecordedAt:nowIso()}):r;});});
  var exitRow={id:uid("ex"),studentId:o.studentId,date:today,entryTime:latest.arrivalTime||"",exitTime:new Date().toTimeString().slice(0,5),reason:"QR punch-out",recordedBy:"system",auto:true};
  updateColl("exitRecords",function(a){return a.concat([exitRow]);});
  audit({userId:session.userId,role:session.role,action:"qr.punchout",module:"attendanceRecords",recordId:latest.id});
  return latest;
}
function manualAttendance(session,o){

  updateColl("attendanceRecords",function(a){return a.concat([row]);});

  return row;

function validateStudent(d,opts){
  opts=opts||{};var currentId=opts.currentId||null;var e={};
  var req=function(k,m){if(!String(d[k]||"").trim())e[k]=m||"Required";};
  req("name","Student name required");
  req("fatherName","Father name required");
  req("admissionNumber","Admission # required");
  req("registrationNumber","Reg # required");
  req("classNumber","Class # required");
  req("studentMobile","Mobile required");
  if(d.studentMobile&&!/^03\d{9}$/.test(d.studentMobile))e.studentMobile="11 digits starting 03";
  if(d.fatherMobile&&!/^03\d{9}$/.test(String(d.fatherMobile).trim()))e.fatherMobile="11 digits starting 03";
  if(!d.currentSemesterId)e.currentSemesterId="Semester required";
  if(!d.currentSectionId)e.currentSectionId="Section required";
  if(state.students.find(function(s){return s.admissionNumber===d.admissionNumber&&s.id!==currentId;}))e.admissionNumber="Admission # exists";
  if(state.students.find(function(s){return s.registrationNumber===d.registrationNumber&&s.id!==currentId;}))e.registrationNumber="Reg # exists";
  if(state.students.find(function(s){return s.classNumber===d.classNumber&&s.id!==currentId;}))e.classNumber="Class # exists";
  return e;
}
function createStudent(session,data){
  requirePermission(session,"students.create");blockIfReadOnly(session);
  var errs=validateStudent(data);if(Object.keys(errs).length)throw {validation:errs};
  var row=Object.assign({id:uid("stu"),createdAt:nowIso()},data);
  updateColl("students",function(a){return a.concat([row]);});
  audit({userId:session.userId,role:session.role,action:"student.create",module:"students",recordId:row.id,after:row});
  notifyRole("clerk","New Student Added",data.name+" ("+data.admissionNumber+") added by "+session.displayName,{relatedModule:"students",relatedRoute:"#/app/students"});
  notifyRole("coordinator","New Student Added",data.name+" added to the department.",{relatedModule:"students",relatedRoute:"#/app/students"});
  return row;
}
function updateStudent(session,id,data){

function deleteStudent(session,id){

  updateColl("students",function(a){return a.filter(function(s){return s.id!==id;});});
  audit({userId:session.userId,role:session.role,action:"student.delete",module:"students",recordId:id,before:before});
  notifyRole("chairman","Student Deleted",session.displayName+" deleted "+(before?before.name:"")+"'s record.",{relatedModule:"students",relatedRoute:"#/app/students"});

function searchStudents(f){
  f=f||{};var q=(f.text||"").toLowerCase().trim();
  return state.students.filter(function(s){
    if(q){
      var h=[s.name,s.fatherName,s.registrationNumber,s.admissionNumber,s.classNumber,s.studentMobile,s.fatherMobile].map(function(x){return String(x||"").toLowerCase();}).join(" ");
      if(h.indexOf(q)<0)return false;
    }
    if(f.semesterId&&s.currentSemesterId!==f.semesterId)return false;
    if(f.sectionId&&s.currentSectionId!==f.sectionId)return false;
    if(f.status&&s.status!==f.status)return false;
    return true;
  });
}
function searchStudentsScoped(session,f){
  var base=searchStudents(f);
  if(session.role!=="teacher")return base;
  if(!session.linkedId)return [];
  var assigns=state.courseAssignments.filter(function(a){return a.teacherId===session.linkedId;});
  if(!assigns.length)return [];
  var pairs={};assigns.forEach(function(a){pairs[a.semesterId+"|"+a.sectionId]=true;});
  return base.filter(function(s){return pairs[s.currentSemesterId+"|"+s.currentSectionId];});
}

function createCourse(session,data){
  if(!can(session.role,"courses.create"))throw new Error("Permission denied");
  blockIfReadOnly(session);
  var code=String(data.code||"").trim(),name=String(data.name||"").trim();
  var e={};
  if(!code)e.code="Code required";
  if(!name)e.name="Name required";
  if(!data.semesterId)e.semesterId="Semester required";
  if(!data.creditHours||!isFinite(num(data.creditHours))||num(data.creditHours)<1||num(data.creditHours)>6)e.creditHours="1-6 credit hours";
  if(state.courses.find(function(c){return String(c.code||"").trim().toLowerCase()===code.toLowerCase();}))e.code="Code exists";
  if(Object.keys(e).length)throw {validation:e};
  var row=Object.assign({id:uid("crs"),createdAt:nowIso()},data,{code:code,name:name,creditHours:num(data.creditHours),status:data.status||"Active"});
  updateColl("courses",function(a){return a.concat([row]);});
  audit({userId:session.userId,role:session.role,action:"course.create",module:"courses",recordId:row.id,after:row});
  notifyRole("coordinator","New Course Added",data.code+" — "+data.name+" added by "+session.displayName,{relatedModule:"courses",relatedRoute:"#/app/courses"});
  /* Notify teachers assigned to that semester */
  state.courseAssignments.filter(function(a){return a.semesterId===data.semesterId;}).forEach(function(a){
    if(a.teacherId)notifyUser(a.teacherId,"teacher","New Course in Your Semester",data.code+" — "+data.name,{relatedModule:"courses",relatedRoute:"#/app/courses"});
  });
  return row;
}
function updateCourse(session,id,patch){
  if(!can(session.role,"courses.create"))throw new Error("Permission denied");
  blockIfReadOnly(session);
  var current=state.courses.find(function(c){return c.id===id;});
  if(!current)throw new Error("Course not found");
  var next=Object.assign({},current,patch);
  next.code=String(next.code||"").trim();
  next.name=String(next.name||"").trim();
  var e={};
  if(!next.code)e.code="Code required";
  if(!next.name)e.name="Name required";
  if(!next.semesterId)e.semesterId="Semester required";
  if(!next.creditHours||!isFinite(num(next.creditHours))||num(next.creditHours)<1||num(next.creditHours)>6)e.creditHours="1-6 credit hours";
  if(state.courses.some(function(c){return c.id!==id&&String(c.code||"").trim().toLowerCase()===next.code.toLowerCase();}))e.code="Code exists";
  if(Object.keys(e).length)throw {validation:e};
  next.creditHours=num(next.creditHours);
  updateColl("courses",function(a){return a.map(function(c){return c.id===id?Object.assign({},next,{updatedAt:nowIso()}):c;});});
  audit({userId:session.userId,role:session.role,action:"course.update",module:"courses",recordId:id});
}
function deleteCourse(session,id){
  if(!can(session.role,"courses.create"))throw new Error("Permission denied");

function teacherTeachesCourse(teacherId,courseId){
  if(state.courseAssignments.some(function(a){return a.teacherId===teacherId&&a.courseId===courseId;}))return true;
  if(state.timetable.some(function(t){return t.teacherId===teacherId&&t.courseId===courseId;}))return true;
  return false;
}
function validateSlot(d,opts){
  opts=opts||{};var currentId=opts.currentId||null;var e={};
  if(!d.day)e.day="Day required";
  if(!d.startTime)e.startTime="Start required";
  if(!d.endTime)e.endTime="End required";
  if(!d.semesterId)e.semesterId="Semester required";
  if(!d.sectionId)e.sectionId="Section required";
  if(!d.slotType)e.slotType="Type required";
  if(!d.courseId)e.courseId="Course required";
  if(!d.teacherId)e.teacherId="Teacher required";
  if(d.startTime&&d.endTime&&t2m(d.startTime)>=t2m(d.endTime))e.endTime="End after start";
  if(d.teacherId&&d.courseId&&!teacherTeachesCourse(d.teacherId,d.courseId))e.courseId="This teacher does not teach this subject";
  var list=state.timetable.filter(function(t){return t.id!==currentId&&t.day===d.day;});
  for(var i=0;i<list.length;i++){
    var t=list[i];
    var s1=t2m(d.startTime),e1=t2m(d.endTime),s2=t2m(t.startTime),e2=t2m(t.endTime);
    if(s1<e2&&e1>s2){
      if(d.teacherId&&t.teacherId===d.teacherId)e.startTime="Teacher busy";
      else if(t.semesterId===d.semesterId&&t.sectionId===d.sectionId)e.startTime="Section busy";
    }

/* ====================================================== */
function submitStudentLeave(session,data){
  if(session.role!=="student")throw new Error("Only students");
  if(!session.linkedId)throw new Error("Not linked");
  data.reason=String(data.reason||"").trim();
  if(!data.reason)throw new Error("Leave reason is required");
  var start=new Date(data.startDate),end=new Date(data.endDate);
  if(start>end)throw new Error("Start before end");
  var days=Math.ceil((end-start)/86400000)+1;
  var stu=null;for(var i=0;i<state.students.length;i++)if(state.students[i].id===session.linkedId){stu=state.students[i];break;}
  var requestedDays={};
  for(var d=new Date(start);d<=end;d.setDate(d.getDate()+1)){requestedDays[dayOfWeek(d)]=true;}
  var relevantSlots=state.timetable.filter(function(t){return t.semesterId===stu.currentSemesterId&&t.sectionId===stu.currentSectionId&&requestedDays[t.day]&&t.teacherId;});
  var teacherIds={};relevantSlots.forEach(function(t){teacherIds[t.teacherId]=true;});
  var primaryTeacherId=null;
  for(var k in teacherIds){if(teacherIds[k]){primaryTeacherId=k;break;}}
  if(!primaryTeacherId){
    var assignment=state.courseAssignments.find(function(a){return a.semesterId===stu.currentSemesterId&&a.sectionId===stu.currentSectionId;});
    primaryTeacherId=assignment?assignment.teacherId:null;
  }
  var row={id:uid("lv"),studentId:session.linkedId,leaveType:data.leaveType,startDate:data.startDate,endDate:data.endDate,days:days,reason:data.reason,description:data.description||"",evidenceId:data.evidenceId||null,status:LEAVE_STATUS.WITH_TEACHER,currentOwnerRole:"teacher",currentOwnerId:primaryTeacherId,notifiedTeacherIds:Object.keys(teacherIds),teacherRemarks:"",chairmanRemarks:"",submittedAt:nowIso(),forwardedAt:null,decidedAt:null,timeline:[{at:nowIso(),action:"Submitted",by:session.userId,role:session.role,note:"Application submitted"}]};
  updateColl("leaveApplications",function(a){return a.concat([row]);});
  audit({userId:session.userId,role:session.role,action:"leave.submit",module:"leaveApplications",recordId:row.id});
  Object.keys(teacherIds).forEach(function(tid){
    notifyUser(tid,"teacher","New Leave Request",stu.name+" submitted a "+data.leaveType+" leave.",{relatedRecordId:row.id,relatedModule:"leaveApplications",relatedRoute:"#/app/leaves"});
  });
  if(primaryTeacherId)notifyUser(primaryTeacherId,"teacher","Leave Awaiting Your Forward",stu.name+"'s leave needs your review.",{type:"warn",relatedRecordId:row.id,relatedModule:"leaveApplications",relatedRoute:"#/app/leaves"});
  return row;
}
function teacherForward(session,leaveId,remarks){
  requirePermission(session,"leaves.forward");
  var lv=null;for(var i=0;i<state.leaveApplications.length;i++)if(state.leaveApplications[i].id===leaveId){lv=state.leaveApplications[i];break;}
  if(!lv)throw new Error("Leave not found");
  if(lv.status!==LEAVE_STATUS.WITH_TEACHER)throw new Error("Not with teacher");
  var timeline=(lv.timeline||[]).concat([{at:nowIso(),action:"Forwarded by Teacher",by:session.userId,role:session.role,note:remarks||"Forwarded to Chairman"}]);
  updateColl("leaveApplications",function(a){return a.map(function(l){return l.id===leaveId?Object.assign({},l,{status:LEAVE_STATUS.WITH_CHAIRMAN,currentOwnerRole:"chairman",currentOwnerId:null,teacherRemarks:remarks||"",forwardedAt:nowIso(),timeline:timeline}):l;});});
  audit({userId:session.userId,role:session.role,action:"leave.forward",module:"leaveApplications",recordId:leaveId});
  notifyRole("chairman","Leave Forwarded","A student leave needs your decision.",{relatedRecordId:leaveId,relatedModule:"leaveApplications",relatedRoute:"#/app/leaves"});
  notifyUser(lv.studentId,"student","Leave Update","Your leave has been forwarded to Chairman.",{relatedRecordId:leaveId,relatedModule:"leaveApplications",relatedRoute:"#/app/my-leave"});

function chairmanDecide(session,leaveId,decision,remarks){
  requirePermission(session,"leaves.decide");
  remarks=String(remarks||"").trim();
  if(!remarks)throw new Error("Decision reason is required");
  if(decision!=="approve"&&decision!=="reject")throw new Error("Invalid leave decision");
  var lv=null;for(var i=0;i<state.leaveApplications.length;i++)if(state.leaveApplications[i].id===leaveId){lv=state.leaveApplications[i];break;}
  if(!lv)throw new Error("Leave not found");
  if(lv.status!==LEAVE_STATUS.WITH_CHAIRMAN)throw new Error("Not with Chairman");
  var status=decision==="approve"?LEAVE_STATUS.APPROVED:LEAVE_STATUS.REJECTED;
  var timeline=(lv.timeline||[]).concat([{at:nowIso(),action:decision==="approve"?"Approved by Chairman":"Rejected by Chairman",by:session.userId,role:session.role,note:remarks||""}]);
  var after=Object.assign({},lv,{status:status,currentOwnerRole:null,currentOwnerId:null,chairmanRemarks:remarks||"",decidedAt:nowIso(),timeline:timeline});
  updateColl("leaveApplications",function(a){return a.map(function(l){return l.id===leaveId?after:l;});});
  if(decision==="approve")applyApprovedLeave(after);
  audit({userId:session.userId,role:session.role,action:"leave."+decision,module:"leaveApplications",recordId:leaveId});
  updateColl("approvals",function(a){return a.concat([{id:uid("apr"),type:"student_leave",refId:leaveId,studentId:lv.studentId,decision:decision,remarks:remarks||"",decidedBy:session.userId,decidedAt:nowIso()}]);});
  notifyUser(lv.studentId,"student","Leave "+(decision==="approve"?"Approved":"Rejected"),remarks||"",{type:decision==="approve"?"success":"error",relatedRecordId:leaveId,relatedModule:"leaveApplications",relatedRoute:"#/app/my-leave"});
  if(lv.currentOwnerId)notifyUser(lv.currentOwnerId,"teacher","Leave "+(decision==="approve"?"Approved":"Rejected"),"Chairman has decided.",{type:decision==="approve"?"success":"error",relatedRecordId:leaveId,relatedModule:"leaveApplications",relatedRoute:"#/app/leaves"});
}

function findCommitteeMemberDupe(committeeId,name,designation,excludeId){
  var n=String(name||"").trim().toLowerCase();
  var d=String(designation||"").trim().toLowerCase();
  return state.committeeMembers.some(function(m){
    if(m.committeeId!==committeeId)return false;
    if(m.status!=="Active")return false;
    if(excludeId&&m.id===excludeId)return false;
    return String(m.memberName||"").trim().toLowerCase()===n&&String(m.designation||"").trim().toLowerCase()===d;
  });
}
function createCommittee(session,data){
  requirePermission(session,"committees.manage");blockIfReadOnly(session);
  var e={};
  if(!data.name||!data.name.trim())e.name="Committee name required";
  if(!data.formationDate)e.formationDate="Formation date required";
  if(Object.keys(e).length)throw {validation:e};
  var kind=data.committeeKind||"Standalone";
  var row=Object.assign({id:uid("cmt"),createdAt:nowIso()},data,{
    formationDate:data.formationDate||todayIso(),
    committeeType:data.committeeType||"Main",
    committeeKind:kind,
    status:data.status||"Active",
    description:data.description||"",
    parentCommitteeId:data.parentCommitteeId||null
  });
  row.committeeNumber=(state.committees.length+1);
  updateColl("committees",function(a){return a.concat([row]);});
  audit({userId:session.userId,role:session.role,action:"committee.create",module:"committees",recordId:row.id,after:row});

  /* If OBE, auto-create/link AT + PT */
  if(kind==="OBE"){
    var linkAT=data.linkATCommitteeId||null;
    var linkPT=data.linkPTCommitteeId||null;
    if(!linkAT){
      var at={id:uid("cmt"),name:"AT — "+(data.name||"OBE"),committeeKind:"AT",committeeType:"Sub",parentCommitteeId:row.id,formationDate:row.formationDate,status:"Active",description:"Academic Team sub-committee under OBE",createdAt:nowIso(),committeeNumber:state.committees.length+2};
      updateColl("committees",function(a){return a.concat([at]);});
      linkAT=at.id;
    }else{
      updateColl("committees",function(a){return a.map(function(c){return c.id===linkAT?Object.assign({},c,{parentCommitteeId:row.id,committeeKind:"AT"}):c;});});
    }
    if(!linkPT){
      var pt={id:uid("cmt"),name:"PT — "+(data.name||"OBE"),committeeKind:"PT",committeeType:"Sub",parentCommitteeId:row.id,formationDate:row.formationDate,status:"Active",description:"Parent Team sub-committee under OBE",createdAt:nowIso(),committeeNumber:state.committees.length+3};
      updateColl("committees",function(a){return a.concat([pt]);});
      linkPT=pt.id;
    }else{
      updateColl("committees",function(a){return a.map(function(c){return c.id===linkPT?Object.assign({},c,{parentCommitteeId:row.id,committeeKind:"PT"}):c;});});
    }
    updateColl("committees",function(a){return a.map(function(c){return c.id===row.id?Object.assign({},c,{atCommitteeId:linkAT,ptCommitteeId:linkPT}):c;});});
  }

  if(session.role!=="chairman"){
    notifyRole("chairman","New Committee Created",session.displayName+" created: "+data.name,{relatedRecordId:row.id,relatedModule:"committees",relatedRoute:"#/app/committees/"+row.id});
  }
  notifyRole("coordinator","New Committee Created",session.displayName+" created: "+data.name,{relatedRecordId:row.id,relatedModule:"committees",relatedRoute:"#/app/committees/"+row.id});
  return row;
}
function addCommitteeMember(session,data){
  requirePermission(session,"committees.manage");blockIfReadOnly(session);
  var cmt=null;for(var i=0;i<state.committees.length;i++)if(state.committees[i].id===data.committeeId){cmt=state.committees[i];break;}
  if(!cmt)throw new Error("Committee not found");
  var e={};
  if(!data.memberName||!data.memberName.trim())e.memberName="Member name required";
  if(!data.position)e.position="Committee position required";
  if(findCommitteeMemberDupe(data.committeeId,data.memberName,data.designation,null)){
    e.memberName="This member already exists in this committee (same name + designation).";
  }
  if(Object.keys(e).length)throw {validation:e};
  var existing=state.committeeMembers.filter(function(m){return m.committeeId===data.committeeId&&m.status==="Active";});
  var serial=existing.length+1;
  var row=Object.assign({id:uid("cmm")},data,{serialNo:serial,status:"Active",joinedAt:nowIso(),addedBy:session.userId,addedByName:session.displayName});
  updateColl("committeeMembers",function(a){return a.concat([row]);});
  audit({userId:session.userId,role:session.role,action:"committee.member.add",module:"committeeMembers",recordId:row.id,after:row});
  notifyRole("chairman","Committee Member Added",session.displayName+" added "+data.memberName+" to "+(cmt?cmt.name:""),{relatedModule:"committees",relatedRoute:"#/app/committees/"+data.committeeId});
  notifyRole("coordinator","Committee Member Added",session.displayName+" added "+data.memberName+" to "+(cmt?cmt.name:""),{relatedModule:"committees",relatedRoute:"#/app/committees/"+data.committeeId});
  return row;
}
function updateCommitteeMember(session,id,patch){
  requirePermission(session,"committees.manage");blockIfReadOnly(session);
  var current=null;for(var i=0;i<state.committeeMembers.length;i++)if(state.committeeMembers[i].id===id){current=state.committeeMembers[i];break;}
  if(!current)throw new Error("Member not found");
  if(findCommitteeMemberDupe(current.committeeId,patch.memberName||current.memberName,patch.designation||current.designation,id)){
    throw {validation:{memberName:"Duplicate member in this committee."}};
  }
  updateColl("committeeMembers",function(a){return a.map(function(m){return m.id===id?Object.assign({},m,patch,{updatedAt:nowIso()}):m;});});
  audit({userId:session.userId,role:session.role,action:"committee.member.update",module:"committeeMembers",recordId:id});
}
function removeCommitteeMember(session,id){
  requirePermission(session,"committees.manage");blockIfReadOnly(session);
  updateColl("committeeMembers",function(a){return a.map(function(m){return m.id===id?Object.assign({},m,{status:"Removed",removedAt:nowIso()}):m;});});
  audit({userId:session.userId,role:session.role,action:"committee.member.remove",module:"committeeMembers",recordId:id});
  var removed=null;for(var i=0;i<state.committeeMembers.length;i++)if(state.committeeMembers[i].id===id){removed=state.committeeMembers[i];break;}
  if(removed){
    var remaining=state.committeeMembers.filter(function(m){return m.committeeId===removed.committeeId&&m.status==="Active";}).sort(function(a,b){return (a.serialNo||0)-(b.serialNo||0);});
    remaining.forEach(function(m,idx){
      updateColl("committeeMembers",function(a){return a.map(function(x){return x.id===m.id?Object.assign({},x,{serialNo:idx+1}):x;});});
    });
  }
}

function createAssignment(session,data){
  if(session.role!=="teacher"&&session.role!=="chairman"&&!isFullAccess(session))throw new Error("Only teachers or Chairman");
  blockIfReadOnly(session);
  var e={};
  if(!data.title||!data.title.trim())e.title="Title required";
  if(!data.courseId)e.courseId="Course required";
  if(!data.dueDate)e.dueDate="Due date required";
  if(Object.keys(e).length)throw {validation:e};
  var row=Object.assign({id:uid("asg"),createdAt:nowIso()},data,{
    teacherId:session.linkedId||session.userId,teacherName:session.displayName,status:"Open"
  });
  updateColl("assignments",function(a){return a.concat([row]);});
  audit({userId:session.userId,role:session.role,action:"assignment.create",module:"assignments",recordId:row.id,after:row});
  var c=state.courses.find(function(x){return x.id===data.courseId;});
  var targets=state.students.filter(function(s){
    if(data.semesterId&&s.currentSemesterId!==data.semesterId)return false;
    if(data.sectionId&&s.currentSectionId!==data.sectionId)return false;
    return s.status==="Active";
  });
  targets.forEach(function(s){
    notifyUser(s.id,"student","New Assignment",(c?c.code+" "+c.name+": ":"")+data.title+" — Due "+fmtDate(data.dueDate),{relatedRecordId:row.id,relatedModule:"assignments",relatedRoute:"#/app/my-assignments"});
  });
  return row;
}
function submitAssignment(session,data){
  if(session.role!=="student")throw new Error("Only students");
  var a=null;for(var i=0;i<state.assignments.length;i++)if(state.assignments[i].id===data.assignmentId){a=state.assignments[i];break;}
  if(!a)throw new Error("Assignment not found");
  var existing=state.assignmentSubmissions.find(function(s){return s.assignmentId===data.assignmentId&&s.studentId===session.linkedId;});
  if(existing)throw new Error("Already submitted");
  var submittedAt=new Date();
  var dueAt=/^\d{4}-\d{2}-\d{2}$/.test(a.dueDate||"")?new Date(a.dueDate+"T23:59:59"):new Date(a.dueDate);
  var row={id:uid("sub"),assignmentId:data.assignmentId,studentId:session.linkedId,studentName:session.displayName,notes:data.notes||"",fileDataUrl:data.fileDataUrl||null,fileName:data.fileName||null,fileType:data.fileType||null,submittedAt:submittedAt.toISOString(),status:submittedAt>dueAt?"Late":"Submitted",grade:null,feedback:""};
  updateColl("assignmentSubmissions",function(x){return x.concat([row]);});
  audit({userId:session.userId,role:session.role,action:"assignment.submit",module:"assignmentSubmissions",recordId:row.id});
  if(a.teacherId)notifyUser(a.teacherId,"teacher","Assignment Submitted",session.displayName+" submitted \""+a.title+"\"",{relatedRecordId:row.id,relatedModule:"assignmentSubmissions",relatedRoute:"#/app/assignments"});
  return row;
}
function gradeAssignment(session,subId,grade,feedback){
  if(session.role!=="teacher"&&session.role!=="chairman")throw new Error("Permission denied");
  updateColl("assignmentSubmissions",function(a){return a.map(function(s){return s.id===subId?Object.assign({},s,{grade:grade,feedback:feedback||"",gradedAt:nowIso(),gradedBy:session.userId,status:"Graded"}):s;});});
  var sub=null;for(var i=0;i<state.assignmentSubmissions.length;i++)if(state.assignmentSubmissions[i].id===subId){sub=state.assignmentSubmissions[i];break;}
  if(sub)notifyUser(sub.studentId,"student","Assignment Graded","Your submission got: "+grade,{relatedRecordId:subId,relatedModule:"assignmentSubmissions",relatedRoute:"#/app/my-assignments"});
}

/* ====================================================== */
function getReminderStore(){
  try{var raw=localStorage.getItem(CLASS_REMINDER_KEY);return raw?JSON.parse(raw):{};}catch(e){return {};}
}
function saveReminderStore(o){try{localStorage.setItem(CLASS_REMINDER_KEY,JSON.stringify(o));}catch(e){}}
function checkClassReminders(){
  var today=todayIso();
  var todayDay=dayOfWeek(new Date());
  var nowMin=t2m(new Date().toTimeString().slice(0,5));
  var store=getReminderStore();
  state.timetable.filter(function(t){return t.day===todayDay&&t.status==="Active";}).forEach(function(slot){
    var startMin=t2m(slot.startTime);
    var diff=startMin-nowMin;
    if(diff>=0&&diff<=5){
      var key=today+"_"+slot.id;
      if(store[key])return;
      store[key]=true;
      var c=state.courses.find(function(x){return x.id===slot.courseId;});
      var msg=(c?c.code+" "+c.name:"Class")+" starts at "+slot.startTime;
      /* Teacher */
      if(slot.teacherId)notifyUser(slot.teacherId,"teacher","Class Starting Soon",msg,{relatedModule:"timetable",relatedRoute:"#/app/my-timetable"});
      /* Students in that sem+sec */
      state.students.filter(function(s){return s.currentSemesterId===slot.semesterId&&s.currentSectionId===slot.sectionId&&s.status==="Active";}).forEach(function(s){
        notifyUser(s.id,"student","Class Starting Soon",msg+" — don't be late!",{relatedModule:"timetable",relatedRoute:"#/app/my-timetable"});
      });
    }
  });
  saveReminderStore(store);
}
function testClassReminder(){
  var s=getSettings();var today=dayOfWeek(new Date());
  var slot=state.timetable.find(function(t){return t.day===today&&t.status==="Active";})||state.timetable[0];
  if(!slot){toast("No timetable slot to test","warn");return;}
  var c=state.courses.find(function(x){return x.id===slot.courseId;});
  var msg="[TEST] "+(c?c.code+" "+c.name:"Class")+" starts at "+slot.startTime;
  if(slot.teacherId)notifyUser(slot.teacherId,"teacher","Class Starting Soon",msg,{relatedModule:"timetable",relatedRoute:"#/app/my-timetable"});
  state.students.filter(function(s){return s.currentSemesterId===slot.semesterId&&s.currentSectionId===slot.sectionId;}).forEach(function(s){
    notifyUser(s.id,"student","Class Starting Soon",msg,{relatedModule:"timetable",relatedRoute:"#/app/my-timetable"});
  });
  toast("Test reminder sent","success");
}

/* ============ UI PRIMITIVES ============ */
function toast(msg,type,title){
  type=type||"info";
  var el=document.createElement("div");
  el.className="toast "+type;
  el.innerHTML="<strong>"+esc(title||(type==="success"?"Success":type==="error"?"Error":type==="warn"?"Warning":"Info"))+"</strong><p>"+esc(msg)+"</p>";
  document.getElementById("toast-root").appendChild(el);
  setTimeout(function(){el.style.opacity="0";el.style.transform="translateX(30px)";el.style.transition="all .3s";},3400);
  setTimeout(function(){el.remove();},3800);
}
function labelIconButtons(root){
  $$("button",root).forEach(function(button){
    if(!button.querySelector("svg")||button.textContent.trim())return;
    var label=button.getAttribute("aria-label")||button.getAttribute("title")||"";
    if(!label&&button.id==="menuBtn")label="Open navigation";
    if(!label&&button.hasAttribute("data-close"))label="Close dialog";
    if(!label&&button.hasAttribute("data-edit"))label="Edit record";
    if(!label&&button.hasAttribute("data-del"))label="Delete record";
    if(!label&&button.hasAttribute("data-editm"))label="Edit committee member";
    if(!label&&button.hasAttribute("data-delm"))label="Remove committee member";
    if(label){
      button.setAttribute("aria-label",label);
      button.title=label;
      if(button.hasAttribute("data-edit")||button.hasAttribute("data-del")||button.hasAttribute("data-editm")||button.hasAttribute("data-delm"))button.classList.add("icon-action");
    }
  });
}
function openModal(o){
  var root=document.getElementById("modal-root");
  var bd=document.createElement("div");
  bd.className="modal-backdrop";
  bd.innerHTML='<div class="modal '+(o.size==="lg"?"modal-lg":"")+'"><div class="modal-header"><h3>'+esc(o.title)+'</h3><button class="icon-btn" data-close>'+ICONS.x+'</button></div><div class="modal-body">'+o.bodyHtml+'</div><div class="modal-footer">'+(o.footerHtml||"")+'</div></div>';
  root.appendChild(bd);
  labelIconButtons(bd);
  var close=function(){bd.remove();};
  bd.querySelector("[data-close]").onclick=close;
  bd.addEventListener("click",function(e){if(e.target===bd)close();});
  if(o.onMount)o.onMount(bd,close);
  return {el:bd,close:close};
}
function confirmDialog(o){
  return new Promise(function(res){
    var m=openModal({title:o.title||"Confirm",bodyHtml:"<p>"+esc(o.message)+"</p>",footerHtml:'<button class="btn btn-ghost" data-cancel>Cancel</button><button class="btn '+(o.danger?"btn-danger":"btn-primary")+'" data-confirm>'+esc(o.confirmLabel||"Confirm")+'</button>'});
    m.el.querySelector("[data-cancel]").onclick=function(){m.close();res(false);};
    m.el.querySelector("[data-confirm]").onclick=function(){m.close();res(true);};
  });
}
function textInputDialog(o){
  return new Promise(function(resolve){
    var required=o.required===true;
    var m=openModal({
      title:o.title||"Add remarks",
      bodyHtml:'<div class="field"><label for="workflowReason">'+esc(o.label||"Reason")+(required?' <span class="req">*</span>':'')+'</label><textarea id="workflowReason" rows="4" maxlength="500"'+(required?' required aria-required="true"':'')+' placeholder="'+esc(o.placeholder||"")+'"></textarea><div id="workflowReasonError" class="err-msg" role="alert"></div></div>',
      footerHtml:'<button class="btn btn-ghost" data-cancel>Cancel</button><button class="btn '+(o.danger?"btn-danger":"btn-primary")+'" data-submit>'+esc(o.submitLabel||"Continue")+'</button>'
    });
    var settled=false;
    var finish=function(value){if(settled)return;settled=true;m.close();resolve(value);};
    var input=m.el.querySelector("#workflowReason");
    var closeButton=m.el.querySelector("[data-close]");
    closeButton.onclick=function(){finish(null);};
    m.el.querySelector("[data-cancel]").onclick=function(){finish(null);};
    m.el.addEventListener("click",function(e){if(e.target===m.el)finish(null);});
    m.el.querySelector("[data-submit]").onclick=function(){
      var value=input.value.trim();
      if(required&&!value){
        m.el.querySelector("#workflowReasonError").textContent="Reason is required.";
        input.focus();
        return;
      }
      finish(value);
    };
    input.focus();
  });
}
function downloadFile(filename,content,mime){
  var blob=new Blob([content],{type:mime||"text/plain"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");a.href=url;a.download=filename;a.click();
  setTimeout(function(){URL.revokeObjectURL(url);},500);
}
function exportCsv(filename,headers,rows){
  var csv=[headers].concat(rows).map(function(r){return r.map(function(c){return '"'+String(c==null?"":c).replace(/"/g,'""')+'"';}).join(",");}).join("\n");
  downloadFile(filename,csv,"text/csv;charset=utf-8;");toast("CSV downloaded","success");
}
function uploadFile(file){
  return new Promise(function(res,rej){
    if(file.size>5*1024*1024)return rej(new Error("Max 5 MB"));
    var r=new FileReader();
    r.onload=function(){res({fileName:file.name,fileType:file.type,fileSize:file.size,dataUrl:r.result});};
    r.onerror=rej;r.readAsDataURL(file);
  });
}
function statCard(l,v,h,c){return '<div class="stat-card '+(c||"")+'"><div class="label">'+esc(l)+'</div><div class="value">'+v+'</div>'+(h?'<div class="hint">'+esc(h)+'</div>':"")+'</div>';}
