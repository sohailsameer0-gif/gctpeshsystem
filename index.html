function LoginPage(){
  var accounts=makeDemoAccounts().filter(function(a){return a.status==="Approved";});
  var settings=getSettings();
  var mode="login";
  return {
    html:'<div class="login-page"><div class="login-left"><div class="inner"><div>'+(settings.letterheadDataUrl?'<div class="login-lh"><img src="'+settings.letterheadDataUrl+'" alt="GCT Peshawar Letterhead" /></div>':"")+'<h1>Department Academic Management System</h1><p class="sub">Government College of Technology Peshawar — Kohat Road<br/>BSc. Engineering Technology (UET Peshawar affiliated) · 4 Years / 8 Semesters</p><ul class="login-feature-list"><li>Students, Teachers, Parents, Coordinators, Clerks</li><li>QR Attendance with Chairman Kill-Switch</li><li>Offline Attendance Support</li><li>Leave Workflow · Committees (OBE/AT/PT) · Assignments</li></ul></div><div class="copyright">© '+new Date().getFullYear()+' GCT Peshawar · KP-TEVTA</div></div></div><div class="login-right"><div class="login-card"><h2 id="cardTitle">Sign in</h2><p class="sub" id="cardSub">Enter your credentials to continue.</p><div class="login-tabs"><button id="tabLogin" class="active">Login</button><button id="tabRegister">Register</button></div><form id="lf" novalidate><div class="field mb-2"><label>Email</label><input type="email" name="email" autocomplete="username" placeholder="you@gct.edu.pk" /></div><div class="field mb-2"><label>Password</label><input type="password" name="password" autocomplete="current-password" /></div><div class="field mb-2 hidden" id="fRole"><label>Register As</label><select name="role"><option value="teacher">Teacher</option><option value="student">Student</option><option value="parent">Parent</option></select></div><div class="field mb-2 hidden" id="fName"><label>Full Name</label><input name="displayName" /></div><div class="field mb-2 hidden" id="fPwd2"><label>Confirm Password</label><input type="password" name="password2" /></div><div class="err-msg" id="em" style="color:#dc2626;font-size:12px;min-height:16px"></div><button type="submit" class="btn btn-primary btn-block mt-1" id="lb">Sign in</button></form><div class="quick-login" id="quickLogin"><label>Quick Login — Choose a Demo Role</label><select id="demoRole"><option value="">— Select Role to Auto-fill —</option>'+accounts.map(function(a){var lbl=ROLE_LABELS[a.role]||a.role;if(a.email.indexOf("2")>=0)lbl+=" 2";if(a.email.indexOf("3")>=0)lbl+=" 3";return '<option value="'+esc(a.email)+'" data-pw="'+esc(a.password)+'">'+esc(lbl)+'</option>';}).join("")+'</select><div class="hint">Selecting a role will auto-fill the email and password fields above. Just click Sign In.</div></div></div></div></div>',
    mount:function(root){
      var form=$("#lf",root),em=$("#em",root),lb=$("#lb",root);
      var tabLogin=$("#tabLogin",root),tabRegister=$("#tabRegister",root);
      var fRole=$("#fRole",root),fName=$("#fName",root),fPwd2=$("#fPwd2",root);
      var cardTitle=$("#cardTitle",root),cardSub=$("#cardSub",root),quickLogin=$("#quickLogin",root);
      function setMode(m){
        mode=m;
        tabLogin.classList.toggle("active",m==="login");
        tabRegister.classList.toggle("active",m==="register");
        fRole.classList.toggle("hidden",m!=="register");
        fName.classList.toggle("hidden",m!=="register");
        fPwd2.classList.toggle("hidden",m!=="register");
        quickLogin.classList.toggle("hidden",m!=="login");
        cardTitle.textContent=m==="login"?"Sign in":"Create Account";
        cardSub.textContent=m==="login"?"Enter your credentials to continue.":"Register — Chairman approval required.";
        lb.textContent=m==="login"?"Sign in":"Request Registration";
      }
      tabLogin.onclick=function(){setMode("login");};
      tabRegister.onclick=function(){setMode("register");};
      $("#demoRole",root).onchange=function(e){
        var opt=e.target.options[e.target.selectedIndex];
        if(!opt||!opt.value)return;
        form.email.value=opt.value;form.password.value=opt.getAttribute("data-pw")||"";
        em.style.color="#065f46";em.textContent="Credentials auto-filled. Click Sign in.";
      };
      form.onsubmit=function(e){
        e.preventDefault();em.textContent="";
        lb.disabled=true;lb.innerHTML='<span class="loader"></span> Processing...';
        try{
          if(mode==="login"){
            authLogin(form.email.value.trim(),form.password.value);
          }else{
            var data={};new FormData(form).forEach(function(v,k){data[k]=v;});
            if(!data.email||!data.password||!data.displayName)throw new Error("Fill all fields");
            if(data.password!==data.password2)throw new Error("Passwords don't match");
            registerAccount(data);
            em.style.color="#065f46";em.textContent="Request submitted. Chairman approval required.";
            lb.disabled=false;lb.textContent="Request Registration";form.reset();
          }
        }catch(err){
          em.style.color="#dc2626";em.textContent=err.message||"Failed";
          lb.disabled=false;lb.textContent=mode==="login"?"Sign in":"Request Registration";
        }
      };
    }
  };
}

el>Status</label><select name="status">'+STUDENT_STATUS.map(function(s){return '<option '+(v.status===s?"selected":"")+'>'+s+'</option>';}).join("")+'</select></div></div></form>';

function TimetablePage(ctx){
  var s=ctx.session;
  var canManage=s.role==="chairman"||s.role==="clerk"||isFullAccess(s);
  var activePath=ctx.params&&ctx.params.id?"#/app/timetable":"#/app/timetable";
  return AppShell({
    session:s,activePath:"#/app/timetable",title:"Timetable",
    childrenHtml:'<div class="card"><div class="card-header"><h3>Timetable ('+state.timetable.length+' slots)</h3>'+(canManage?'<button class="btn btn-primary btn-sm" id="ns" style="margin-left:auto">'+ICONS.plus+' New Slot</button>':'')+'</div><div class="card-body"><div class="table-wrap"><table class="data"><thead><tr><th>Day</th><th>Time</th><th>Course</th><th>Teacher</th><th>Semester</th><th>Section</th><th>Class</th><th>Type</th><th>Live</th>'+(canManage?'<th></th>':'')+'</tr></thead><tbody id="ttBody"></tbody></table></div></div></div>',
    onMount:function(root){
      var render=function(){
        var tableBody=$("#ttBody",root);
        if(!tableBody)return;
        var nowDay=dayOfWeek(new Date());
        var nowMin=t2m(new Date().toTimeString().slice(0,5));
        var slots=state.timetable.slice().sort(function(a,b){return DAYS.indexOf(a.day)-DAYS.indexOf(b.day)||t2m(a.startTime)-t2m(b.startTime);});
        tableBody.innerHTML=slots.map(function(t){
          var c=state.courses.find(function(x){return x.id===t.courseId;});
          var te=state.teachers.find(function(x){return x.id===t.teacherId;});
          var sem=state.semesters.find(function(x){return x.id===t.semesterId;});
          var sec=state.sections.find(function(x){return x.id===t.sectionId;});
          var liveBadge="";var rowClass="";
          if(t.day===nowDay){
            var st=t2m(t.startTime),en=t2m(t.endTime);
            if(nowMin>=st&&nowMin<en){rowClass="slot-live";liveBadge='<span class="live-badge">LIVE NOW</span>';}
            else if(nowMin<st&&nowMin>=st-30){rowClass="slot-next";liveBadge='<span class="badge badge-warn">UPCOMING</span>';}
            else if(nowMin>=en){rowClass="slot-past";liveBadge='<span class="badge badge-gray">PAST</span>';}
          }
          return '<tr class="'+rowClass+'"><td><strong>'+esc(t.day)+'</strong></td><td>'+esc(t.startTime)+'–'+esc(t.endTime)+'</td><td>'+esc(c?c.code+" "+c.name:"")+'</td><td>'+esc(te?te.name:"")+'</td><td>'+esc(sem?sem.name:"")+'</td><td>'+esc(sec?sec.name:"")+'</td><td>'+esc(t.className||"")+'</td><td>'+esc(t.slotType||"")+'</td><td>'+liveBadge+'</td>'+(canManage?'<td class="text-right"><button class="btn btn-ghost btn-sm" data-edit="'+t.id+'">'+ICONS.edit+'</button> <button class="btn btn-ghost btn-sm" data-del="'+t.id+'">'+ICONS.trash+'</button></td>':'')+'</tr>';
        }).join("")||'<tr><td colspan="'+(canManage?10:9)+'" class="empty">No slots.</td></tr>';
        $$("[data-edit]",root).forEach(function(b){b.onclick=function(){var t=state.timetable.find(function(x){return x.id===b.dataset.edit;});openTimetableForm({session:s,existing:t,onSaved:render});};});
        $$("[data-del]",root).forEach(function(b){b.onclick=function(){confirmDialog({title:"Delete Slot",message:"Confirm delete?",confirmLabel:"Delete",danger:true}).then(function(ok){if(!ok)return;try{M.deleteSlot(s,b.dataset.del);toast("Deleted","success");render();}catch(e){toast(e.message,"error");}});};});
      };
      var b=$("#ns",root);if(b)b.onclick=function(){openTimetableForm({session:s,onSaved:render});};
      render();
      var refreshTimer=setInterval(render,30000);
      var stopRefresh=function(){clearInterval(refreshTimer);window.removeEventListener("hashchange",stopRefresh);};
      window.addEventListener("hashchange",stopRefresh);
    }
  });
}

    }

}

function SharedFilesPage(ctx){

  return AppShell({

    '<div class="card"><div class="card-header"><h3>'+(isChair?"Files I Shared":"Files Shared With Me")+' ('+files.length+')</h3></div><div class="card-body"><div class="table-wrap"><table class="data"><thead><tr><th>Title</th><th>Description</th><th>Shared By</th><th>Roles</th><th>When</th><th></th></tr></thead><tbody>'+

      return '<tr><td><strong>'+esc(f.title)+'</strong>'+(f.fileName?'<div class="muted">'+esc(f.fileName)+'</div>':'')+'</td><td>'+esc(f.description||"")+'</td><td>'+esc(f.sharedByName||"")+'</td><td>'+esc((f.sharedWithRoles||[]).join(", "))+'</td><td>'+fmtDT(f.sharedAt)+'</td><td><a class="btn btn-ghost btn-sm" href="'+f.dataUrl+'" download="'+esc(f.fileName||"file")+'">'+ICONS.download+' Download</a>'+(isChair&&f.sharedBy===s.userId?' <button class="btn btn-ghost btn-sm" data-del="'+f.id+'">'+ICONS.trash+'</button>':'')+'</td></tr>';
    }).join("")||'<tr><td colspan="6" class="empty">No shared files.</td></tr>')+
    '</tbody></table></div></div></div>',
    onMount:function(root){
      var form=$("#sf",root);
      if(form)form.onsubmit=function(e){
        e.preventDefault();
        var d={};new FormData(e.target).forEach(function(v,k){if(k!=="file"&&k.indexOf("role_")!==0)d[k]=v;});
        d.sharedWithRoles=[];
        if(root.querySelector("input[name=role_coordinator]").checked)d.sharedWithRoles.push("coordinator");
        if(root.querySelector("input[name=role_clerk]").checked)d.sharedWithRoles.push("clerk");
        if(!d.sharedWithRoles.length){toast("Select at least one role","error");return;}
        var file=$("input[type=file]",root).files[0];
        if(!file){toast("Choose a file","error");return;}
        uploadFile(file).then(function(r){
          d.dataUrl=r.dataUrl;d.fileName=r.fileName;d.fileType=r.fileType;d.fileSize=r.fileSize;
          try{M.shareFile(s,d);toast("Shared","success");renderRoute();}catch(err){toast(err.message,"error");}
        }).catch(function(err){toast(err.message,"error");});
      };
      $$("[data-del]",root).forEach(function(b){b.onclick=function(){confirmDialog({title:"Delete File",message:"Confirm?",confirmLabel:"Delete",danger:true}).then(function(ok){if(!ok)return;M.deleteSharedFile(s,b.dataset.del);toast("Deleted","success");renderRoute();});};});
    }
  });
}

              audit({userId:s.userId,role:s.role,action:"student.import",module:"students",recordId:row.id,after:row});

            });
            updateColl("students",function(a){return a.concat(validRows);});

        };

function parseCsvRows(text){
  var rows=[],row=[],cell="",quoted=false;
  for(var i=0;i<text.length;i++){
    var ch=text[i];
    if(quoted){
      if(ch==='"'){
        if(text[i+1]==='"'){cell+='"';i++;}
        else quoted=false;
      }else cell+=ch;
    }else if(ch==='"'&&cell.length===0)quoted=true;
    else if(ch===","){row.push(cell);cell="";}
    else if(ch==="\n"||ch==="\r"){
      if(ch==="\r"&&text[i+1]==="\n")i++;
      row.push(cell);cell="";
      if(row.some(function(value){return value!=="";}))rows.push(row);
      row=[];
    }else cell+=ch;
  }
  if(quoted)throw new Error("CSV contains an unclosed quoted field");
  if(cell!==""||row.length){row.push(cell);if(row.some(function(value){return value!=="";}))rows.push(row);}
  return rows;
}

}

function findRoute(path){
  for(var i=0;i<routes.length;i++){
    var r=routes[i];var keys=[];
    var pattern=r.path.replace(/:([^/]+)/g,function(_,k){keys.push(k);return "([^/]+)";});
    var m=path.match(new RegExp("^"+pattern+"$"));
    if(m){var params={};keys.forEach(function(k,idx){params[k]=decodeURIComponent(m[idx+1]);});return {route:r,params:params};}
  }
  return null;
}
function routeMatches(pattern,path){
  var expected=pattern.split("/"),actual=path.split("/");
  if(expected.length!==actual.length)return false;
  for(var i=0;i<expected.length;i++)if(expected[i].charAt(0)!==":"&&expected[i]!==actual[i])return false;
  return true;
}
function isRouteAllowed(session,path){
  if(session.role==="chairman")return true;
  var patterns=[];
  (NAV[session.role]||[]).forEach(function(group){group.items.forEach(function(item){patterns.push(item.path);});});
  if(patterns.indexOf("#/app/students")>=0)patterns.push("#/app/students/:id");
  if(patterns.indexOf("#/app/committees")>=0)patterns.push("#/app/committees/:id");
  return patterns.some(function(pattern){return routeMatches(pattern,path);});
}
function renderRoute(){
  var path=location.hash||"#/login";
  var session=state.session;
  if(path!=="#/login"&&!session){location.hash="#/login";return;}
  if(path==="#/login"&&session){location.hash="#/app/dashboard";return;}
  var match=findRoute(path);
  if(!match){
    if(!session){location.hash="#/login";return;}
    var shell=AppShell({session:session,activePath:path,title:"Not Found",childrenHtml:'<div class="empty-state"><h4>Page not found</h4><p>'+esc(path)+'</p></div>'});
    mountPage(shell);return;
  }
  if(session&&!isRouteAllowed(session,path)){
    mountPage(AppShell({session:session,activePath:path,title:"Access restricted",childrenHtml:'<div class="empty-state"><h4>This page is not available for your account</h4></div>'}));return;
  }
  var page=match.route.page({session:session,params:match.params});
  mountPage(page);
}
var iconButtonObserver=null;
function mountPage(page){
  var root=document.getElementById("app-root");
  if(iconButtonObserver){iconButtonObserver.disconnect();iconButtonObserver=null;}
  root.innerHTML=page.html;
  if(page.mount)page.mount(root);
  if(page.mountExtra)page.mountExtra(root);
  labelIconButtons(root);
  iconButtonObserver=new MutationObserver(function(){labelIconButtons(root);});
  iconButtonObserver.observe(root,{childList:true,subtree:true});
}
window.addEventListener("hashchange",renderRoute);
